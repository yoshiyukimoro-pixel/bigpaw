<!doctype html>
<html lang="ja" data-bp-page-theme="operator">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>出産予定からの予約希望追跡｜BIG PAW運営</title>
<link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="assets/account-page-theme.css">
<style>body{background:#fffbea;color:#483a3d}main{max-width:1100px;margin:24px auto;padding:0 16px}.item{padding:16px;margin:12px 0;border:1px solid #dbd0ae;border-radius:13px;background:white}.tag{display:inline-block;background:#fff0bc;border:1px solid #d7aa57;border-radius:99px;padding:4px 10px;font-weight:700;margin:5px 0}.tag.done{background:#ecf8ee;border-color:#9ac49b}small{color:#5f6272;line-height:1.6}.action{display:inline-block;margin-top:9px;padding:9px 12px;border:1px solid #cba35b;border-radius:8px}input{max-width:100%;padding:12px;width:360px;border:1px solid #cba35b;border-radius:8px}</style>
</head><body class="bp-account-page"><main>
<p><a href="operator-admin.html">← 運営ダッシュボード</a></p><h1>出産予定からの予約希望追跡</h1>
<p>予約希望を受けた後、実際に生まれた子犬と通常の成約申請へ紐付いているかを確認できます。未紐付けは成約・キャンセルの確定を意味しません。</p>
<label for="filter">犬舎名・購入希望者・掲載名で絞り込む</label><p><input id="filter" placeholder="検索"></p>
<p id="count" role="status">読み込み中…</p><div id="rows" aria-live="polite"></div>
</main><script src="assets/api.js"></script><script>
const el=id=>document.getElementById(id);
const fmt=ts=>ts?new Date(ts*1000).toLocaleDateString('ja-JP',{timeZone:'Asia/Tokyo'}):'';
let items=[];
function render(){
 const key=el('filter').value.trim().toLowerCase();
 const filtered=items.filter(x=>[x.kennel_name,x.name,x.email,x.title,x.linked_puppy_name].some(t=>String(t||'').toLowerCase().includes(key)));
 const unlinked=items.filter(x=>!x.linked_inquiry_id).length;
 el('count').textContent='予約希望 '+items.length+'件／子犬への紐付け待ち '+unlinked+'件'+(key?'／検索結果 '+filtered.length+'件':'');
 const root=el('rows');root.replaceChildren();
 if(!filtered.length){root.textContent='対象の予約希望はありません。';return}
 for(const x of filtered){
   const card=document.createElement('article');card.className='item';
   const head=document.createElement('strong');head.textContent=x.kennel_name+'／'+x.title;card.append(head);
   const state=document.createElement('div');state.className='tag'+(x.linked_inquiry_id?' done':'');
   state.textContent=x.linked_inquiry_id?'✅ 子犬に紐付け済み':'⚠ 子犬への紐付け未確認';card.append(state);
   const summary=document.createElement('p');summary.textContent='購入希望者：'+x.name+'（'+x.email+'）／初回：'+fmt(x.created_at)+'／現在：'+x.status;card.append(summary);
   const detail=document.createElement('p');detail.textContent=x.linked_inquiry_id?'子犬：'+(x.linked_puppy_name||x.linked_puppy_id)+'／'+(x.linked_deal_id?'通常の成約管理：'+(x.linked_deal_status||'確認中'):'通常の成約申請：未確認'):'出産予定日：'+(x.expected_birth||'未定')+'／掲載：'+x.listing_status;card.append(detail);
   const action=document.createElement('a');action.className='action';action.href='planned-litter-manage.html?breederId='+encodeURIComponent(x.breeder_id);action.textContent='この犬舎の予約希望を確認';card.append(action);
   root.append(card);
 }
}
el('filter').addEventListener('input',render);
(async()=>{try{const me=await BigPawAPI.me();if(me.role!=='operator')throw new Error('運営アカウント専用です。');items=await BigPawAPI.request('/planned-litters/operator/overview');render()}catch(err){el('count').textContent='読み込めませんでした：'+(err.message||'ログインをご確認ください。');el('rows').replaceChildren()}})();
</script><script src="/auth-return-fix.js"></script></body></html>
