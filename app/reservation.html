<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>予約金｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="topbar">🐾 BIG PAW｜予約金</div><header class="site-header"><div class="wrap nav"><a class="logo" href="index.html"><span class="logo-mark">🐾</span>BIG PAW</a><nav class="navlinks"><a href="deal.html">商談管理</a><a href="mypage.html">マイページ</a></nav></div></header><div class="hero-mini"><div class="wrap"><h1>予約金を確認</h1><p>支払う前に金額・条件・対象の子犬を確認します。</p></div></div><main class="wrap"><section class="section" style="max-width:820px;margin:auto"><div class="card pad"><div class="stepbar"><div class="step">1. 見学</div><div class="step active">2. 予約金</div><div class="step">3. 契約</div><div class="step">4. お迎え</div></div><div id="table" class="tablelike"><div class="table-row"><div>対象</div><div id="target">-</div></div><div class="table-row"><div>ブリーダー</div><div id="breeder">-</div></div><div class="table-row"><div>生体価格</div><div><b id="price">-</b></div></div><div class="table-row"><div>予約金</div><div><b id="amount" style="font-size:22px">-</b></div></div><div class="table-row"><div>残金予定</div><div id="balance">-</div></div></div><div id="paid" class="notice" style="display:none;margin-top:16px">予約金は入金済みです。</div><div class="notice" style="margin-top:16px">予約金の支払い状況はBIG PAW内で管理します。本番環境では購入者自身で「入金済み」へ変更できません。</div><div class="field" style="margin-top:18px"><label><input type="checkbox" id="agree"> 予約金・キャンセル条件を確認しました</label></div><button id="payBtn" class="btn btn-main btn-wide" onclick="pay()">予約金を入金済みとして記録</button><a id="back" class="btn btn-sub btn-wide" style="margin-top:10px" href="deal.html">商談管理に戻る</a></div></section></main><script src="assets/app.js"></script><script src="assets/api.js"></script><script src="assets/bridge.js"></script><script src="assets/workflow.js"></script><script>
let ctx=null,sum=null,paymentMode='demo';async function init(){try{ctx=await BigPawWorkflow.context();if(!ctx.deal)throw new Error('商談がありません');sum=await BigPawBridge.dealSummary(ctx.deal.id);const h=await BigPawAPI.health().catch(()=>({paymentMode:'demo'}));paymentMode=h.paymentMode||'demo';target.textContent=(ctx.puppy?.breed||'')+'｜'+(ctx.puppy?.name||'子犬');breeder.textContent=ctx.puppy?.breeder||ctx.inquiry.breeder||'ブリーダー';price.textContent=BigPawWorkflow.yen(sum.deal.total_price);amount.textContent=BigPawWorkflow.yen(sum.deal.reservation_amount);balance.textContent=BigPawWorkflow.yen(sum.deal.total_price-sum.deal.reservation_amount);back.href='deal.html?inquiry='+encodeURIComponent(ctx.inquiry.id);if(sum.payment?.status==='paid'){paid.style.display='block';payBtn.disabled=true;payBtn.textContent='入金済み'}else if(paymentMode==='demo'){payBtn.textContent=BigPawWorkflow.yen(sum.deal.reservation_amount)+'を入金済みとして記録（デモ）'}else{payBtn.disabled=true;payBtn.textContent='入金確認待ち';payBtn.previousElementSibling.querySelector('label').insertAdjacentHTML('beforeend','<br><span class="muted">支払い方法はBIG PAWまたはブリーダーからの案内をご確認ください。運営で入金確認後、自動的に反映されます。</span>')}}catch(e){alert('ログインして商談から開いてください。')}}async function pay(){if(paymentMode!=='demo'){alert('本番環境では運営の入金確認後に反映されます。');return}if(!agree.checked){alert('条件確認にチェックしてください');return}try{await BigPawBridge.payReservation(ctx.deal.id,sum.deal.reservation_amount);alert('予約金の入金済みとして保存しました');location.href='contract.html?inquiry='+encodeURIComponent(ctx.inquiry.id)}catch(e){alert(e.message||'保存できませんでした')}}init();
</script></body></html>
