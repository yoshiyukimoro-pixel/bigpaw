<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>商談・お迎え管理｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"><style>.timeline{display:grid}.trow{display:grid;grid-template-columns:34px 1fr;gap:12px}.dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#fff;border:2px solid #edbfd1;font-weight:900;color:#c14f7e}.done .dot{background:#ef7fa8;color:#fff}.tcontent{padding:4px 0 18px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}@media(max-width:620px){.quick{grid-template-columns:1fr}}</style></head><body><div class="topbar">🐾 大型犬専門｜BIG PAW</div><header class="site-header"><div class="wrap nav"><a class="logo" href="index.html"><span class="logo-mark">🐾</span>BIG PAW</a><nav class="navlinks"><a href="messages.html">メッセージ</a><a href="mypage.html">マイページ</a></nav></div></header><div class="hero-mini"><div class="wrap"><h1>商談・お迎え管理</h1><p id="subtitle">取引情報を読み込み中…</p></div></div><main class="wrap"><section class="section"><div id="noDeal" class="notice" style="display:none">問い合わせ後に利用できます。</div><div id="content"><div class="grid two"><div class="card pad"><h2>現在の進み具合</h2><div class="timeline"><div class="trow done"><div class="dot">✓</div><div class="tcontent"><b>問い合わせ</b><span class="muted">ブリーダーとのやり取り</span></div></div><div class="trow" id="stepVisit"><div class="dot">2</div><div class="tcontent"><b>見学・対面確認</b><span class="muted" id="visitText">日程未設定</span></div></div><div class="trow" id="stepPay"><div class="dot">3</div><div class="tcontent"><b>予約金・契約</b><span class="muted" id="payText">未完了</span></div></div><div class="trow" id="stepPickup"><div class="dot">4</div><div class="tcontent"><b>お迎え</b><span class="muted" id="pickupText">未設定</span></div></div><div class="trow" id="stepDone"><div class="dot">5</div><div class="tcontent"><b>成約・口コミ</b><span class="muted" id="doneText">進行中</span></div></div></div></div><aside><div class="card pad sticky"><h2>商談情報</h2><div class="fact-grid"><div class="fact"><span>生体価格</span><b id="total">-</b></div><div class="fact"><span>予約金</span><b id="reserve">-</b></div><div class="fact"><span>ステータス</span><b id="status">-</b></div><div class="fact"><span>残金</span><b id="balance">-</b></div></div></div></aside></div><div class="quick" style="margin-top:20px"><a id="reservationLink" class="card pad" href="reservation.html"><b>💳 予約金</b><div class="muted">金額・支払い状況</div></a><a id="contractLink" class="card pad" href="contract.html"><b>📝 契約</b><div class="muted">契約内容・署名</div></a><a id="pickupLink" class="card pad" href="pickup.html"><b>🚗 お迎え</b><div class="muted">日時・完了確認</div></a></div></div></section></main><script src="assets/app.js"></script><script src="assets/api.js"></script><script src="assets/bridge.js"></script><script src="assets/workflow.js"></script><script>
let ctx=null;async function init(){try{ctx=await BigPawWorkflow.context();if(!ctx.inquiry||!ctx.deal){noDeal.style.display='block';content.style.display='none';return}subtitle.textContent=(ctx.puppy?.breeder||'ブリーダー')+'｜'+(ctx.puppy?.name||'子犬');const sum=await BigPawBridge.dealSummary(ctx.deal.id);const d=sum.deal;total.textContent=BigPawWorkflow.yen(d.total_price);reserve.textContent=BigPawWorkflow.yen(d.reservation_amount);balance.textContent=BigPawWorkflow.yen(d.total_price-d.reservation_amount);status.textContent=d.status;const v=await BigPawBridge.visit(ctx.inquiry.id).catch(()=>null);if(v){stepVisit.classList.add('done');visitText.textContent=(v.visit_date||'')+' '+(v.visit_time||'')}if(sum.payment?.status==='paid'){stepPay.classList.add('done');payText.textContent='予約金入金済み'}if(sum.contract?.status==='signed')payText.textContent+='・契約署名済み';if(sum.pickup){pickupText.textContent=(sum.pickup.pickup_date||'')+' '+(sum.pickup.pickup_time||'');if(sum.pickup.status==='completed')stepPickup.classList.add('done')}if(d.status==='completed'){stepDone.classList.add('done');doneText.textContent='お迎え完了'}for(const a of [reservationLink,contractLink,pickupLink])a.href=a.getAttribute('href')+'?inquiry='+encodeURIComponent(ctx.inquiry.id)}catch(e){noDeal.style.display='block';noDeal.textContent='ログインして問い合わせから開いてください。';content.style.display='none'}}init();
</script></body></html>
