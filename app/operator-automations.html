<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>自動処理モニター｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"><style>.admin-grid{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.sidebar{background:linear-gradient(180deg,#6d5572,#5b4b62);color:#fff;padding:22px}.sidebar a{display:block;padding:10px 12px;border-radius:10px;margin:4px 0}.sidebar a:hover{background:rgba(255,255,255,.1)}.main{padding:28px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:18px}.stat b{display:block;font-size:28px}.event{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #f0dbe5}.ok{color:#27734b}.warn{color:#b45d20}@media(max-width:800px){.admin-grid{grid-template-columns:1fr}.sidebar{display:none}.main{padding:14px}.grid{grid-template-columns:1fr 1fr}}</style></head><body><div class="admin-grid"><aside class="sidebar"><div class="logo"><span class="logo-mark">🐾</span>BIG PAW</div><p style="opacity:.7">運営管理</p><a href="operator-admin.html">ダッシュボード</a><a href="operator-deal-reports.html">成約申請</a><a href="operator-invoices.html">請求管理</a><a href="operator-backups.html">バックアップ</a><a href="operator-automations.html">自動処理モニター</a><a href="backend-status.html">システム状態</a><a href="index.html">公開サイト ↗</a></aside><main class="main"><div style="display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap"><div><h1>自動処理モニター</h1><p class="muted">請求リマインド・掲載停止/再開・成約申請リマインド・自動バックアップを確認します。</p></div><button class="btn btn-main" id="runBtn">今すぐ実行</button></div><div class="grid"><div class="card stat"><span class="muted">期限超過請求</span><b id="overdue">-</b></div><div class="card stat"><span class="muted">掲載停止中</span><b id="suspended">-</b></div><div class="card stat"><span class="muted">成約申請待ち</span><b id="reports">-</b></div><div class="card stat"><span class="muted">監視間隔</span><b id="interval">-</b></div></div><section class="section"><div class="card pad"><h2>自動処理</h2><div id="events">読み込み中…</div></div></section><section class="section"><div class="card pad"><h2>バックアップ</h2><div id="backup" class="notice">読み込み中…</div></div></section><div id="msg" class="notice" style="display:none"></div></main></div><script src="assets/app.js"></script><script src="assets/api.js"></script><script>
const fmt=t=>t?new Date(t*1000).toLocaleString('ja-JP'):'未実行';
async function load(){try{const s=await BigPawAPI.operatorAutomations();overdue.textContent=s.overdueInvoices;suspended.textContent=s.suspendedBreeders;reports.textContent=s.pendingCompletionReports;interval.textContent=Math.round(s.intervalSeconds/60)+'分';events.innerHTML=s.events.length?s.events.map(e=>`<div class="event"><div><b>${e.kind}</b><div class="muted">実行回数 ${e.count}</div></div><span>${fmt(e.last_at)}</span></div>`).join(''):'自動イベントはまだありません。';backup.textContent=s.lastBackup?`最新: ${s.lastBackup.filename} / ${fmt(s.lastBackup.created_at)}｜自動バックアップ ${s.autoBackupHours}時間ごと・最大${s.autoBackupKeep}世代`:`まだバックアップはありません。自動バックアップ ${s.autoBackupHours}時間ごと・最大${s.autoBackupKeep}世代`; }catch(e){msg.style.display='block';msg.textContent=e.status===401?'運営アカウントでログインしてください。':'読み込みに失敗しました: '+e.message}}
runBtn.onclick=async()=>{runBtn.disabled=true;try{const r=await BigPawAPI.runOperatorAutomations();msg.style.display='block';msg.textContent=`実行完了：請求通知 ${r.billingReminders}件 / 成約申請確認 ${r.completionNudges}件 / 公開状態変更 ${r.visibilityChanges}件${r.backup?' / バックアップ作成 '+r.backup:''}`;await load()}catch(e){msg.style.display='block';msg.textContent='実行失敗: '+e.message}finally{runBtn.disabled=false}};load();
</script><script src="/auth-return-fix.js"></script><style id="bigpaw-role-theme">body{background:#fff7fb!important}body.bigpaw-breeder-theme{background:#f3f8ff!important}body.bigpaw-operator-theme{background:#fffbea!important}</style><script>(function(){var p=location.pathname;if(p.indexOf("/operator-")>=0)document.body.classList.add("bigpaw-operator-theme");else if(p.indexOf("/breeder-")>=0||p.endsWith("/admin.html"))document.body.classList.add("bigpaw-breeder-theme");})();</script></body></html>
