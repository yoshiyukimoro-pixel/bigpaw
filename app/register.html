<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>会員登録｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="topbar">🐾 大型犬専門｜BIG PAW</div><header class="site-header"><div class="wrap nav"><a class="logo" href="index.html"><span class="logo-mark">🐾</span>BIG PAW</a></div></header><main class="wrap"><section class="section" style="max-width:680px;margin:auto"><form class="card pad" onsubmit="registerUser(event)"><h1>無料会員登録</h1><p class="muted">お気に入り保存やブリーダーとのやり取りに利用します。</p><div class="form-grid"><div class="field"><label>姓 *</label><input id="last" required placeholder="山田"></div><div class="field"><label>名 *</label><input id="first" required placeholder="太郎"></div></div><div class="field"><label>メールアドレス *</label><input id="email" required type="email" placeholder="example@mail.jp"></div><div class="field"><label>パスワード *</label><input id="password" required type="password" minlength="8"></div><label style="display:flex;gap:8px;font-size:13px"><input id="agree" type="checkbox" required> <a href="terms.html">利用規約</a>・<a href="privacy.html">プライバシーポリシー</a>に同意する</label><div id="err" style="color:#c65584;font-weight:800;margin-top:10px"></div><button class="btn btn-main btn-wide" style="margin-top:16px">登録する</button><p class="muted" style="font-size:12px">※サーバー版ではデータベースに保存。ファイルで直接開いた場合はデモ保存になります。</p></form></section></main><script src="assets/app.js"></script><script src="assets/api.js"></script><script src="assets/bridge.js"></script><script>async function registerUser(e){e.preventDefault();err.textContent='';try{await BigPawBridge.register({last:last.value.trim(),first:first.value.trim(),email:email.value.trim(),password:password.value,agreeTerms:agree.checked,agreePrivacy:agree.checked});await BigPawBridge.login(email.value.trim(),password.value);location.href='verify-email.html'}catch(x){err.textContent=x.data?.error==='email_exists'?'このメールアドレスは登録済みです':(x.message||'登録できませんでした')}}</script><script src="/auth-return-fix.js"></script></body></html>
