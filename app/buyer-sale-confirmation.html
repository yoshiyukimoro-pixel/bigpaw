<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>成約・お迎えの確認｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"><style>body{background:#fff7fb;font-size:16px}main{max-width:900px;margin:auto;padding:20px}label{display:block;margin:14px 0}input,select,textarea{padding:10px;width:100%;font:inherit}input[type=checkbox]{width:auto}.item{border-bottom:1px solid #ccc;padding:16px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.notice{margin:14px 0}button{font:inherit}.status{font-weight:bold}#message{white-space:pre-wrap;margin:16px 0}nav{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:20px}</style></head><body><main><nav><a href="mypage.html">管理画面に戻る</a><a href="index.html">BIG PAW</a></nav><h1>成約・お迎えの確認</h1><div id="message" role="status"></div><p>ブリーダーからの報告をご確認ください。内容が違う場合は「いいえ」を選んでください。</p><div id="confirmations">読み込み中…</div><p><a href="login.html">購入者アカウントでログイン</a></p></main><script src="assets/api.js"></script><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const yen=n=>Number(n||0).toLocaleString()+'円'; const api=(p,method='GET',body)=>BigPawAPI.request(p,{method,...(body?{body}: {})});const msg=(s)=>document.getElementById('message').textContent=s;

let busy=false;const questions={sale:'この子のお迎えが決まりましたか？',pickup:'お迎えは完了しましたか？',cancellation:'今回のお迎えはキャンセルになりましたか？'};
async function load(){try{const all=await api('/buyer/sale-confirmations');confirmations.innerHTML=all.length?all.map(c=>{const p=JSON.parse(c.payload);return `<section class="card pad item"><h2>${esc(c.puppy_name)}</h2><p>${esc(questions[c.kind])}</p><p>生体価格：${yen(p.amount)}／お迎え日：${esc(p.pickup_date||'未定')}</p>${c.state==='pending'?`<div class="actions"><button class="btn btn-main" data-id="${esc(c.id)}" data-answer="yes">はい</button><button class="btn btn-sub" data-id="${esc(c.id)}" data-answer="no">いいえ（内容が違います）</button></div>`:`<p>回答済み：${c.answer==='yes'?'はい':'いいえ'}</p>`}</section>`}).join(''):'確認が必要な取引はありません。';confirmations.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(b.dataset.id,b.dataset.answer));}catch(e){confirmations.textContent='ご本人の購入者アカウントでログインしてから、このページを開き直してください。'}}
async function answer(id,value){if(busy||!confirm(value==='yes'?'報告内容が正しいことを確認して回答しますか？':'報告内容が違うことを運営へ知らせますか？'))return;busy=true;try{await api('/buyer/sale-confirmations/answer','POST',{id,answer:value});msg('回答を保存しました。'+(value==='no'?'運営が内容を確認します。':''));await load()}catch(e){msg(e.data?.message||e.message)}finally{busy=false}}load();
</script></body></html>
