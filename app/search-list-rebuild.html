<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>子犬を探す｜BIG PAW</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    :root{--bp-pink:#d978a0;--bp-line:#eadfe5;--bp-muted:#756b70;--bp-soft:#fff8fb;--bp-region:#fff4e3}
    *{box-sizing:border-box}
    html,body{margin:0;background:#fff;color:#222}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body.bp-modal-open{overflow:hidden}
    .bp-search-page{max-width:760px;margin:0 auto;padding:18px 14px 100px;background:#fff}
    .bp-search-page h1{font-size:25px;margin:8px 0 18px}
    .bp-filter-card{background:#fff;border:1px solid #f0e4e9;border-radius:18px;padding:18px;margin-bottom:14px}
    .bp-filter-card h2{font-size:18px;margin:0 0 12px}
    .bp-filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .bp-filter-grid select,.bp-area-open{width:100%;height:48px;border:1px solid var(--bp-line);border-radius:12px;background:#fff;padding:0 9px;font-size:14px;color:#333;text-align:left}
    .bp-area-open{display:flex;align-items:center;justify-content:space-between;gap:8px;overflow:hidden}
    .bp-area-open span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .bp-area-open-arrow{font-size:18px;color:#777;flex:0 0 auto}
    .bp-result-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 2px 9px}
    .bp-result-head h2{margin:0;font-size:20px}
    .bp-result-count{font-weight:900;color:#555;white-space:nowrap}
    .bp-result-list{display:grid;gap:0;background:#fff}
    .bp-puppy-row{display:block;text-decoration:none;color:inherit;background:#fff;padding:14px 0 15px;border-bottom:1px solid #dedede;-webkit-tap-highlight-color:transparent}
    .bp-puppy-row:first-child{padding-top:8px}
    .bp-puppy-title{font-size:19px;font-weight:900;line-height:1.35;margin:0 0 9px;color:#222}
    .bp-puppy-layout{display:grid;grid-template-columns:minmax(0,49%) minmax(0,51%);align-items:stretch;min-height:188px}
    .bp-puppy-photo{position:relative;min-width:0;min-height:188px;background:var(--bp-soft);overflow:hidden}
    .bp-puppy-photo img{display:block;width:100%;height:100%;min-height:188px;object-fit:contain;background:var(--bp-soft)}
    .bp-photo-fallback{height:100%;min-height:188px;display:grid;place-items:center;font-size:62px;background:var(--bp-soft)}
    .bp-gender-badge{position:absolute;left:7px;bottom:7px;background:rgba(255,255,255,.95);border:1px solid rgba(0,0,0,.05);border-radius:999px;padding:4px 8px;font-size:12px;font-weight:900;color:#444}
    .bp-puppy-info{padding:2px 0 2px 13px;display:flex;flex-direction:column;min-width:0}
    .bp-status{font-size:14px;font-weight:900;color:var(--bp-pink);line-height:1.3;margin-bottom:4px}
    .bp-area{font-size:14px;color:#333;line-height:1.35;margin-bottom:8px;overflow-wrap:anywhere}
    .bp-meta{font-size:14px;line-height:1.62;color:var(--bp-muted);overflow-wrap:anywhere}
    .bp-price-wrap{margin-top:auto;padding-top:8px}
    .bp-price-label{font-size:11px;color:#777;line-height:1.2}
    .bp-price{font-size:22px;font-weight:900;line-height:1.2;color:#222}
    .bp-tax{font-size:11px;font-weight:700;color:#777;margin-left:3px}
    .bp-empty{border:1px solid var(--bp-line);border-radius:14px;padding:24px;text-align:center;color:#666;background:#fff;margin-top:8px}
    .bp-bottom-search{position:fixed;left:0;right:0;bottom:0;z-index:100;background:rgba(255,255,255,.98);border-top:1px solid #eee;padding:9px 14px calc(9px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center;gap:12px}
    .bp-clear{border:0;background:transparent;color:#777;text-decoration:underline;font-size:13px;padding:10px}
    .bp-search-btn{border:0;border-radius:999px;background:var(--bp-pink);color:#fff;font-weight:900;font-size:15px;padding:13px 25px;min-width:132px}

    .bp-area-modal[hidden]{display:none!important}
    .bp-area-modal{position:fixed;inset:0;z-index:1000;background:#fff;overflow:auto;-webkit-overflow-scrolling:touch}
    .bp-area-dialog{min-height:100%;max-width:760px;margin:0 auto;background:#fff;padding-bottom:calc(82px + env(safe-area-inset-bottom))}
    .bp-area-head{position:sticky;top:0;z-index:3;background:#fffaf1;border-bottom:1px solid #d9d0c4;padding:14px 14px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .bp-area-head h2{font-size:18px;line-height:1.35;margin:0;color:#57212e}
    .bp-area-close{border:1px solid #a9afb7;background:#f6f7f8;border-radius:8px;padding:8px 11px;font-size:14px;font-weight:700;color:#444}
    .bp-area-all{padding:14px 16px;border-bottom:1px solid #ddd;display:flex;justify-content:center}
    .bp-check{display:inline-flex;align-items:center;gap:7px;font-size:16px;line-height:1.35;cursor:pointer}
    .bp-check input{width:22px;height:22px;margin:0;accent-color:var(--bp-pink);flex:0 0 auto}
    .bp-area-groups{padding:0 14px 14px}
    .bp-region-row{display:grid;grid-template-columns:108px minmax(0,1fr);border:1px solid #d9d2ca;border-top:0}
    .bp-region-row:first-child{border-top:1px solid #d9d2ca}
    .bp-region-name{background:var(--bp-region);padding:14px 9px;display:flex;align-items:center;justify-content:flex-start;border-right:1px solid #d9d2ca;font-weight:800;color:#673039}
    .bp-pref-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 14px;padding:14px}
    .bp-pref-grid .bp-check{font-size:15px;min-width:0}
    .bp-pref-grid .bp-check span{white-space:nowrap}
    .bp-area-actions{position:fixed;left:0;right:0;bottom:0;z-index:4;background:rgba(60,60,60,.86);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:112px minmax(0,1fr);gap:12px}
    .bp-area-actions-inner{display:contents}
    .bp-area-reset{border:0;border-radius:8px;background:#eef1f3;color:#555;font-size:15px;font-weight:800}
    .bp-area-apply{border:0;border-radius:8px;background:var(--bp-pink);color:#fff;font-size:17px;font-weight:900;min-height:52px}

    @media(max-width:420px){
      .bp-search-page{padding-left:12px;padding-right:12px}
      .bp-filter-card{padding:15px}
      .bp-puppy-layout{grid-template-columns:minmax(0,48%) minmax(0,52%);min-height:176px}
      .bp-puppy-photo,.bp-puppy-photo img,.bp-photo-fallback{min-height:176px}
      .bp-puppy-info{padding-left:11px}
      .bp-puppy-title{font-size:18px;margin-bottom:8px}
      .bp-status,.bp-area,.bp-meta{font-size:13px}
      .bp-price{font-size:20px}
      .bp-region-row{grid-template-columns:82px minmax(0,1fr)}
      .bp-region-name{padding:12px 7px;font-size:14px}
      .bp-pref-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px 10px;padding:12px 10px}
      .bp-pref-grid .bp-check{font-size:14px}
      .bp-area-groups{padding-left:8px;padding-right:8px}
    }
  </style>
</head>
<body>
  <div class="topbar">🐾 大型犬専門｜BIG PAW</div>
  <header class="site-header"><div class="wrap nav"><a class="logo" href="index.html"><span class="logo-mark">🐾</span>BIG PAW</a><nav class="navlinks"><a href="breeders.html">ブリーダー</a><a href="favorites.html">♡ お気に入り</a><a class="nav-cta" href="mypage.html">マイページ</a></nav></div></header>

  <main class="bp-search-page">
    <h1>子犬を探す</h1>
    <section class="bp-filter-card" aria-label="子犬の条件">
      <h2>子犬を選ぶ</h2>
      <div class="bp-filter-grid">
        <select id="fBreed"><option value="all">すべての大型犬種</option></select>
        <select id="bpGender"><option value="all">性別：すべて</option><option value="male">男の子</option><option value="female">女の子</option></select>
        <select id="bpAge"><option value="all">年齢：すべて</option><option value="2">生後2ヶ月まで</option><option value="3">生後3ヶ月まで</option><option value="6">生後6ヶ月まで</option><option value="12">生後12ヶ月まで</option><option value="adult">成犬</option></select>
        <select id="bpColor"><option value="all">毛色：すべて</option><option value="ブラック">ブラック</option><option value="ホワイト">ホワイト</option><option value="クリーム">クリーム</option><option value="レッド">レッド</option><option value="その他">その他</option></select>
      </div>

    <section class="bp-filter-card" aria-label="地域と価格">

      <div class="bp-filter-grid">
        <button id="bpAreaOpen" class="bp-area-open" type="button" aria-haspopup="dialog" aria-controls="bpAreaModal"><span id="bpAreaSummary">地域：全国</span><span class="bp-area-open-arrow">⌄</span></button>
        <select id="bpArea" data-prefecture-count="47" multiple hidden aria-hidden="true" tabindex="-1">
          <option value="北海道">北海道</option>
          <option value="青森県">青森県</option><option value="岩手県">岩手県</option><option value="宮城県">宮城県</option><option value="秋田県">秋田県</option><option value="山形県">山形県</option><option value="福島県">福島県</option>
          <option value="茨城県">茨城県</option><option value="栃木県">栃木県</option><option value="群馬県">群馬県</option><option value="埼玉県">埼玉県</option><option value="千葉県">千葉県</option><option value="東京都">東京都</option><option value="神奈川県">神奈川県</option>
          <option value="新潟県">新潟県</option><option value="富山県">富山県</option><option value="石川県">石川県</option><option value="福井県">福井県</option><option value="山梨県">山梨県</option><option value="長野県">長野県</option>
          <option value="岐阜県">岐阜県</option><option value="静岡県">静岡県</option><option value="愛知県">愛知県</option><option value="三重県">三重県</option>
          <option value="滋賀県">滋賀県</option><option value="京都府">京都府</option><option value="大阪府">大阪府</option><option value="兵庫県">兵庫県</option><option value="奈良県">奈良県</option><option value="和歌山県">和歌山県</option>
          <option value="鳥取県">鳥取県</option><option value="島根県">島根県</option><option value="岡山県">岡山県</option><option value="広島県">広島県</option><option value="山口県">山口県</option>
          <option value="徳島県">徳島県</option><option value="香川県">香川県</option><option value="愛媛県">愛媛県</option><option value="高知県">高知県</option>
          <option value="福岡県">福岡県</option><option value="佐賀県">佐賀県</option><option value="長崎県">長崎県</option><option value="熊本県">熊本県</option><option value="大分県">大分県</option><option value="宮崎県">宮崎県</option><option value="鹿児島県">鹿児島県</option><option value="沖縄県">沖縄県</option>
        </select>
        <select id="bpSort"><option value="new">新着順</option><option value="low">価格が安い順</option><option value="high">価格が高い順</option></select>
        <select id="bpMin"><option value="0">下限なし</option><option value="200000">20万円〜</option><option value="250000">25万円〜</option><option value="300000">30万円〜</option><option value="350000">35万円〜</option><option value="400000">40万円〜</option></select>
        <select id="bpMax"><option value="0">上限なし</option><option value="250000">〜25万円</option><option value="300000">〜30万円</option><option value="350000">〜35万円</option><option value="400000">〜40万円</option><option value="500000">〜50万円</option></select>
      </div>
    </section>

    <div class="bp-result-head"><h2>検索結果</h2><span id="bpCount" class="bp-result-count">0頭</span></div>
    <div id="bpResults" class="bp-result-list" aria-live="polite"></div>
  </main>

  <div class="bp-bottom-search"><button id="bpClear" class="bp-clear" type="button">条件をクリア</button><button id="bpSearch" class="bp-search-btn" type="button">🔍 検索</button></div>

  <section id="bpAreaModal" class="bp-area-modal" role="dialog" aria-modal="true" aria-labelledby="bpAreaTitle" hidden>
    <div class="bp-area-dialog">
      <div class="bp-area-head"><h2 id="bpAreaTitle">地域を選んでください（複数選択可）</h2><button id="bpAreaClose" class="bp-area-close" type="button">閉じる</button></div>
      <div class="bp-area-all"><label class="bp-check"><input id="bpAreaAll" type="checkbox"><span>全都道府県</span></label></div>
      <div id="bpAreaGroups" class="bp-area-groups" data-region-picker="47-prefectures"></div>
      <div class="bp-area-actions"><button id="bpAreaReset" class="bp-area-reset" type="button">クリア</button><button id="bpAreaApply" class="bp-area-apply" type="button">選択して閉じる</button></div>
    </div>
  </section>

  <script src="assets/app.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/bridge.js"></script>
  <script src="assets/breed-data.js"></script>
  <script src="assets/breed-picker-v6-search.js?v=20260918-multi2"></script>
  <script>
    (function(){
      'use strict';
      const qs=new URLSearchParams(location.search);
      const breed=document.getElementById('fBreed');
      const gender=document.getElementById('bpGender');
      const age=document.getElementById('bpAge');
      const color=document.getElementById('bpColor');
      const area=document.getElementById('bpArea');
      const sort=document.getElementById('bpSort');
      const minPrice=document.getElementById('bpMin');
      const maxPrice=document.getElementById('bpMax');
      const results=document.getElementById('bpResults');
      const count=document.getElementById('bpCount');
      const areaModal=document.getElementById('bpAreaModal');
      const areaSummary=document.getElementById('bpAreaSummary');
      const areaAll=document.getElementById('bpAreaAll');
      const areaGroups=document.getElementById('bpAreaGroups');
      let source=[];
      let selectedAreas=new Set();
      const PREF_KEY={
        '北海道':'hokkaido','青森県':'aomori','岩手県':'iwate','宮城県':'miyagi','秋田県':'akita','山形県':'yamagata','福島県':'fukushima',
        '茨城県':'ibaraki','栃木県':'tochigi','群馬県':'gunma','埼玉県':'saitama','千葉県':'chiba','東京都':'tokyo','神奈川県':'kanagawa',
        '新潟県':'niigata','富山県':'toyama','石川県':'ishikawa','福井県':'fukui','山梨県':'yamanashi','長野県':'nagano',
        '岐阜県':'gifu','静岡県':'shizuoka','愛知県':'aichi','三重県':'mie','滋賀県':'shiga','京都府':'kyoto','大阪府':'osaka','兵庫県':'hyogo','奈良県':'nara','和歌山県':'wakayama',
        '鳥取県':'tottori','島根県':'shimane','岡山県':'okayama','広島県':'hiroshima','山口県':'yamaguchi','徳島県':'tokushima','香川県':'kagawa','愛媛県':'ehime','高知県':'kochi',
        '福岡県':'fukuoka','佐賀県':'saga','長崎県':'nagasaki','熊本県':'kumamoto','大分県':'oita','宮崎県':'miyazaki','鹿児島県':'kagoshima','沖縄県':'okinawa'
      };
      const PREF_REGIONS=[
        ['北海道',['北海道']],
        ['東北',['青森県','岩手県','秋田県','宮城県','山形県','福島県']],
        ['関東',['東京都','神奈川県','千葉県','埼玉県','茨城県','栃木県','群馬県']],
        ['甲信越・北陸',['山梨県','長野県','新潟県','富山県','石川県','福井県']],
        ['中部・東海',['静岡県','愛知県','岐阜県','三重県']],
        ['関西・近畿',['大阪府','兵庫県','京都府','滋賀県','奈良県','和歌山県']],
        ['中国',['岡山県','広島県','鳥取県','島根県','山口県']],
        ['四国',['愛媛県','香川県','高知県','徳島県']],
        ['九州・沖縄',['福岡県','佐賀県','長崎県','熊本県','大分県','宮崎県','鹿児島県','沖縄県']]
      ];
      const ALL_PREFS=Object.keys(PREF_KEY);

      function esc(v){return BigPaw.esc(String(v==null?'':v))}
      function monthsOld(v){if(!v)return null;const d=new Date(v);if(Number.isNaN(d.getTime()))return null;const n=new Date();return (n.getFullYear()-d.getFullYear())*12+n.getMonth()-d.getMonth()-(n.getDate()<d.getDate()?1:0)}
      function birthday(v){if(!v)return '—';const d=new Date(v);if(Number.isNaN(d.getTime()))return esc(v);return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日'}
      function statusText(p){const raw=String(p.status||'募集中');return raw==='approved'?'募集中':raw}
      function listImage(p){return p.listImageUrl||p.imageUrl||''}
      function colorMatch(p,v){if(v==='all')return true;const c=String(p.color||'');if(v==='その他')return !['ブラック','ホワイト','クリーム','レッド'].some(x=>c.includes(x));return c.includes(v)}
      function puppyAreaMatch(p,name){return String(p.area||'').trim()===name||String(p.areaKey||'')===PREF_KEY[name]}

      function syncHiddenArea(){
        Array.from(area.options).forEach(function(o){o.selected=selectedAreas.has(o.value)});
      }
      function updateAreaSummary(){
        const n=selectedAreas.size;
        if(n===0||n===47)areaSummary.textContent='地域：全国';
        else if(n===1)areaSummary.textContent='地域：'+Array.from(selectedAreas)[0];
        else if(n<=3)areaSummary.textContent='地域：'+Array.from(selectedAreas).join('・');
        else areaSummary.textContent='地域：'+n+'都道府県選択中';
      }
      function syncAreaChecks(){
        document.querySelectorAll('[data-pref]').forEach(function(cb){cb.checked=selectedAreas.has(cb.dataset.pref)});
        document.querySelectorAll('[data-region-index]').forEach(function(cb){
          const prefs=PREF_REGIONS[Number(cb.dataset.regionIndex)][1];
          const hit=prefs.filter(x=>selectedAreas.has(x)).length;
          cb.checked=hit===prefs.length;
          cb.indeterminate=hit>0&&hit<prefs.length;
        });
        areaAll.checked=selectedAreas.size===47;
        areaAll.indeterminate=selectedAreas.size>0&&selectedAreas.size<47;
        syncHiddenArea();
        updateAreaSummary();
      }
      function buildAreaPicker(){
        areaGroups.innerHTML=PREF_REGIONS.map(function(row,idx){
          const region=row[0],prefs=row[1];
          return '<div class="bp-region-row">'
            +'<label class="bp-region-name bp-check"><input type="checkbox" data-region-index="'+idx+'"><span>'+esc(region)+'</span></label>'
            +'<div class="bp-pref-grid">'+prefs.map(function(name){return '<label class="bp-check"><input type="checkbox" data-pref="'+esc(name)+'"><span>'+esc(name)+'</span></label>'}).join('')+'</div>'
          +'</div>';
        }).join('');
        areaGroups.addEventListener('change',function(e){
          const t=e.target;if(!(t instanceof HTMLInputElement))return;
          if(t.dataset.pref){if(t.checked)selectedAreas.add(t.dataset.pref);else selectedAreas.delete(t.dataset.pref);syncAreaChecks();return}
          if(t.dataset.regionIndex!=null){const prefs=PREF_REGIONS[Number(t.dataset.regionIndex)][1];prefs.forEach(x=>t.checked?selectedAreas.add(x):selectedAreas.delete(x));syncAreaChecks()}
        });
      }
      function openAreaPicker(){areaModal.hidden=false;document.body.classList.add('bp-modal-open');syncAreaChecks()}
      function closeAreaPicker(apply){areaModal.hidden=true;document.body.classList.remove('bp-modal-open');if(apply)render(false)}

      function render(scroll){
        let list=source.slice();
        const selected=Array.isArray(window.BIGPAW_SELECTED_BREEDS)?window.BIGPAW_SELECTED_BREEDS:[];
        const b=breed.value,g=gender.value,ag=age.value,c=color.value;
        const min=Number(minPrice.value||0),max=Number(maxPrice.value||0);
        if(selected.length)list=list.filter(p=>selected.includes(String(p.breedKey||'')));
        else if(b!=='all')list=list.filter(p=>String(p.breedKey||p.breed||'')===b);
        if(g!=='all')list=list.filter(p=>String(p.genderKey||'')===g);
        if(selectedAreas.size>0&&selectedAreas.size<47)list=list.filter(p=>Array.from(selectedAreas).some(name=>puppyAreaMatch(p,name)));
        if(min)list=list.filter(p=>Number(p.price||0)>=min);
        if(max)list=list.filter(p=>Number(p.price||0)<=max);
        list=list.filter(p=>colorMatch(p,c));
        if(ag!=='all')list=list.filter(function(p){const m=monthsOld(p.birth);if(m==null)return false;return ag==='adult'?m>=12:m<=Number(ag)});
        if(sort.value==='low')list.sort((x,y)=>Number(x.price||0)-Number(y.price||0));
        else if(sort.value==='high')list.sort((x,y)=>Number(y.price||0)-Number(x.price||0));
        else list.sort((x,y)=>String(y.createdAt||'').localeCompare(String(x.createdAt||'')));

        count.textContent=list.length+'頭';
        if(!list.length){results.innerHTML='<div class="bp-empty">条件に合う子がいません。条件を少し広げてみてください。</div>';return;}
        results.innerHTML=list.map(function(p){
          const img=listImage(p);
          const photo=img?'<img src="'+esc(img)+'" alt="'+esc(p.breed||'子犬')+'" loading="eager" decoding="async">':'<div class="bp-photo-fallback">🐾</div>';
          return '<a class="bp-puppy-row" href="puppy-detail.html?id='+encodeURIComponent(p.id)+'">'
            +'<h3 class="bp-puppy-title">'+esc(p.breed||'')+'</h3>'
            +'<div class="bp-puppy-layout">'
              +'<div class="bp-puppy-photo">'+photo+'<span class="bp-gender-badge">'+esc(p.gender||'')+'</span></div>'
              +'<div class="bp-puppy-info">'
                +'<div class="bp-status">'+esc(statusText(p))+'</div>'
                +'<div class="bp-area">'+esc(p.area||'')+'</div>'
                +'<div class="bp-meta">誕生：'+birthday(p.birth)+'</div>'
                +'<div class="bp-meta">毛色：'+esc(p.color||'—')+'</div>'
                +'<div class="bp-price-wrap"><div class="bp-price-label">生体価格</div><div class="bp-price">'+BigPaw.currency(Number(p.price||0))+'<span class="bp-tax">税込</span></div></div>'
              +'</div>'
            +'</div>'
          +'</a>';
        }).join('');
        if(scroll)document.querySelector('.bp-result-head').scrollIntoView({behavior:'smooth',block:'start'});
      }
      window.render=function(){render(false)};

      function clearAll(){
        if(window.BigPawBreedPicker&&BigPawBreedPicker.clear)BigPawBreedPicker.clear();
        selectedAreas.clear();syncAreaChecks();
        breed.value='all';gender.value='all';age.value='all';color.value='all';sort.value='new';minPrice.value='0';maxPrice.value='0';render(false);
      }
      async function init(){
        try{
          buildAreaPicker();
          const qArea=qs.get('area');
          if(qArea){
            qArea.split(',').forEach(function(raw){const value=decodeURIComponent(raw.trim());const oldName=Object.keys(PREF_KEY).find(name=>PREF_KEY[name]===value);const resolved=oldName||value;if(PREF_KEY[resolved])selectedAreas.add(resolved)});
          }
          syncAreaChecks();
          source=await BigPawBridge.puppies();
          [gender,age,color,sort,minPrice,maxPrice].forEach(x=>x.addEventListener('change',()=>render(false)));
          breed.addEventListener('change',()=>render(false));
          document.getElementById('bpAreaOpen').addEventListener('click',openAreaPicker);
          document.getElementById('bpAreaClose').addEventListener('click',()=>closeAreaPicker(false));
          document.getElementById('bpAreaApply').addEventListener('click',()=>closeAreaPicker(true));
          document.getElementById('bpAreaReset').addEventListener('click',()=>{selectedAreas.clear();syncAreaChecks()});
          areaAll.addEventListener('change',()=>{selectedAreas.clear();if(areaAll.checked)ALL_PREFS.forEach(x=>selectedAreas.add(x));syncAreaChecks()});
          areaModal.addEventListener('click',e=>{if(e.target===areaModal)closeAreaPicker(false)});
          document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!areaModal.hidden)closeAreaPicker(false)});
          document.getElementById('bpSearch').addEventListener('click',()=>render(true));
          document.getElementById('bpClear').addEventListener('click',clearAll);
          render(false);
        }catch(e){count.textContent='0頭';results.innerHTML='<div class="bp-empty">データを読み込めませんでした。</div>'}
      }
      init();
    })();
  </script>
</body>
</html>
