<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>子犬を探す｜BIG PAW</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    :root{--pink:#d978a0;--line:#eadfe5;--muted:#756b70;--bg:#fff;--soft:#fff8fb}
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:#222}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .search-list-page{max-width:760px;margin:0 auto;padding:18px 14px 80px}
    .search-list-page h1{font-size:25px;margin:8px 0 18px}
    .filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
    .filters select{width:100%;height:48px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 10px;font-size:14px}
    .result-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 10px}
    .result-head h2{margin:0;font-size:20px}
    .result-count{font-weight:800;color:#555}
    .result-list{display:grid;gap:14px}
    .puppy-row{display:block;text-decoration:none;color:inherit;background:#fff;border-bottom:1px solid #e8e8e8;padding:0 0 14px}
    .puppy-title{font-size:19px;font-weight:900;line-height:1.35;margin:0 0 9px}
    .puppy-layout{display:grid;grid-template-columns:minmax(0,49%) minmax(0,51%);align-items:stretch;min-height:190px}
    .puppy-photo{position:relative;background:var(--soft);overflow:hidden;min-height:190px}
    .puppy-photo img{display:block;width:100%;height:100%;min-height:190px;object-fit:contain;background:var(--soft)}
    .photo-fallback{height:100%;min-height:190px;display:grid;place-items:center;font-size:64px}
    .gender-badge{position:absolute;left:8px;bottom:8px;background:rgba(255,255,255,.94);border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800}
    .puppy-info{padding:3px 0 3px 14px;display:flex;flex-direction:column;min-width:0}
    .status{font-size:14px;font-weight:900;color:var(--pink);margin-bottom:5px}
    .area{font-size:14px;color:#444;margin-bottom:10px}
    .meta{font-size:14px;line-height:1.65;color:var(--muted)}
    .price-wrap{margin-top:auto;padding-top:8px}
    .price-label{font-size:12px;color:#777}
    .price{font-size:22px;font-weight:900;line-height:1.2;color:#222}
    .tax{font-size:12px;font-weight:600;color:#777;margin-left:3px}
    .empty{border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center;color:#666;background:#fff}
    @media(max-width:420px){
      .search-list-page{padding-left:12px;padding-right:12px}
      .puppy-layout{grid-template-columns:minmax(0,48%) minmax(0,52%);min-height:178px}
      .puppy-photo,.puppy-photo img,.photo-fallback{min-height:178px}
      .puppy-info{padding-left:11px}
      .puppy-title{font-size:18px}
      .meta,.area,.status{font-size:13px}
      .price{font-size:20px}
    }
  </style>
</head>
<body>
  <div class="topbar">🐾 大型犬専門｜BIG PAW</div>
  <header class="site-header">
    <div class="wrap nav">
      <a class="logo" href="index.html"><span class="logo-mark">🐾</span>BIG PAW</a>
      <nav class="navlinks">
        <a href="breeders.html">ブリーダー</a>
        <a href="favorites.html">♡ お気に入り</a>
        <a class="nav-cta" href="mypage.html">マイページ</a>
      </nav>
    </div>
  </header>

  <main class="search-list-page">
    <h1>子犬を探す</h1>
    <section class="filters" aria-label="検索条件">
      <select id="breedFilter"><option value="all">犬種：すべて</option></select>
      <select id="genderFilter">
        <option value="all">性別：すべて</option>
        <option value="male">男の子</option>
        <option value="female">女の子</option>
      </select>
      <select id="areaFilter"><option value="all">地域：すべて</option></select>
      <select id="sortFilter">
        <option value="new">新着順</option>
        <option value="low">価格が安い順</option>
        <option value="high">価格が高い順</option>
      </select>
    </section>

    <div class="result-head">
      <h2>検索結果</h2>
      <span id="resultCount" class="result-count">0頭</span>
    </div>
    <div id="resultList" class="result-list"></div>
  </main>

  <script src="assets/app.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/bridge.js"></script>
  <script>
    (function(){
      'use strict';
      const qs=new URLSearchParams(location.search);
      const breedFilter=document.getElementById('breedFilter');
      const genderFilter=document.getElementById('genderFilter');
      const areaFilter=document.getElementById('areaFilter');
      const sortFilter=document.getElementById('sortFilter');
      const resultList=document.getElementById('resultList');
      const resultCount=document.getElementById('resultCount');
      let source=[];

      function esc(v){return BigPaw.esc(String(v==null?'':v))}
      function birthday(v){
        if(!v)return '—';
        const d=new Date(v);
        if(Number.isNaN(d.getTime()))return esc(v);
        return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日';
      }
      function statusText(p){return p.status||p.reviewStatus||'募集中'}
      function imageUrl(p){return p.listImageUrl||p.imageUrl||''}

      function uniqueOptions(select,items,labelFn,valueFn){
        const seen=new Set();
        items.forEach(function(item){
          const value=valueFn(item);
          if(!value||seen.has(value))return;
          seen.add(value);
          const o=document.createElement('option');
          o.value=value;
          o.textContent=labelFn(item);
          select.appendChild(o);
        });
      }

      function render(){
        let list=source.slice();
        const breed=breedFilter.value;
        const gender=genderFilter.value;
        const area=areaFilter.value;
        if(breed!=='all')list=list.filter(p=>String(p.breedKey||p.breed)===breed);
        if(gender!=='all')list=list.filter(p=>p.genderKey===gender);
        if(area!=='all')list=list.filter(p=>String(p.areaKey||p.area)===area);
        if(sortFilter.value==='low')list.sort((a,b)=>Number(a.price||0)-Number(b.price||0));
        else if(sortFilter.value==='high')list.sort((a,b)=>Number(b.price||0)-Number(a.price||0));
        else list.sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||'')));

        resultCount.textContent=list.length+'頭';
        if(!list.length){
          resultList.innerHTML='<div class="empty">条件に合う子がいません。条件を少し広げてみてください。</div>';
          return;
        }
        resultList.innerHTML=list.map(function(p){
          const img=imageUrl(p);
          const photo=img
            ? '<img src="'+esc(img)+'" alt="'+esc(p.breed||'子犬')+'" loading="eager">'
            : '<div class="photo-fallback">🐾</div>';
          return '<a class="puppy-row" href="puppy-detail.html?id='+encodeURIComponent(p.id)+'">'
            +'<h3 class="puppy-title">'+esc(p.breed||'')+'</h3>'
            +'<div class="puppy-layout">'
              +'<div class="puppy-photo">'+photo+'<span class="gender-badge">'+esc(p.gender||'')+'</span></div>'
              +'<div class="puppy-info">'
                +'<div class="status">'+esc(statusText(p))+'</div>'
                +'<div class="area">'+esc(p.area||'')+'</div>'
                +'<div class="meta">誕生：'+birthday(p.birth)+'</div>'
                +'<div class="meta">毛色：'+esc(p.color||'—')+'</div>'
                +'<div class="price-wrap"><div class="price-label">生体価格</div><div class="price">'+BigPaw.currency(Number(p.price||0))+'<span class="tax">税込</span></div></div>'
              +'</div>'
            +'</div>'
          +'</a>';
        }).join('');
      }

      async function init(){
        try{
          source=await BigPawBridge.puppies();
          uniqueOptions(breedFilter,source,p=>p.breed||'',p=>String(p.breedKey||p.breed||''));
          uniqueOptions(areaFilter,source,p=>p.area||'',p=>String(p.areaKey||p.area||''));
          const qBreed=qs.get('breed');
          const qArea=qs.get('area');
          if(qBreed&&Array.from(breedFilter.options).some(o=>o.value===qBreed))breedFilter.value=qBreed;
          if(qArea&&Array.from(areaFilter.options).some(o=>o.value===qArea))areaFilter.value=qArea;
          [breedFilter,genderFilter,areaFilter,sortFilter].forEach(x=>x.addEventListener('change',render));
          render();
        }catch(e){
          resultCount.textContent='0頭';
          resultList.innerHTML='<div class="empty">データを読み込めませんでした。</div>';
        }
      }
      init();
    })();
  </script>
</body>
</html>
