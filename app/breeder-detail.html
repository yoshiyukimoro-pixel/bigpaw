<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ブリーダー詳細｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="topbar">🐾 大型犬専門｜BIG PAW</div><header class="site-header"><div class="wrap nav"><a class="logo" href="index.html"><span class="logo-mark">🐾</span>BIG PAW</a><nav class="navlinks"><a href="search.html">子犬を探す</a><a href="breeders.html">ブリーダー</a><a href="favorites.html">♡ お気に入り</a></nav></div></header><main class="wrap"><div class="breadcrumb"><a href="breeders.html">ブリーダー一覧</a> ＞ 詳細</div><section class="section"><div class="card pad"><div class="profile"><div class="avatar" style="width:72px;height:72px">🐾</div><div><h1 id="name" style="margin:0">読み込み中…</h1><div id="area" class="muted"></div></div></div><p id="profile" style="margin-top:18px"></p><div class="fact-grid"><div class="fact"><span>所在地</span><b id="pref">-</b></div><div class="fact"><span>動物取扱業登録番号</span><b id="reg">確認中</b></div><div class="fact"><span>掲載審査</span><b>BIG PAW承認済み</b></div></div></div><div class="section-head" style="margin-top:28px"><div><h2>このブリーダーの子犬</h2><p>承認済みの掲載のみ表示しています。</p></div></div><div class="dog-cards" id="puppies"></div><div class="section-head" style="margin-top:34px"><div><h2>口コミ</h2></div></div><div class="grid two" id="reviews"></div></section></main><script src="assets/app.js"></script><script src="assets/api.js"></script><script>const id=new URLSearchParams(location.search).get('id')||'b_dog44';const esc=s=>BigPaw.esc(String(s??''));async function load(){try{const b=await BigPawAPI.breeder(id);document.title=b.kennel_name+'｜BIG PAW';name.textContent=b.kennel_name;area.textContent=b.prefecture;pref.textContent=b.prefecture;reg.textContent=b.registration_no||'登録情報を確認済み';profile.textContent=b.profile||'大型犬の飼育・繁殖情報を掲載しています。';puppies.innerHTML=b.puppies.length?b.puppies.map(p=>`<a class="card dog-card" href="puppy-detail.html?id=${encodeURIComponent(p.id)}"><div class="dogpic">${p.imageUrl?`<img src="${esc(p.imageUrl)}" style="width:100%;height:100%;object-fit:cover">`:'🐾'}</div><div class="body"><span class="status">${esc(p.status)}</span><h3>${esc(p.breed)}｜${esc(p.color)}の${esc(p.gender)}</h3><div class="price">${BigPaw.currency(p.price)}</div></div></a>`).join(''):'<div class="card pad">現在公開中の子犬はいません。</div>';reviews.innerHTML=b.reviews.length?b.reviews.map(r=>`<div class="card pad"><b>${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</b><p>${esc(r.body)}</p></div>`).join(''):'<div class="card pad muted">まだ口コミはありません。</div>'}catch(e){name.textContent='ブリーダー情報を読み込めませんでした'}}load();</script><script id="bp-hide-registration-proof">(function(){function clean(){const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);const a=[];while(w.nextNode())a.push(w.currentNode);for(const n of a){const v=n.nodeValue||'';if(v.includes('[REGISTRATION_PROOF]')){n.nodeValue=v.replace(/\[REGISTRATION_PROOF\][^\s<]*/g,'').trim();}}}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',clean);else clean();new MutationObserver(clean).observe(document.documentElement,{childList:true,subtree:true,characterData:true});})();</script><script id="bp-public-contact-privacy">(function(){function clean(){document.querySelectorAll('a[href^="mailto:"],a[href^="tel:"]').forEach(e=>e.remove());document.querySelectorAll('a').forEach(e=>{const h=(e.getAttribute('href')||'').toLowerCase();if(h.includes('instagram.com')||h.includes('line.me')||h.includes('lin.ee'))e.remove()})}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',clean);else clean();new MutationObserver(clean).observe(document.documentElement,{childList:true,subtree:true})})();</script></body></html>
