<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>BIG PAW｜販売・引渡し設定</title><link rel="stylesheet" href="assets/style.css"><style>.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:linear-gradient(180deg,#55708c,#45627f);color:#fff;padding:24px 18px}.side a{display:block;padding:10px 12px;border-radius:10px;color:#eef7ff}.side a:hover,.side a.current{background:rgba(255,255,255,.12)}.main{padding:28px}.settings-wrap{max-width:900px}.section-card{margin-top:18px}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.choice-row{display:flex;gap:18px;flex-wrap:wrap;align-items:center}.choice-row label{display:flex;gap:8px;align-items:center;font-weight:700}.choice-row input{width:auto}.org-list{display:grid;gap:10px}.org-item{display:flex;gap:10px;align-items:center}.org-item input[type=checkbox]{width:auto}.savebar{position:sticky;bottom:0;background:rgba(243,248,255,.96);backdrop-filter:blur(8px);padding:14px 0 4px;margin-top:22px}.help{font-size:13px;color:#66798d;margin-top:6px}.success{display:none;background:#edf9f0;border:1px solid #b7dfc1;color:#246536;border-radius:12px;padding:12px 14px;margin:14px 0}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{display:none}.main{padding:70px 14px 18px}.field-row{grid-template-columns:1fr}.settings-wrap{max-width:none}}</style></head><body class="bigpaw-breeder-theme"><div class="layout"><aside class="side"><h2>🐾 BIG PAW</h2><p style="opacity:.75">ブリーダー管理</p><a href="admin.html">子犬管理</a><a href="breeder-puppy-new.html?new=1">＋ 子犬を掲載</a><a href="breeder-inquiries.html">見学・問い合わせ</a><a href="breeder-deal-report.html">成約申請</a><a href="parent-dogs.html">親犬管理</a><a href="breeder-profile-edit.html">犬舎プロフィール</a><a class="current" href="breeder-sales-handover.html">販売・引渡し設定</a><a href="breeder-billing.html">請求・お支払い</a><a href="breeder-fees.html">料金・手数料</a><a href="index.html">公開サイト ↗</a></aside><main class="main"><div class="settings-wrap"><div><h1>販売・引渡し設定</h1><p class="muted">犬舎共通の販売条件・お迎え条件を登録します。内容はいつでも変更できます。</p></div><div class="notice">現在掲載中の子犬の個別設定は自動では書き換えません。ここでは犬舎の基本条件を管理します。</div><div id="saved" class="success">保存しました。</div><section class="card pad section-card"><h2>血統証明書</h2><p class="muted">発行可能な団体を選択してください。</p><div class="org-list"><label class="org-item"><input type="checkbox" name="pedigreeOrg" value="JKC"> JKC</label><label class="org-item"><input type="checkbox" name="pedigreeOrg" value="日本犬保存会"> 日本犬保存会</label><label class="org-item"><input type="checkbox" name="pedigreeOrg" value="秋田犬保存会"> 秋田犬保存会</label></div><div class="field-row" style="margin-top:14px"><div class="field"><label>その他の発行団体 1</label><input id="pedigreeOther1" maxlength="80" placeholder="団体名"></div><div class="field"><label>その他の発行団体 2</label><input id="pedigreeOther2" maxlength="80" placeholder="団体名"></div></div><div class="field" style="margin-top:14px"><label>備考</label><textarea id="pedigreeNote" maxlength="1000" rows="4" placeholder="発行時期や名義変更など、購入希望者に伝える内容"></textarea></div></section><section class="card pad section-card"><h2>ワクチン代</h2><div class="choice-row"><label><input type="radio" name="vaccineIncluded" value="1"> 子犬代に含む</label><label><input type="radio" name="vaccineIncluded" value="0"> 子犬代に含まない</label></div><div class="field" style="margin-top:14px"><label>説明文</label><textarea id="vaccineNote" maxlength="1000" rows="4" placeholder="例：6種混合ワクチン1回接種につき別途○○円（税込）"></textarea></div></section><section class="card pad section-card"><h2>予約金</h2><div class="field-row"><div class="field"><label>予約金額</label><input id="reservationAmount" type="number" min="0" max="10000000" step="1000" inputmode="numeric" placeholder="例：100000"><div class="help">0円の場合は「予約金なし」として保存できます。</div></div><div class="field"><label>残金のお支払い時期</label><input id="balanceTiming" maxlength="200" placeholder="例：お引き渡し当日まで"></div></div><div class="field" style="margin-top:14px"><label>予約金に関する注意事項</label><textarea id="reservationNote" maxlength="2000" rows="5" placeholder="キャンセル時の扱い、商談中への切り替えなど"></textarea></div></section><section class="card pad section-card"><h2>見学</h2><div class="field"><label>問い合わせ当日の見学</label><div class="choice-row" style="margin-top:8px"><label><input type="radio" name="sameDayVisit" value="1"> 受け付ける</label><label><input type="radio" name="sameDayVisit" value="0"> 受け付けない</label></div></div><div class="field" style="margin-top:14px"><label>見学に関する補足</label><textarea id="visitNote" maxlength="1000" rows="4" placeholder="見学可能な曜日や事前連絡について"></textarea></div></section><section class="card pad section-card"><h2>引き渡し時期</h2><div class="field"><label>引き渡し条件</label><textarea id="handoverText" maxlength="2000" rows="5" placeholder="例：お客様と打ち合わせの上、初回予防接種・健康診断後に問題ないと判断してからのお引き渡しとなります。"></textarea></div><div class="field" style="margin-top:14px;max-width:320px"><label>子犬引渡基準日数</label><div style="display:flex;gap:8px;align-items:center"><span>生後</span><input id="minHandoverDays" type="number" min="0" max="365" inputmode="numeric" placeholder="57"><span>日目以降</span></div></div></section><section class="card pad section-card"><h2>健康診断・マイクロチップ</h2><div class="field-row"><div class="field"><label>健康診断費</label><div class="choice-row" style="margin-top:8px"><label><input type="radio" name="healthExamIncluded" value="1"> 子犬代に含む</label><label><input type="radio" name="healthExamIncluded" value="0"> 含まない</label></div></div><div class="field"><label>マイクロチップ費</label><div class="choice-row" style="margin-top:8px"><label><input type="radio" name="microchipIncluded" value="1"> 子犬代に含む</label><label><input type="radio" name="microchipIncluded" value="0"> 含まない</label></div></div></div><div class="field" style="margin-top:14px"><label>補足</label><textarea id="healthNote" maxlength="1000" rows="4" placeholder="費用や実施時期について"></textarea></div></section><section class="card pad section-card"><h2>キャンセル規定</h2><div class="field"><label>購入者へ表示する説明</label><textarea id="cancellationPolicy" maxlength="2000" rows="5" placeholder="予約後のキャンセル、返金条件など"></textarea></div></section><div class="savebar"><button id="saveBtn" class="btn btn-main btn-wide" type="button">設定を保存する</button></div></div></main></div><script src="assets/app.js"></script><script src="breeder-mobile-nav.js"></script><script src="/auth-return-fix.js"></script><script>const $=id=>document.getElementById(id);const boolRadio=n=>{const x=document.querySelector('input[name="'+n+'"]:checked');return x?x.value==='1':null};const setRadio=(n,v)=>{document.querySelectorAll('input[name="'+n+'"]').forEach(x=>x.checked=(v===true&&x.value==='1')||(v===false&&x.value==='0'))};function payload(){return{pedigreeOrganizations:[...document.querySelectorAll('input[name="pedigreeOrg"]:checked')].map(x=>x.value),pedigreeOther1:$('pedigreeOther1').value.trim(),pedigreeOther2:$('pedigreeOther2').value.trim(),pedigreeNote:$('pedigreeNote').value.trim(),vaccineIncluded:boolRadio('vaccineIncluded'),vaccineNote:$('vaccineNote').value.trim(),reservationAmount:Number($('reservationAmount').value||0),balanceTiming:$('balanceTiming').value.trim(),reservationNote:$('reservationNote').value.trim(),sameDayVisit:boolRadio('sameDayVisit'),visitNote:$('visitNote').value.trim(),handoverText:$('handoverText').value.trim(),minHandoverDays:Number($('minHandoverDays').value||0),healthExamIncluded:boolRadio('healthExamIncluded'),microchipIncluded:boolRadio('microchipIncluded'),healthNote:$('healthNote').value.trim(),cancellationPolicy:$('cancellationPolicy').value.trim()}}function fill(s){const orgs=new Set(s.pedigreeOrganizations||[]);document.querySelectorAll('input[name="pedigreeOrg"]').forEach(x=>x.checked=orgs.has(x.value));['pedigreeOther1','pedigreeOther2','pedigreeNote','vaccineNote','balanceTiming','reservationNote','visitNote','handoverText','healthNote','cancellationPolicy'].forEach(k=>$(k).value=s[k]||'');$('reservationAmount').value=s.reservationAmount||'';$('minHandoverDays').value=s.minHandoverDays||'';setRadio('vaccineIncluded',s.vaccineIncluded);setRadio('sameDayVisit',s.sameDayVisit);setRadio('healthExamIncluded',s.healthExamIncluded);setRadio('microchipIncluded',s.microchipIncluded)}async function load(){try{const r=await fetch('/api/breeder/sales-handover-settings',{credentials:'include',cache:'no-store'});if(r.status===401||r.status===403){location.replace('/login.html');return}if(!r.ok)throw new Error('load');fill(await r.json())}catch(e){alert('設定を読み込めませんでした。')}}async function save(){const btn=$('saveBtn');btn.disabled=true;try{const r=await fetch('/api/breeder/sales-handover-settings',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload())});if(r.status===401||r.status===403){location.replace('/login.html');return}if(!r.ok)throw new Error('save');fill(await r.json());$('saved').style.display='block';scrollTo({top:0,behavior:'smooth'});setTimeout(()=>$('saved').style.display='none',3500)}catch(e){alert('保存できませんでした。入力内容をご確認ください。')}finally{btn.disabled=false}}$('saveBtn').addEventListener('click',save);load();</script></body></html>
