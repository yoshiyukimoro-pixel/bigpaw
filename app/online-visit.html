<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>オンライン見学｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="topbar">🐾 BIG PAW オンライン見学</div><header class="site-header"><div class="wrap nav"><a class="logo" href="index.html">🐾 BIG PAW</a><a class="btn btn-sub" href="messages.html">戻る</a></div></header><main class="wrap"><section class="section"><div class="card pad"><h1 id="visitTitle">オンライン見学</h1><p id="visitLead">購入希望者からブリーダーへオンライン見学を申し込み、日時確定後にこの画面から参加します。</p><div style="margin:18px 0;padding:16px;border:1px solid #ddd;border-radius:14px"><h2 id="visitDateTitle">オンライン見学の日時</h2><p id="visitDateLead">購入希望者から希望日時を送り、ブリーダーが確認して確定します。</p><label>希望日 <input id="videoDate" type="date"></label> <label>希望時間 <input id="videoTime" type="time"></label><button id="requestVideoBtn" type="button">オンライン見学を申し込む</button><p id="videoStatus" aria-live="polite"></p><button id="confirmVideoBtn" type="button" style="display:none">この日時で確定する</button></div><div class="notice">日時確定後、この画面からオンライン見学に参加できます。</div><button id="joinBtn" class="btn btn-main btn-wide" type="button" style="display:none">カメラを準備して入室</button><div id="meet" style="min-height:0;margin-top:14px"></div></div></section></main><script src="https://meet.jit.si/external_api.js"></script><script>
const inquiryId=()=>new URLSearchParams(location.search).get("inquiry")||"";
async function requestOnlineVisit(){const st=document.getElementById("videoStatus"),b=document.getElementById("requestVideoBtn"),q=inquiryId(),d=document.getElementById("videoDate").value,t=document.getElementById("videoTime").value;if(!q){st.textContent="問い合わせ画面からオンライン見学を開いてください。";return}if(!d||!t){st.textContent="希望日と時間を選んでください。";return}b.disabled=true;st.textContent="申し込みを送信しています…";try{const r=await fetch("/api/inquiries/"+encodeURIComponent(q)+"/visit",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({date:d,time:t,transport:"オンライン見学",status:"proposed",faceToFaceConfirmed:false})});const v=await r.json().catch(()=>({}));if(!r.ok)throw new Error(v.message||v.error||"送信エラー");st.textContent="オンライン見学を申し込みました。ブリーダーの確認をお待ちください。"}catch(e){st.textContent="申し込みを送信できませんでした。"+(e.message?"（"+e.message+"）":"")}finally{b.disabled=false}}
async function loadOnlineVisit(){const q=inquiryId();if(!q)return;const r=await fetch("/api/inquiries/"+encodeURIComponent(q)+"/visit",{credentials:"same-origin"});if(!r.ok)return;const v=await r.json();if(!v||!v.id)return;document.getElementById("videoDate").value=v.visit_date||"";document.getElementById("videoTime").value=v.visit_time||"";const st=document.getElementById("videoStatus");if(v.transport==="オンライン見学"){if(v.status==="confirmed"){st.textContent="オンライン見学は確定しています。";document.getElementById("joinBtn").style.display="block"}else{const me=await fetch("/api/me",{credentials:"same-origin"}).then(r=>r.ok?r.json():null).catch(()=>null);const role=me&&(me.role||(me.user&&me.user.role));if(role==="breeder"||role==="operator"){document.getElementById("visitTitle").textContent="オンライン見学の申込み確認";document.getElementById("visitLead").textContent="購入希望者からオンライン見学の申込みが届いています。希望日時を確認して確定してください。";document.getElementById("visitDateTitle").textContent="購入希望者の希望日時";document.getElementById("visitDateLead").textContent="購入希望者から届いた希望日時です。内容を確認して見学日時を確定してください。";st.textContent="購入希望者からオンライン見学の希望日時が届いています。";document.getElementById("confirmVideoBtn").textContent="この日時で見学を確定する";document.getElementById("confirmVideoBtn").style.display="inline-block";document.getElementById("requestVideoBtn").style.display="none";document.getElementById("videoDate").disabled=true;document.getElementById("videoTime").disabled=true}else{st.textContent="オンライン見学を申し込みました。ブリーダーの確認をお待ちください。";document.getElementById("confirmVideoBtn").style.display="none"}}}}
async function confirmOnlineVisit(){const q=inquiryId(),d=document.getElementById("videoDate").value,t=document.getElementById("videoTime").value;const r=await fetch("/api/inquiries/"+encodeURIComponent(q)+"/visit",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({date:d,time:t,transport:"オンライン見学",status:"confirmed",faceToFaceConfirmed:false})});document.getElementById("videoStatus").textContent=r.ok?"オンライン見学を確定しました。":"確定できませんでした。";if(r.ok){document.getElementById("confirmVideoBtn").style.display="none";document.getElementById("joinBtn").style.display="block"}}
async function joinRoom(){const q=inquiryId(),st=document.getElementById("videoStatus");const r=await fetch("/api/inquiries/"+encodeURIComponent(q)+"/video-room",{credentials:"same-origin"});const v=await r.json().catch(()=>({}));if(!r.ok){st.textContent="まだ入室できません。日時確定後、開始30分前から入室できます。";return}if(window.JitsiMeetExternalAPI){document.getElementById("meet").style.minHeight="650px";new JitsiMeetExternalAPI("meet.jit.si",{roomName:v.room,parentNode:document.getElementById("meet"),width:"100%",height:650})}else{location.href="https://meet.jit.si/"+encodeURIComponent(v.room)}}
document.getElementById("requestVideoBtn").addEventListener("click",requestOnlineVisit);document.getElementById("confirmVideoBtn").addEventListener("click",confirmOnlineVisit);document.getElementById("joinBtn").addEventListener("click",joinRoom);loadOnlineVisit();
</script><script id="breederVisitView">
(async()=>{try{
 const r=await fetch("/api/me",{credentials:"same-origin"});if(!r.ok)return;
 const z=await r.json(),u=z.user||z||{},role=u.role||z.role;
 if(role!=="breeder"&&role!=="operator")return;
 const t=document.getElementById("visitTitle"),lead=document.getElementById("visitLead"),dt=document.getElementById("visitDateTitle"),dl=document.getElementById("visitDateLead"),req=document.getElementById("requestVideoBtn"),cf=document.getElementById("confirmVideoBtn");
 if(t)t.textContent="オンライン見学の申込み確認";
 if(lead)lead.textContent="購入希望者からオンライン見学の申込みが届いています。希望日時を確認して確定してください。";
 if(dt)dt.textContent="購入希望者の希望日時";
 if(dl)dl.textContent="購入希望者から届いた希望日時です。内容を確認して見学日時を確定してください。";
 if(req)req.style.display="none";document.querySelectorAll(".note").forEach(e=>{if(e.textContent.includes("日時確定後"))e.style.display="none"});
 if(cf){cf.textContent="この日時で見学を確定する";const q=new URLSearchParams(location.search).get("inquiry");if(q){const vr=await fetch("/api/inquiries/"+encodeURIComponent(q)+"/visit",{credentials:"same-origin"});if(vr.ok){const vv=await vr.json();cf.style.display="inline-block"}}}const noteEl=document.getElementById("buyerJoinNote");if(noteEl)noteEl.style.display="none";
}catch(e){console.error("breeder visit view",e)}})();
</script></body></html>
