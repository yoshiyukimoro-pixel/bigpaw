<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>オンライン見学｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="topbar">🐾 BIG PAW オンライン見学</div><header class="site-header"><div class="wrap nav"><a class="logo" href="index.html">🐾 BIG PAW</a><a class="btn btn-sub" href="messages.html">戻る</a></div></header><main class="wrap"><section class="section"><div class="card pad"><h1 id="visitTitle">オンライン見学</h1><p id="visitLead">購入希望者からブリーダーへオンライン見学を申し込み、日時確定後にこの画面から参加します。</p><div style="margin:18px 0;padding:16px;border:1px solid #ddd;border-radius:14px"><h2 id="visitDateTitle">オンライン見学の日時</h2><p id="visitDateLead">購入希望者から希望日時を送り、ブリーダーが確認して確定します。</p><label>希望日 <input id="videoDate" type="date"></label> <label>希望時間 <input id="videoTime" type="time"></label><button id="requestVideoBtn" type="button">オンライン見学を申し込む</button><p id="videoStatus" aria-live="polite"></p><button id="confirmVideoBtn" type="button" style="display:none">この日時で確定する</button></div><div class="notice">日時確定後、「オンライン見学に参加」から専用のJitsi Meetルームへ移動します。カメラ・マイクの許可は移動先で行います。</div><button id="joinBtn" class="btn btn-main btn-wide" type="button" style="display:none">📹 オンライン見学に参加</button></div></section></main><script src="assets/api.js"></script><script>
const inquiryId=()=>new URLSearchParams(location.search).get('inquiry')||'';
function localISODate(d=new Date()){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function setDateFloor(){const today=localISODate();videoDate.min=today;if(!videoDate.value)videoDate.value=today}
async function me(){try{return await BigPawAPI.me()}catch(e){return null}}
async function requestOnlineVisit(){const st=videoStatus,b=requestVideoBtn,q=inquiryId(),d=videoDate.value,t=videoTime.value;if(!q){st.textContent='問い合わせ画面からオンライン見学を開いてください。';return}if(!d||!t){st.textContent='希望日と時間を選んでください。';return}b.disabled=true;st.textContent='申し込みを送信しています…';try{await BigPawAPI.request('/inquiries/'+encodeURIComponent(q)+'/visit',{method:'POST',body:{date:d,time:t,transport:'オンライン見学',status:'proposed',faceToFaceConfirmed:false}});st.textContent='オンライン見学を申し込みました。ブリーダーの確認をお待ちください。'}catch(e){st.textContent='申し込みを送信できませんでした。'+(e.message?'（'+e.message+'）':'')}finally{b.disabled=false}}
async function loadOnlineVisit(){setDateFloor();const q=inquiryId();if(!q){videoStatus.textContent='問い合わせ画面からオンライン見学を開いてください。';requestVideoBtn.disabled=true;return}let v=null;try{v=await BigPawAPI.request('/inquiries/'+encodeURIComponent(q)+'/visit')}catch(e){if(e.status===401)location.href='login.html';return}if(!v||!v.id)return;const today=localISODate();videoDate.value=(v.visit_date&&v.visit_date>=today)?v.visit_date:today;videoTime.value=v.visit_time||'';if(v.transport!=='オンライン見学')return;if(v.status==='confirmed'){videoStatus.textContent='オンライン見学は確定しています。';joinBtn.style.display='block';requestVideoBtn.style.display='none';return}const u=await me(),role=u?.role||'';if(role==='breeder'||role==='operator'){visitTitle.textContent='オンライン見学の申込み確認';visitLead.textContent='購入希望者からオンライン見学の申込みが届いています。希望日時を確認して確定してください。';visitDateTitle.textContent='購入希望者の希望日時';visitDateLead.textContent='購入希望者から届いた希望日時です。内容を確認して見学日時を確定してください。';videoStatus.textContent='購入希望者からオンライン見学の希望日時が届いています。';confirmVideoBtn.style.display='inline-block';requestVideoBtn.style.display='none';videoDate.disabled=true;videoTime.disabled=true}else{videoStatus.textContent='オンライン見学を申し込みました。ブリーダーの確認をお待ちください。';requestVideoBtn.style.display='none'}}
async function confirmOnlineVisit(){const q=inquiryId(),d=videoDate.value,t=videoTime.value;try{await BigPawAPI.request('/inquiries/'+encodeURIComponent(q)+'/visit',{method:'POST',body:{date:d,time:t,transport:'オンライン見学',status:'confirmed',faceToFaceConfirmed:false}});videoStatus.textContent='オンライン見学を確定しました。';confirmVideoBtn.style.display='none';joinBtn.style.display='block'}catch(e){videoStatus.textContent='確定できませんでした。'+(e.message?'（'+e.message+'）':'')}}
async function joinRoom(){const q=inquiryId();joinBtn.disabled=true;videoStatus.textContent='オンライン見学ルームを準備しています…';try{const v=await BigPawAPI.request('/inquiries/'+encodeURIComponent(q)+'/video-room');if(!v?.room)throw new Error('room_not_ready');location.href='https://meet.jit.si/'+encodeURIComponent(v.room)}catch(e){joinBtn.disabled=false;videoStatus.textContent='まだ入室できません。日時確定後、開始30分前から入室できます。'}}
requestVideoBtn.addEventListener('click',requestOnlineVisit);confirmVideoBtn.addEventListener('click',confirmOnlineVisit);joinBtn.addEventListener('click',joinRoom);loadOnlineVisit();
</script></body></html>
