<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>売上・手数料｜BIG PAW運営</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="topbar">🐾 BIG PAW 運営管理</div><header class="site-header"><div class="wrap nav"><a class="logo" href="operator-admin.html"><span class="logo-mark">🐾</span>BIG PAW 運営</a><nav class="navlinks"><a href="operator-admin.html">ダッシュボード</a><a href="operator-deal-reports.html">成約申請</a><a href="operator-deals.html">成約管理</a></nav></div></header><div class="hero-mini"><div class="wrap"><h1>売上・手数料</h1><p>実データの流通額と、料金体系の試算を同じ画面で確認。</p></div></div><main class="wrap"><section class="section"><div class="grid two"><div class="card pad"><h2>実績</h2><div class="fact-grid"><div class="fact"><span>全商談</span><b id="realDeals">-</b></div><div class="fact"><span>成約完了</span><b id="realCompleted">-</b></div><div class="fact"><span>成約流通総額</span><b id="realGmv">-</b></div><div class="fact"><span>予約金入金総額</span><b id="realReservation">-</b></div></div></div><div class="card pad"><h2>成約手数料 5%（税込）</h2><div class="fact-grid"><div class="fact"><span>請求済み累計</span><b id="commissionBilled">-</b></div><div class="fact"><span>入金済み</span><b id="commissionPaid">-</b></div><div class="fact"><span>未入金</span><b id="commissionOutstanding">-</b></div><div class="fact"><span>期限超過</span><b id="commissionOverdue">-</b></div></div><div class="notice">掲載料・月額0円。お迎え完了時に生体販売価格の5%を自動請求し、支払期限は請求日から7日以内です。</div></div></div></section></main><script src="assets/api.js"></script><script>function yen(n){return Math.round(Number(n||0)).toLocaleString()+'円'}(async()=>{try{const rev=await BigPawAPI.operatorRevenue();realDeals.textContent=rev.deals+'件';realCompleted.textContent=rev.completedDeals+'件';realGmv.textContent=yen(rev.completedGmv);realReservation.textContent=yen(rev.reservationTotal);commissionBilled.textContent=yen(rev.commissionBilled);commissionPaid.textContent=yen(rev.commissionPaid);commissionOutstanding.textContent=yen(rev.commissionOutstanding);commissionOverdue.textContent=yen(rev.commissionOverdue)+'（'+(rev.commissionOverdueCount||0)+'件）'}catch(e){realDeals.textContent='要ログイン'}})();</script><script src="/auth-return-fix.js"></script><style id="bigpaw-role-theme">body{background:#fff7fb!important}body.bigpaw-breeder-theme{background:#f3f8ff!important}body.bigpaw-operator-theme{background:#fffbea!important}</style><script>(function(){var p=location.pathname;if(p.indexOf("/operator-")>=0)document.body.classList.add("bigpaw-operator-theme");else if(p.indexOf("/breeder-")>=0||p.endsWith("/admin.html"))document.body.classList.add("bigpaw-breeder-theme");})();</script></body></html>
