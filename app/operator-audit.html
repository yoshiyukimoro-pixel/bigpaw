<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>運営監査ログ｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="topbar">🐾 BIG PAW 運営管理</div><header class="site-header"><div class="wrap nav"><a class="logo" href="operator-admin.html"><span class="logo-mark">🐾</span>BIG PAW 運営</a><nav class="navlinks"><a href="operator-admin.html">ダッシュボード</a><a href="operator-backups.html">バックアップ</a></nav></div></header><main class="wrap"><section class="section"><div class="section-head"><div><h1>監査ログ</h1><p>ログイン・審査・更新など重要操作の記録。</p></div></div><div class="card pad"><div id="rows">読み込み中…</div></div></section></main><script src="assets/api.js"></script><script>function t(v){return v?new Date(v*1000).toLocaleString('ja-JP'):'-'}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){try{const a=await BigPawAPI.audit();rows.innerHTML=a.length?a.map(x=>`<div style="padding:12px 0;border-bottom:1px solid #f1dbe5"><b>${esc(x.action)}</b> <span class="muted">${t(x.created_at)}</span><br><span class="muted">${esc(x.email||'system')}｜${esc(x.target_type||'')} ${esc(x.target_id||'')} ${esc(x.detail||'')}</span></div>`).join(''):'記録はありません。'}catch(e){rows.innerHTML='運営アカウントでログインしてください。'}}load();</script></body></html>
