<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>成約申請｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"><style>.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;font-weight:800;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}.field textarea{min-height:90px}.report{padding:16px 0;border-bottom:1px solid var(--line)}@media(max-width:700px){.formgrid{grid-template-columns:1fr}}</style></head><body>
<div class="topbar">🐾 BIG PAW ブリーダー管理</div><header class="site-header"><div class="wrap nav"><a class="logo" href="admin.html"><span class="logo-mark">🐾</span>BIG PAW 管理</a><nav class="navlinks"><a href="breeder-inquiries.html">問い合わせ</a><a href="breeder-billing.html">請求</a><a href="index.html">公開サイト ↗</a></nav></div></header>
<div class="hero-mini"><div class="wrap"><span class="pill">SALE REPORT</span><h1>成約・お迎え完了を申請</h1><p>BIG PAW経由で成約し、お迎えが完了したらこちらから運営へ申請してください。</p></div></div>
<main class="wrap"><section class="section"><div class="grid two"><div class="card pad"><h2>成約申請</h2><div class="notice" style="margin-bottom:16px">運営が内容を確認して承認すると「成約済み」になり、最終生体販売価格の5%の請求書が自動発行されます。</div><div class="field"><label>対象の問い合わせ</label><select id="inquiry"></select></div><div class="formgrid"><div class="field"><label>最終生体販売価格（税込）</label><input id="price" type="number" min="1" placeholder="例 300000"></div><div class="field"><label>お迎え完了日</label><input id="pickupDate" type="date"></div></div><div class="field"><label>購入者名（確認用）</label><input id="buyerName" placeholder="例 山田 太郎"></div><div class="field"><label>備考</label><textarea id="note" placeholder="価格変更や特記事項があれば入力してください。"></textarea></div><label style="display:flex;gap:8px;align-items:flex-start;margin:14px 0"><input id="confirm" type="checkbox" style="margin-top:5px"> <span>成約し、お迎えが完了したこと、入力した最終販売価格に間違いがないことを確認しました。</span></label><button class="btn btn-main" onclick="submitReport()">成約申請を送信</button><div id="msg" class="muted" style="margin-top:12px"></div></div><div class="card pad"><h2>申請済み</h2><div id="reports">読み込み中…</div></div></div></section></main>
<script src="assets/app.js"></script><script src="assets/api.js"></script><script>
const esc=s=>BigPaw.esc(s), yen=n=>BigPaw.currency(Number(n||0));
async function load(){try{const [inq,reps]=await Promise.all([BigPawAPI.inquiries(),BigPawAPI.breederDealReports()]);const used=new Set(reps.filter(r=>r.status==='pending'||r.status==='approved').map(r=>r.inquiry_id));const qs=inq.filter(x=>!used.has(x.id));inquiry.innerHTML=qs.length?qs.map(x=>`<option value="${esc(x.id)}" data-price="${Number(x.puppy_price||0)}">${esc(x.puppy_name||'子犬')}｜${esc(x.name||'購入希望者')}さん</option>`).join(''):'<option value="">申請できる問い合わせがありません</option>';const wanted=new URLSearchParams(location.search).get('inquiry');if(wanted&&qs.some(x=>x.id===wanted))inquiry.value=wanted;const selected=qs.find(x=>x.id===inquiry.value);if(selected&&!price.value)price.value=selected.puppy_price||'';inquiry.onchange=()=>{const q=qs.find(x=>x.id===inquiry.value);if(q)price.value=q.puppy_price||''};reports.innerHTML=reps.length?reps.map(r=>`<div class="report"><b>${esc(r.puppy_name)}｜${esc(r.buyer_display||r.buyer_name||'購入者')}</b><br><span class="muted">最終価格 ${yen(r.final_sale_amount)} / お迎え ${esc(r.pickup_date)}</span><div class="chips" style="margin-top:7px"><span class="chip">${r.status==='pending'?'運営確認待ち':r.status==='approved'?'承認済み':'差し戻し'}</span>${r.invoice_no?`<span class="chip">請求 ${esc(r.invoice_no)} / ${yen(r.fee_amount)}</span>`:''}</div>${r.review_note?`<div class="notice" style="margin-top:8px">${esc(r.review_note)}</div>`:''}${r.status==='rejected'?`<button class="btn btn-sub reuse-btn" style="margin-top:8px" data-inquiry="${esc(r.inquiry_id)}" data-price="${Number(r.final_sale_amount)}" data-date="${esc(r.pickup_date)}" data-buyer="${esc(r.buyer_name||'')}">内容を直して再申請</button>`:''}</div>`).join(''):'<p class="muted">まだ成約申請はありません。</p>';document.querySelectorAll('.reuse-btn').forEach(btn=>btn.addEventListener('click',()=>reuse(btn.dataset.inquiry,Number(btn.dataset.price),btn.dataset.date,btn.dataset.buyer)));}catch(e){reports.innerHTML='ブリーダーとしてログインしてください。'}}
function reuse(id,p,d,b){inquiry.value=id;price.value=p;pickupDate.value=d;buyerName.value=b;window.scrollTo({top:0,behavior:'smooth'})}
async function submitReport(){if(!inquiry.value){msg.textContent='対象の問い合わせを選んでください。';return}if(!confirm.checked){msg.textContent='確認チェックが必要です。';return}const amount=Number(price.value||0);if(!amount||!pickupDate.value){msg.textContent='最終販売価格とお迎え完了日を入力してください。';return}try{const d=await BigPawAPI.ensureDeal(inquiry.value);await BigPawAPI.submitDealReport(d.id,{finalSaleAmount:amount,pickupDate:pickupDate.value,buyerName:buyerName.value,note:note.value});msg.textContent='成約申請を送信しました。BIG PAW運営の確認待ちです。';price.value='';pickupDate.value='';buyerName.value='';note.value='';confirm.checked=false;await load()}catch(e){msg.textContent=e.data?.message||e.message||'申請できませんでした。'}}
load();
</script><script src="/auth-return-fix.js"></script><style id="bigpaw-role-theme">body{background:#fff7fb!important}body.bigpaw-breeder-theme{background:#f3f8ff!important}body.bigpaw-operator-theme{background:#fffbea!important}</style><script>(function(){var p=location.pathname;if(p.indexOf("/operator-")>=0)document.body.classList.add("bigpaw-operator-theme");else if(p.indexOf("/breeder-")>=0||p.endsWith("/admin.html"))document.body.classList.add("bigpaw-breeder-theme");})();</script></body></html>
