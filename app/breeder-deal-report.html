<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>成約・お迎えの報告｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"><style>body{background:#f3f8ff;font-size:16px}main{max-width:900px;margin:auto;padding:20px}label{display:block;margin:14px 0}input,select,textarea{padding:10px;width:100%;font:inherit}input[type=checkbox]{width:auto}.item{border-bottom:1px solid #ccc;padding:16px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.notice{margin:14px 0}button{font:inherit}.status{font-weight:bold}#message{white-space:pre-wrap;margin:16px 0}nav{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:20px}</style></head><body><main><nav><a href="admin.html">管理画面に戻る</a><a href="index.html">BIG PAW</a></nav><h1>成約・お迎えの報告</h1><div id="message" role="status"></div>
<div id="benefit" class="notice">特典を確認しています…</div>
<p>成約が決まったら申請し、お迎え後に完了を報告してください。お迎え完了の報告時に成約が確定し、初回無料対象以外は請求書を自動発行します。購入者にも確認メールを送ります。</p>
<section class="card pad"><h2>成約申請</h2><label>対象の問い合わせ<select id="inquiry"></select></label><label>最終生体販売価格（税込）<input id="amount" type="number" min="1" max="100000000"></label><label>お迎え予定日（未定の場合は空欄）<input id="date" type="date"></label><label>購入者名<input id="buyerName" maxlength="200"></label><label>備考<textarea id="note" maxlength="1000"></textarea></label><label><input type="checkbox" id="agree"> 初回無料特典は最初の成約申請時に使用され、キャンセルしても戻らないこと、虚偽の申告が確認された場合は掲載停止になることを確認しました。</label><label><input type="checkbox" id="accurate"> 成約・お迎え完了・キャンセルについて正確に申告します。運営の確認により虚偽の申告が認められた場合、現在の掲載および今後の新規掲載・再掲載が停止されることに同意します。</label><button id="submit" class="btn btn-main">成約申請を送信</button></section>
<section class="card pad" style="margin-top:20px"><h2>申請した取引</h2><div id="workflow">読み込み中…</div></section>
</main><script src="assets/api.js"></script><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const yen=n=>Number(n||0).toLocaleString()+'円'; const api=(p,method='GET',body)=>BigPawAPI.request(p,{method,...(body?{body}: {})});const msg=(s)=>document.getElementById('message').textContent=s;

const names={sale_pending:'購入者の成約確認待ち',sale_confirmed:'成約確認済み・お迎え待ち',pickup_pending:'購入者のお迎え確認待ち',completed:'お迎え完了',cancellation_pending:'購入者のキャンセル確認待ち',cancelled:'キャンセル済み',disputed:'運営確認中',needs_correction:'内容の修正が必要'};let qs=[];let busy=false;
async function load(){try{const [b,inq,ws]=await Promise.all([api('/breeder/first-sale-benefit'),BigPawAPI.inquiries(),api('/breeder/sale-workflow')]);benefit.textContent=b.listingSuspended?'掲載は停止されています。運営へお問い合わせください。':b.used?'初回成約手数料無料：使用済み。今後のお迎え完了には5%の手数料がかかります。':'初回成約手数料無料：未使用。初回の成約申請1件に適用します。';qs=inq;inquiry.innerHTML=qs.map(q=>`<option value="${esc(q.id)}">${esc(q.puppy_name||'子犬')}／${esc(q.name||'購入希望者')}</option>`).join('');const selected=qs.find(q=>q.id===inquiry.value);if(selected&&!amount.value)amount.value=selected.puppy_price||'';workflow.innerHTML=ws.length?ws.map(w=>`<div class="item"><b>${esc(w.puppy_name)}</b><p>${yen(w.amount)}／${esc(w.pickup_date||'お迎え日未定')}</p><p class="status">${esc(names[w.state]||w.state)}</p><p>${w.waived?'初回無料対象：手数料0円':'お迎え完了後の手数料：'+yen(Math.floor(w.amount*.05))}</p><div class="actions">${['sale_pending','sale_confirmed','needs_correction'].includes(w.state)?`<button class="btn btn-main" data-pickup="${esc(w.deal_id)}">お迎え完了を報告</button>`:''}${!['completed','cancelled','cancellation_pending','disputed'].includes(w.state)?`<button class="btn btn-sub" data-cancel="${esc(w.deal_id)}">キャンセルを報告</button>`:''}</div></div>`).join(''):'申請した取引はありません。';workflow.querySelectorAll('[data-pickup]').forEach(el=>el.onclick=()=>pickup(el.dataset.pickup,ws.find(w=>w.deal_id===el.dataset.pickup)));workflow.querySelectorAll('[data-cancel]').forEach(el=>el.onclick=()=>cancelSale(el.dataset.cancel));}catch(e){msg(e.data?.message||'ブリーダーとしてログインしてください。');workflow.textContent='読み込めませんでした。'}}
inquiry.onchange=()=>{const q=qs.find(q=>q.id===inquiry.value);amount.value=q?.puppy_price||''};
submit.onclick=async()=>{if(busy)return;if(!agree.checked||!accurate.checked||!inquiry.value||Number(amount.value)<=0)return msg('対象の問い合わせ・販売価格・確認チェックを入力してください。');busy=true;submit.disabled=true;try{const d=await BigPawAPI.ensureDeal(inquiry.value);const r=await api('/deals/'+encodeURIComponent(d.id)+'/sale-report','POST',{finalSaleAmount:Number(amount.value),pickupDate:date.value,buyerName:buyerName.value,note:note.value,agreeFirstSaleTerms:true,agreeAccurateReporting:true});msg('申請しました。購入者へ確認メールを送ります。'+(r.waived?'今回は初回無料の対象です。':''));await load();}catch(e){msg(e.data?.message||e.message)}finally{busy=false;submit.disabled=false}};
async function pickup(id,w){if(busy)return;if(!accurate.checked)return msg('正確な申告と掲載停止の説明に同意してください。');const d=prompt('実際にお迎えが完了した日を入力してください（YYYY-MM-DD）',w.pickup_date||new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'}));if(!d)return;if(!confirm('お迎えが完了し、販売価格が'+yen(w.amount)+'であることを確認しましたか？'))return;busy=true;try{await api('/deals/'+encodeURIComponent(id)+'/completion-report','POST',{finalSaleAmount:w.amount,pickupDate:d,buyerName:w.buyer_name,note:w.note,agreeFirstSaleTerms:true,agreeAccurateReporting:true});msg('お迎え完了を報告しました。成約を確定し、初回無料対象以外は請求書を発行しました。');await load()}catch(e){msg(e.data?.message||e.message)}finally{busy=false}}
async function cancelSale(id){if(!accurate.checked)return msg('正確な申告と掲載停止の説明に同意してください。');if(busy||!confirm('キャンセルを報告しますか？無料特典は戻りません。購入者にも確認します。'))return;busy=true;try{await api('/deals/'+encodeURIComponent(id)+'/cancel-report','POST',{note:'',agreeAccurateReporting:true});msg('キャンセルを報告しました。購入者の確認待ちです。');await load()}catch(e){msg(e.data?.message||e.message)}finally{busy=false}}
load();
</script></body></html>
