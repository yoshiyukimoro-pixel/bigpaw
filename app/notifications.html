<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>通知｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="assets/account-page-theme.css?v=20261004"><style id="bp-notification-clarity">
html[data-bp-page-theme="breeder"] body.bp-account-page{background:#f3f8ff!important;color:#405a73}
html[data-bp-page-theme="breeder"] body.bp-account-page .btn-main{background:linear-gradient(135deg,#5f8fc3,#7da9d4)!important}
.bp-notice-action{display:inline-flex;margin-top:9px;font-weight:800;min-height:42px;align-items:center}
</style></head><body class="bp-account-page"><div class="topbar">🐾 大型犬専門｜BIG PAW</div><header class="site-header"><div class="wrap nav"><a class="logo" href="index.html"><span class="logo-mark">🐾</span>BIG PAW</a><nav class="navlinks"><a href="mypage.html">マイページ</a></nav></div></header><div class="hero-mini"><div class="wrap"><h1 id="notificationTitle">通知</h1><p>問い合わせ・メッセージ・見学・契約などのお知らせ。</p></div></div><main class="wrap"><section class="section" style="max-width:820px;margin:auto"><div class="card pad"><div id="list" class="tablelike"><div class="table-row"><div>読み込み中</div><div>通知を確認しています…</div></div></div></div></section></main><script src="assets/api.js"></script><script>
function dt(sec){if(!sec)return '-';return new Date(sec*1000).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}async function init(){
 if(!BigPawAPI.isLive()){list.textContent='デモ表示です';return}
 try{
  const user=await BigPawAPI.me();
  const role=String(user.role||'buyer');
  document.documentElement.setAttribute('data-bp-page-theme',role==='breeder'?'breeder':role==='operator'?'operator':'buyer');
  if(role==='breeder')notificationTitle.textContent='ブリーダーへのお知らせ';
  else if(role==='operator')notificationTitle.textContent='運営へのお知らせ';
  const rows=await BigPawAPI.notifications();
  list.replaceChildren();
  if(!rows.length){const div=document.createElement('div');div.className='table-row';div.textContent='新しい通知はありません。';list.appendChild(div);return}
  rows.forEach(n=>{
   const row=document.createElement('div');row.className='table-row';
   const date=document.createElement('div');date.textContent=dt(n.created_at);
   const detail=document.createElement('div');
   const title=document.createElement('b');title.textContent=String(n.title||'お知らせ');
   const body=document.createElement('div');body.className='muted';body.textContent=String(n.body||'');
   detail.append(title,body);
   const kind=String(n.kind||'');
   let dest='';
   if(role==='breeder'&&(kind==='inquiry'||kind==='message'||kind==='visit'))dest='/breeder-inquiries.html';
   else if(role==='breeder'&&kind==='billing')dest='/breeder-billing.html';
   else if(role==='operator'&&(kind==='inquiry'||kind==='message'))dest='/messages.html?mode=operator';
   else if(role==='buyer'&&(kind==='message'||kind==='visit'))dest='/messages.html';
   if(dest){const link=document.createElement('a');link.href=dest;link.className='btn btn-sub bp-notice-action';link.textContent=kind==='inquiry'||kind==='message'?'問い合わせ内容を確認・返信する':'詳細を確認する';detail.appendChild(link)}
   row.append(date,detail);list.appendChild(row);
  });
 }catch(e){list.textContent='お知らせを表示できません。該当するアカウントでログインしてご確認ください。'}
}
init();
</script><script src="/auth-return-fix.js"></script></body></html>
