<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>通知｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="topbar">🐾 大型犬専門｜BIG PAW</div><header class="site-header"><div class="wrap nav"><a class="logo" href="index.html"><span class="logo-mark">🐾</span>BIG PAW</a><nav class="navlinks"><a href="mypage.html">マイページ</a></nav></div></header><div class="hero-mini"><div class="wrap"><h1>通知</h1><p>問い合わせ・メッセージ・見学・契約などのお知らせ。</p></div></div><main class="wrap"><section class="section" style="max-width:820px;margin:auto"><div class="card pad"><div id="list" class="tablelike"><div class="table-row"><div>読み込み中</div><div>通知を確認しています…</div></div></div></div></section></main><script src="assets/api.js"></script><script>
function dt(sec){if(!sec)return '-';return new Date(sec*1000).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}async function init(){if(!BigPawAPI.isLive()){list.innerHTML='<div class="table-row"><div>デモ</div><div>サーバー起動時は実際の通知がここに表示されます。</div></div>';return}try{const rows=await BigPawAPI.notifications();list.innerHTML=rows.length?rows.map(n=>`<div class="table-row"><div>${dt(n.created_at)}</div><div><b>${String(n.title||'')}</b><br><span class="muted">${String(n.body||'')}</span></div></div>`).join(''):'<div class="table-row"><div>通知</div><div>新しい通知はありません。</div></div>'}catch(e){list.innerHTML='<div class="table-row"><div>ログイン</div><div>通知を見るにはログインしてください。</div></div>'}}init();
</script><script src="/auth-return-fix.js"></script></body></html>
