<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>アカウント設定｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="topbar">🐾 BIG PAW マイページ</div><header class="site-header"><div class="wrap nav"><a class="logo" href="index.html"><span class="logo-mark">🐾</span>BIG PAW</a><nav class="navlinks"><a href="mypage.html">マイページ</a><a href="search.html">子犬を探す</a></nav></div></header><main class="wrap"><section class="section" style="max-width:720px;margin:auto"><form class="card pad" onsubmit="save(event)"><h1>アカウント設定</h1><div id="logged"></div><div class="form-grid"><div class="field"><label>姓</label><input id="last"></div><div class="field"><label>名</label><input id="first"></div></div><div class="field"><label>表示名</label><input id="displayName"></div><div class="field"><label>メールアドレス</label><input id="email" type="email" disabled></div><div id="verify"></div><div class="field" id="favoriteUpdateSetting" style="display:none;padding:12px 0"><label style="display:flex;gap:10px;align-items:center;cursor:pointer"><input id="favoriteUpdateMail" type="checkbox" disabled style="width:20px;height:20px">お気に入りの子犬の変更をメールで受け取る</label><p class="muted" style="margin:6px 0">価格・写真・紹介文・募集状況の変更をまとめてお知らせします。いつでも停止できます。</p><div id="favoriteUpdateMsg" class="muted" aria-live="polite"></div></div><div id="msg"></div><button class="btn btn-main" style="margin-top:18px">保存する</button><a class="btn btn-sub" style="margin-top:18px" href="forgot-password.html">パスワード変更</a><button type="button" class="btn btn-sub" style="margin-top:18px" onclick="logout()">ログアウト</button></form></section></main><script src="assets/api.js"></script><script>async function load(){try{const u=await BigPawAPI.me();last.value=u.last||'';first.value=u.first||'';displayName.value=u.displayName||'';email.value=u.email||'';logged.className='notice';logged.textContent='ログイン中：'+u.email;verify.innerHTML=u.emailVerified?'<div class="notice">✓ メール確認済み</div>':'<a class="btn btn-sub" href="verify-email.html">メールアドレスを確認する</a>'}catch(e){logged.innerHTML='<div class="notice">現在ログインしていません。<a href="login.html"><b>ログインする</b></a></div>'}}async function save(e){e.preventDefault();try{await BigPawAPI.updateMe({last:last.value,first:first.value,displayName:displayName.value});msg.innerHTML='<div class="notice">保存しました。</div>'}catch(e){msg.innerHTML='<div class="notice">保存できませんでした。</div>'}}async function logout(){await BigPawAPI.logout();location.href='index.html'}load();</script><script src="/mypage-email-verify.js"></script><script src="/auth-return-fix.js"></script><style id="bigpaw-role-theme">body{background:#fff7fb!important}body.bigpaw-breeder-theme{background:#f3f8ff!important}body.bigpaw-operator-theme{background:#fffbea!important}</style><script>(function(){var p=location.pathname;if(p.indexOf("/operator-")>=0)document.body.classList.add("bigpaw-operator-theme");else if(p.indexOf("/breeder-")>=0||p.endsWith("/admin.html"))document.body.classList.add("bigpaw-breeder-theme");})();</script><script id="bigpaw-favorite-update-preferences">
(function(){
  const section=document.getElementById('favoriteUpdateSetting');
  const toggle=document.getElementById('favoriteUpdateMail');
  const message=document.getElementById('favoriteUpdateMsg');
  async function loadPreference(){
    try{
      const me=await BigPawAPI.me();
      if(me.role!=='buyer')return;
      section.style.display='block';
      const data=await BigPawAPI.request('/favorite-notifications/settings');
      toggle.checked=!!data.enabled;toggle.disabled=false;
    }catch(e){
      if(section.style.display==='block')message.textContent='通知設定を読み込めませんでした。ページを更新してください。';
    }
  }
  toggle.addEventListener('change',async function(){
    const desired=toggle.checked;
    toggle.disabled=true;message.textContent='保存中…';
    try{
      const data=await BigPawAPI.request('/favorite-notifications/settings',
        {method:'PATCH',body:{enabled:desired}});
      toggle.checked=!!data.enabled;message.textContent='通知設定を保存しました。';
    }catch(e){
      toggle.checked=!desired;message.textContent='保存できませんでした。再度お試しください。';
    }finally{toggle.disabled=false;}
  });
  loadPreference();
})();
</script></body></html>
