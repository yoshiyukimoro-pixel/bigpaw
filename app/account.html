<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>アカウント設定｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="topbar">🐾 BIG PAW マイページ</div><header class="site-header"><div class="wrap nav"><a class="logo" href="index.html"><span class="logo-mark">🐾</span>BIG PAW</a><nav class="navlinks"><a href="mypage.html">マイページ</a><a href="search.html">子犬を探す</a></nav></div></header><main class="wrap"><section class="section" style="max-width:720px;margin:auto"><form class="card pad" onsubmit="save(event)"><h1>アカウント設定</h1><div id="logged"></div><div class="form-grid"><div class="field"><label>姓</label><input id="last"></div><div class="field"><label>名</label><input id="first"></div></div><div class="field"><label>表示名</label><input id="displayName"></div><div class="field"><label>メールアドレス</label><input id="email" type="email" disabled></div><div id="verify"></div><div id="msg"></div><button class="btn btn-main" style="margin-top:18px">保存する</button><a class="btn btn-sub" style="margin-top:18px" href="forgot-password.html">パスワード変更</a><button type="button" class="btn btn-sub" style="margin-top:18px" onclick="logout()">ログアウト</button></form></section></main><script src="assets/api.js"></script><script>async function load(){try{const u=await BigPawAPI.me();last.value=u.last||'';first.value=u.first||'';displayName.value=u.displayName||'';email.value=u.email||'';logged.className='notice';logged.textContent='ログイン中：'+u.email;verify.innerHTML=u.emailVerified?'<div class="notice">✓ メール確認済み</div>':'<a class="btn btn-sub" href="verify-email.html">メールアドレスを確認する</a>'}catch(e){logged.innerHTML='<div class="notice">現在ログインしていません。<a href="login.html"><b>ログインする</b></a></div>'}}async function save(e){e.preventDefault();try{await BigPawAPI.updateMe({last:last.value,first:first.value,displayName:displayName.value});msg.innerHTML='<div class="notice">保存しました。</div>'}catch(e){msg.innerHTML='<div class="notice">保存できませんでした。</div>'}}async function logout(){await BigPawAPI.logout();location.href='index.html'}load();</script><script src="/mypage-email-verify.js"></script><script src="/auth-return-fix.js"></script><style id="bigpaw-role-theme">body{background:#fff7fb!important}body.bigpaw-breeder-theme{background:#f3f8ff!important}body.bigpaw-operator-theme{background:#fffbea!important}</style><script>(function(){var p=location.pathname;if(p.indexOf("/operator-")>=0)document.body.classList.add("bigpaw-operator-theme");else if(p.indexOf("/breeder-")>=0||p.endsWith("/admin.html"))document.body.classList.add("bigpaw-breeder-theme");})();</script></body></html>
