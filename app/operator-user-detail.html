<!doctype html><html lang="ja" data-bp-page-theme="operator"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ユーザー詳細｜BIG PAW運営</title><link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="assets/account-page-theme.css?v=20261005"><style>.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.kv{padding:11px 0;border-bottom:1px solid #eee7d6}.kv:last-child{border-bottom:0}.kv small{display:block;color:#867e70;margin-bottom:3px}.private-box{border:2px solid #e0b84c;background:#fffaf0}.private-box summary{cursor:pointer;font-weight:800}.mail-form input,.mail-form textarea{width:100%;box-sizing:border-box}.role-badge{display:inline-block;padding:5px 10px;border-radius:999px;font-weight:800;background:#f0ede5}.status-ok{color:#2e7d32;font-weight:800}.status-wait{color:#9b5d00;font-weight:800}@media(max-width:720px){.detail-grid{grid-template-columns:1fr}}</style></head><body class="bp-account-page"><div class="topbar">🐾 BIG PAW 運営管理</div><header class="site-header"><div class="wrap nav"><a class="logo" href="operator-admin.html"><span class="logo-mark">🐾</span>BIG PAW 運営</a><nav class="navlinks"><a href="operator-users.html">登録ユーザー</a><a href="operator-breeders.html">ブリーダー管理</a></nav></div></header><main class="wrap"><div class="breadcrumb"><a href="operator-admin.html">ダッシュボード</a> ＞ <a href="operator-users.html">登録ユーザー</a> ＞ ユーザー詳細</div><section class="section"><div id="content"><div class="card pad">読み込み中…</div></div></section></main><script src="assets/api.js"></script><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const roleLabel=r=>({buyer:'一般ユーザー',breeder:'ブリーダー',operator:'運営'}[r]||r||'-');const appLabel=s=>({pending:'審査待ち',approved:'承認済み',rejected:'差し戻し'}[s]||s||'-');const dateText=v=>{if(!v)return '-';const d=new Date(Number(v)*1000);return isNaN(d)?'-':d.toLocaleString('ja-JP')};const id=new URLSearchParams(location.search).get('id')||'';let user=null;async function load(){if(!id){content.innerHTML='<div class="card pad">ユーザーIDがありません。</div>';return}try{user=await BigPawAPI.request('/operator/users/'+encodeURIComponent(id));const name=user.display_name||[user.last,user.first].filter(Boolean).join(' ')||'名前未登録';const breeder=!!(user.breeder_id||user.breeder_application_id);const privateRows=breeder?`<div class="kv"><small>見学先住所（非公開）</small>${esc(user.visit_address||'未登録')}</div><div class="kv"><small>見学時の電話番号（非公開）</small>${esc(user.visit_phone||'未登録')}</div><div class="kv"><small>アクセス案内（非公開）</small>${esc(user.visit_access||'未登録')}</div>`:`<div class="kv"><small>電話番号</small>${esc(user.buyer_phone||'登録情報なし')}</div><div class="kv"><small>住所</small>現在、一般ユーザーの住所はアカウント基本情報として保存していません。</div>`;const breederBlock=breeder?`<div class="card pad"><h2>ブリーダー情報</h2><div class="kv"><small>犬舎名（運営管理用）</small>${esc(user.kennel_name||'未設定')}</div><div class="kv"><small>代表者</small>${esc(user.representative||'未設定')}</div><div class="kv"><small>都道府県</small>${esc(user.prefecture||'未設定')}</div><div class="kv"><small>第一種動物取扱業 登録番号</small>${esc(user.registration_no||user.application_registration_no||'未設定')}</div><div class="kv"><small>申請状況</small>${esc(appLabel(user.breeder_application_status))}</div><div class="kv"><small>掲載子犬／問い合わせ／成約・商談</small>${Number(user.breeder_puppy_count||0)}頭 ／ ${Number(user.breeder_inquiry_count||0)}件 ／ ${Number(user.breeder_deal_count||0)}件</div>${user.breeder_id?`<div style="margin-top:12px"><a class="btn btn-sub" href="operator-breeder-detail.html?id=${encodeURIComponent(user.breeder_id)}">ブリーダー管理・詳細を見る</a></div>`:''}</div>`:'';content.innerHTML=`<div class="detail-grid"><div class="card pad"><h1>ユーザー詳細</h1><p><span class="role-badge">${esc(roleLabel(user.role))}</span></p><div class="kv"><small>氏名・表示名</small><b>${esc(name)}</b></div><div class="kv"><small>メールアドレス</small>${esc(user.email||'-')}</div><div class="kv"><small>メール認証</small><span class="${user.email_verified?'status-ok':'status-wait'}">${user.email_verified?'認証済み':'未認証'}</span></div><div class="kv"><small>管理ID</small>${esc(user.id||'')}</div><div class="kv"><small>登録日時</small>${esc(dateText(user.created_at))}</div><div class="kv"><small>一般ユーザーとしての利用状況</small>お気に入り ${Number(user.favorite_count||0)}件 ／ 問い合わせ ${Number(user.inquiry_count||0)}件 ／ 成約・商談 ${Number(user.deal_count||0)}件</div><div class="notice" style="margin-top:14px"><b>パスワードは運営画面にも表示しません。</b><br>パスワード本体・ハッシュ・ソルトのいずれもこの画面/APIには返していません。</div></div><div><details class="card pad private-box"><summary>必要な場合だけ住所・電話番号を確認する</summary><div style="margin-top:12px">${privateRows}</div></details>${breederBlock}</div></div><div class="card pad mail-form" style="margin-top:14px"><h2>このユーザーへメールを送る</h2><p class="muted">運営から確認事項や案内が必要な場合だけ使用します。</p><div class="field"><label>件名</label><input id="mailSubject" maxlength="200" value="【BIG PAW】ご連絡"></div><div class="field"><label>本文</label><textarea id="mailBody" rows="8" maxlength="5000"></textarea></div><div id="mailMsg"></div><button id="mailBtn" class="btn btn-main" type="button" onclick="sendMail()" ${user.mail_allowed?'':'disabled'}>${user.mail_allowed?'メールを送信':'送信可能なメールアドレスがありません'}</button></div>`}catch(e){content.innerHTML='<div class="card pad">ユーザー情報を読み込めませんでした。運営アカウントでログインしているか確認してください。</div>'}}async function sendMail(){const subject=(mailSubject.value||'').trim(),message=(mailBody.value||'').trim();if(!subject||!message){mailMsg.innerHTML='<div class="notice">件名と本文を入力してください。</div>';return}if(!confirm('この内容でユーザーへメールを送信しますか？'))return;mailBtn.disabled=true;mailBtn.textContent='送信中…';mailMsg.innerHTML='';try{await BigPawAPI.request('/operator/users/'+encodeURIComponent(id)+'/email',{method:'POST',body:{subject,message}});mailMsg.innerHTML='<div class="notice">✓ メールを送信しました。</div>';mailBody.value=''}catch(e){mailMsg.innerHTML='<div class="notice">メールを送信できませんでした。'+esc(e&&e.message?e.message:'')+'</div>'}finally{mailBtn.disabled=false;mailBtn.textContent='メールを送信'}}load();</script><script src="/auth-return-fix.js"></script><style id="bigpaw-role-theme">body{background:#fffbea!important}</style></body></html>
