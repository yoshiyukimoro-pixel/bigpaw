<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ログイン｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="topbar">🐾 大型犬専門｜BIG PAW</div><header class="site-header"><div class="wrap nav"><a class="logo" href="index.html"><span class="logo-mark">🐾</span>BIG PAW</a></div></header><main class="wrap"><section class="section" style="max-width:560px;margin:auto"><form class="card pad" onsubmit="doLogin(event)"><h1 id="loginTitle">ログイン</h1><p id="loginLead" class="muted">購入希望者・ブリーダー共通の入口です。</p><div class="field"><label>メールアドレス</label><input id="email" required type="email" autocomplete="email"></div><div class="field"><label>パスワード</label><input id="password" required type="password" autocomplete="current-password"></div><div id="err" style="color:#c65584;font-weight:800;margin-bottom:10px"></div><button class="btn btn-main btn-wide">ログイン</button><a href="forgot-password.html" style="display:block;text-align:center;margin-top:12px;font-weight:800;color:#c65584">パスワードを忘れた方</a><div id="devAccounts" class="notice" style="margin-top:14px;display:none"></div><div style="text-align:center;margin:18px 0" class="muted">または</div><a class="btn btn-sub btn-wide" href="register.html">新規会員登録</a><a class="btn btn-sub btn-wide" style="margin-top:10px" href="breeder-register.html">ブリーダーとして掲載申請</a></form></section></main><script src="assets/app.js"></script><script src="assets/api.js"></script><script src="assets/bridge.js"></script><script>
function requestedRole(){return new URLSearchParams(location.search).get('role')||''}
if(requestedRole()==='buyer'){loginTitle.textContent='一般ユーザーログイン';loginLead.textContent='お気に入り・問い合わせ・見学予定を確認する一般マイページ用のログインです。'}
async function doLogin(e){e.preventDefault();err.textContent='';try{const r=await BigPawBridge.login(email.value.trim(),password.value);const role=r?.user?.role||r?.role||BigPaw.currentUser()?.role||'buyer';if(role==='operator'){try{await fetch('/api/logout',{method:'POST',credentials:'include'})}catch(_e){}err.innerHTML='運営アカウントは <a href="operator-login.html" style="font-weight:900;text-decoration:underline">運営専用ログイン</a> をご利用ください。';return}if(requestedRole()==='buyer'&&role!=='buyer'){try{await fetch('/api/logout',{method:'POST',credentials:'include'})}catch(_e){}err.textContent='一般マイページは一般ユーザー用アカウントでログインしてください。';return}location.href=role==='breeder'?'admin.html':'mypage.html'}catch(x){err.textContent='メールアドレスまたはパスワードが違います'}}
(async()=>{try{const h=await BigPawAPI.health();if(h.environment!=='production'){devAccounts.style.display='block';devAccounts.innerHTML='開発用アカウント<br>購入者：demo@bigpaw.jp / demo1234<br>ブリーダー：dog44@bigpaw.jp / demo1234<br>運営：admin@bigpaw.jp / admin1234'}}catch(e){}})();
</script><script src="/auth-return-fix.js"></script></body></html>
