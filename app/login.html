<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ログイン｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="topbar">🐾 大型犬専門｜BIG PAW</div><header class="site-header"><div class="wrap nav"><a class="logo" href="index.html"><span class="logo-mark">🐾</span>BIG PAW</a></div></header><main class="wrap"><section class="section" style="max-width:560px;margin:auto"><form class="card pad" onsubmit="doLogin(event)"><h1>ログイン</h1><p class="muted">購入希望者・ブリーダー共通の入口を想定。</p><div class="field"><label>メールアドレス</label><input id="email" required type="email" autocomplete="email"></div><div class="field"><label>パスワード</label><input id="password" required type="password" autocomplete="current-password"></div><div id="err" style="color:#c65584;font-weight:800;margin-bottom:10px"></div><button class="btn btn-main btn-wide">ログイン</button><a href="forgot-password.html" style="display:block;text-align:center;margin-top:12px;font-weight:800;color:#c65584">パスワードを忘れた方</a><div id="devAccounts" class="notice" style="margin-top:14px;display:none"></div><div style="text-align:center;margin:18px 0" class="muted">または</div><a class="btn btn-sub btn-wide" href="register.html">新規会員登録</a><a class="btn btn-sub btn-wide" style="margin-top:10px" href="breeder-register.html">ブリーダーとして掲載申請</a></form></section></main><script src="assets/app.js"></script><script src="assets/api.js"></script><script src="assets/bridge.js"></script><script>
async function doLogin(e){e.preventDefault();err.textContent='';try{const r=await BigPawBridge.login(email.value.trim(),password.value);const role=r?.user?.role||r?.role||BigPaw.currentUser()?.role||'buyer';location.href=role==='breeder'?'admin.html':role==='operator'?'operator-admin.html':'mypage.html'}catch(x){err.textContent='メールアドレスまたはパスワードが違います'}}
(async()=>{try{const h=await BigPawAPI.health();if(h.environment!=='production'){devAccounts.style.display='block';devAccounts.innerHTML='開発用アカウント<br>購入者：demo@bigpaw.jp / demo1234<br>ブリーダー：dog44@bigpaw.jp / demo1234<br>運営：admin@bigpaw.jp / admin1234'}}catch(e){}})();
</script><script src="/auth-return-fix.js"></script></body></html>
