<!doctype html><html lang="ja" data-bp-page-theme="operator"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>成約確認・掲載停止の管理｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="assets/account-page-theme.css?v=20261005"><style>body{background:#fffbea;font-size:16px}main{max-width:900px;margin:auto;padding:20px}label{display:block;margin:14px 0}input,select,textarea{padding:10px;width:100%;font:inherit}input[type=checkbox]{width:auto}.item{border-bottom:1px solid #ccc;padding:16px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.notice{margin:14px 0}button{font:inherit}.status{font-weight:bold}#message{white-space:pre-wrap;margin:16px 0}nav{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:20px}</style></head><body class="bp-account-page"><main><nav><a href="operator-admin.html">管理画面に戻る</a><a href="index.html">BIG PAW</a></nav><h1>成約確認・掲載停止の管理</h1><div id="message" role="status"></div><p>報告と購入者の回答が異なる取引を確認します。未回答は自動で承認しません。</p><section class="card pad"><h2>キャンセル申告のアラート</h2><p>30日以内に3件、警告後の再申告、キャンセル後の掲載削除・非公開化を確認します。回数だけでは自動停止しません。</p><div id="cancelAlerts">読み込み中…</div></section><section class="card pad" style="margin-top:20px"><h2>キャンセル・掲載操作の履歴</h2><div id="cancelHistory"></div><div id="listingHistory"></div><h3>警告メールの履歴</h3><div id="warningHistory"></div></section><section class="card pad" style="margin-top:20px"><h2>回答の食い違い</h2><div id="disputes">読み込み中…</div></section><section class="card pad" style="margin-top:20px"><h2>購入者の確認待ち</h2><div id="pending">読み込み中…</div></section></main><script src="assets/api.js"></script><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const yen=n=>Number(n||0).toLocaleString()+'円'; const api=(p,method='GET',body)=>BigPawAPI.request(p,{method,...(body?{body}: {})});const msg=(s)=>document.getElementById('message').textContent=s;

async function load(){try{const r=await api('/operator/sale-confirmations');renderCancellationMonitor(r);disputes.innerHTML=r.disputes.length?r.disputes.map(d=>`<div class="item"><b>${esc(d.kennel_name)}</b><p>${esc(d.puppy_name)}／購入者：${esc(d.buyer_display)}</p><p>確認内容：${esc({sale:"成約",pickup:"お迎え完了",cancellation:"キャンセル"}[d.kind])}／購入者の回答：${d.answer==="no"?"いいえ":"はい"}</p><p>報告価格：${yen(JSON.parse(d.payload).amount)}／お迎え日：${esc(JSON.parse(d.payload).pickup_date||"未定")}</p><p>取引ID：${esc(d.deal_id)}／<a href="messages.html?inquiry=${encodeURIComponent(d.inquiry_id)}&mode=operator">やり取りを確認</a></p><p>${d.status==='open'?'確認が必要です':d.status==='confirmed_false'?'虚偽を確認':'食い違いを解決'}／掲載：${d.compliance_suspended?'停止中':'通常'}</p><p>${esc(d.note)}</p><div class="actions">${['open','confirmed_false','confirmed_cancelled','confirmed_pickup'].includes(d.status)?`${d.status!=='confirmed_false'?`<button class="btn btn-main" data-review="${esc(d.id)}" data-action="confirmed_false">虚偽を確認・掲載停止</button>`:''}<button class="btn btn-sub" data-review="${esc(d.id)}" data-action="confirmed_cancelled">キャンセルを確認・請求取消</button><button class="btn btn-sub" data-review="${esc(d.id)}" data-action="confirmed_pickup">お迎え完了を確認・請求再開</button><button class="btn btn-sub" data-review="${esc(d.id)}" data-action="dismiss">食い違いを解決・修正依頼</button>`:''}${d.compliance_suspended?`<button class="btn btn-sub" data-resume="${esc(d.breeder_id)}">掲載停止を解除</button>`:''}</div></div>`).join(''):'食い違いはありません。';pending.innerHTML=r.pending.length?r.pending.map(p=>`<div class="item">${esc(p.kennel_name)}／${esc(p.puppy_name)}<br>${esc({sale:'成約確認',pickup:'お迎え完了確認',cancellation:'キャンセル確認'}[p.kind])}待ち<br>取引ID：${esc(p.deal_id)}</div>`).join(''):'確認待ちはありません。';disputes.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>review(b.dataset.review,b.dataset.action));disputes.querySelectorAll('[data-resume]').forEach(b=>b.onclick=()=>resume(b.dataset.resume));}catch(e){msg('運営アカウントでログインしてください。')}}

let warningTemplate='';
function renderCancellationMonitor(r){warningTemplate=r.warningTemplate;
 cancelAlerts.innerHTML=r.alerts.length?r.alerts.map(a=>`<div class="item"><b>${esc(a.kennel_name)}</b><p>${esc(a.reason)}／30日以内 ${a.cancellation_count}件／警告 ${a.warning_count}回</p><p>対応：${esc({open:'確認が必要',warn:'警告済み',suspend:'掲載停止',dismiss:'確認済み'}[a.status]||a.status)}／${esc(a.note)}</p>${a.status==='open'?`<div class="actions"><button class="btn btn-sub" data-cancel-alert="${esc(a.id)}" data-action="warn">警告メールを確認・送信</button><button class="btn btn-main" data-cancel-alert="${esc(a.id)}" data-action="suspend">確認して掲載停止</button><button class="btn btn-sub" data-cancel-alert="${esc(a.id)}" data-action="dismiss">確認済みにする</button></div>`:''}${a.compliance_suspended?`<button class="btn btn-sub" data-monitor-resume="${esc(a.breeder_id)}">掲載停止を解除</button>`:''}</div>`).join(''):'アラートはありません。';
 cancelHistory.innerHTML=r.cancellations.map(e=>`<div class="item">${esc(e.kennel_name)}／${esc(e.puppy_name)}／申告日時 ${esc(new Date(e.reported_at*1000).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'}))}<br>購入者：${e.buyer_answer==='yes'?'キャンセルを確認':e.buyer_answer==='no'?'キャンセルを否定':'未回答'}／取引 ${esc(e.deal_id)}</div>`).join('');
 listingHistory.innerHTML=r.listingHistory.map(e=>`<p>${esc(e.kennel_name)}／${esc(e.puppy_name)}：${esc(e.action)} ${esc(new Date(e.created_at*1000).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'}))}</p>`).join('');
 warningHistory.innerHTML=r.warnings.map(w=>`<div class="item">${esc(w.kennel_name)}／${esc(new Date(w.created_at*1000).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'}))}／理由：${esc(w.reason)}／メール：${w.sent_at?'送信処理完了':'送信待ち・再試行対象'}<p>${esc(w.body)}</p></div>`).join('')||'警告はありません。';
 cancelAlerts.querySelectorAll('[data-cancel-alert]').forEach(b=>b.onclick=()=>reviewCancellation(b.dataset.cancelAlert,b.dataset.action));cancelAlerts.querySelectorAll('[data-monitor-resume]').forEach(b=>b.onclick=()=>resume(b.dataset.monitorResume));
}
async function reviewCancellation(id,action){const note=prompt('確認した事実と対応の理由を入力してください。');if(!note)return;let message='';if(action==='warn'){message=prompt('ブリーダーへ送る警告メールの本文を確認・編集してください。',warningTemplate);if(!message)return;}if(!confirm(action==='warn'?'この本文でブリーダーへ警告メールを送りますか？':action==='suspend'?'事実を確認した上で公開掲載・新規掲載・再掲載を停止しますか？':'このアラートを確認済みにしますか？'))return;try{await api('/operator/cancellation-alerts/'+encodeURIComponent(id),'PATCH',{action,note,message});msg(action==='warn'?'警告メールを送信待ちに登録しました。履歴で送信状況を確認できます。':'対応を保存しました。');await load()}catch(e){msg(e.data?.message||e.message)}}

async function review(id,action){const note=prompt(action==='confirmed_false'?'事実を確認した内容と、掲載停止の理由を入力してください。':'確認した内容と、ブリーダーに修正してもらう点を入力してください。');if(!note)return;if(action==='confirmed_false'&&!confirm('このブリーダーの公開掲載・新規掲載・再掲載を停止しますか？進行中の連絡は継続できます。'))return;try{await api('/operator/sale-disputes/'+encodeURIComponent(id),'PATCH',{action,note});msg('保存しました。');await load()}catch(e){msg(e.data?.message||e.message)}}
async function resume(id){const note=prompt('掲載停止を解除する理由を入力してください。');if(!note||!confirm('掲載停止を解除しますか？'))return;try{await api('/operator/breeders/'+encodeURIComponent(id)+'/compliance-resume','PATCH',{note});await load()}catch(e){msg(e.data?.message||e.message)}}load();
</script></body></html>
