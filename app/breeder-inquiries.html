<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>問い合わせ管理｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="topbar">🐾 BIG PAW ブリーダー管理</div><header class="site-header"><div class="wrap nav"><a class="logo" href="admin.html"><span class="logo-mark">🐾</span>BIG PAW 管理</a><nav class="navlinks"><a href="admin.html">子犬管理</a><a href="parent-dogs.html">親犬</a><a href="health-records.html">健康情報</a><a href="index.html">公開サイト ↗</a></nav></div></header><div class="hero-mini"><div class="wrap"><h1>見学・問い合わせ管理</h1><p>購入希望者から届いた内容を確認できます。</p></div></div><main class="wrap"><section class="section"><div class="grid three"><div class="card pad"><span class="muted">未返信</span><div class="price" id="unread">0件</div></div><div class="card pad"><span class="muted">日程希望あり</span><div class="price" id="visits">0件</div></div><div class="card pad"><span class="muted">問い合わせ合計</span><div class="price" id="total">0件</div></div></div><div class="card pad" style="margin-top:18px"><div style="display:flex;justify-content:space-between;align-items:center"><h2>問い合わせ一覧</h2><button class="btn btn-sub" onclick="render()">更新</button></div><div class="tablelike" id="inquiryList"></div></div></section></main><script src="assets/app.js"></script><script src="assets/api.js"></script><script src="assets/bridge.js"></script><script>
async function render(){try{const q=await BigPawBridge.inquiries();unread.textContent=q.filter(x=>x.status==='未返信').length+'件';visits.textContent=q.filter(x=>x.preferred_date||x.preferredDate||x.date1||x.status==='見学調整中'||x.status==='見学確定').length+'件';total.textContent=q.length+'件';inquiryList.innerHTML=q.length?q.map(x=>{const puppy=x.puppy_name||x.puppyName||'子犬',date=x.preferred_date||x.preferredDate||x.date1||'',msg=x.message||'メッセージなし';return `<div class="table-row"><div><span class="status">${BigPaw.esc(x.status)}</span></div><div><b>${BigPaw.esc(puppy)}</b>｜${BigPaw.esc(x.name||'購入希望者')}さん<br><span class="muted">${date?'希望日 '+BigPaw.esc(date):'希望日未指定'}</span><br>${BigPaw.esc(msg)}<div style="margin-top:9px"><button class="btn btn-sub" onclick='mark(${JSON.stringify(x.id)},"返信済み")'>返信済みにする</button> <a class="btn btn-main" href="messages.html?inquiry=${encodeURIComponent(x.id)}">メッセージ</a> <a class="btn btn-sub" href="visit-confirm.html?inquiry=${encodeURIComponent(x.id)}">見学日程</a> <a class="btn btn-sub" href="online-visit.html?inquiry=${encodeURIComponent(x.id)}">オンライン見学</a> <a class="btn btn-sub" href="breeder-deal-report.html?inquiry=${encodeURIComponent(x.id)}">成約申請</a></div></div></div>`}).join(''):`<div class="empty"><div class="big">💬</div><h2>まだ問い合わせはありません</h2></div>`}catch(e){if(e.status===401||e.status===403){inquiryList.innerHTML='<div class="empty"><h2>ブリーダーログインが必要です</h2><p class="muted">ブリーダーアカウントでログインしてください。</p><a class="btn btn-main" href="login.html">ログイン</a></div>'}else inquiryList.innerHTML='<div class="empty">読み込めませんでした。</div>'}}
async function mark(id,s){try{await BigPawBridge.updateInquiry(id,{status:s});render()}catch(e){alert('更新できませんでした')}}render();
</script><script src="/auth-return-fix.js"></script><style id="bigpaw-role-theme">body{background:#fff7fb!important}body.bigpaw-breeder-theme{background:#f3f8ff!important}body.bigpaw-operator-theme{background:#fffbea!important}</style><script>(function(){var p=location.pathname;if(p.indexOf('/operator-')>=0)document.body.classList.add('bigpaw-operator-theme');else if(p.indexOf('/breeder-')>=0||p.endsWith('/admin.html'))document.body.classList.add('bigpaw-breeder-theme');})();</script></body></html>
