<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>運営問い合わせ管理｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"><style>.admin-grid{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.sidebar{background:linear-gradient(180deg,#6d5572,#5b4b62);color:#fff;padding:22px}.sidebar a{display:block;padding:10px 12px;border-radius:10px;margin:4px 0}.main{padding:28px}.ticket{padding:18px 0;border-bottom:1px solid #f0dbe5}.ticket p{white-space:pre-wrap}@media(max-width:800px){.admin-grid{grid-template-columns:1fr}.sidebar{display:none}.main{padding:14px}}</style></head><body><div class="admin-grid"><aside class="sidebar"><div class="logo"><span class="logo-mark">🐾</span>BIG PAW</div><p style="opacity:.7">運営管理</p><a href="operator-admin.html">ダッシュボード</a><a href="operator-support.html">お問い合わせ</a><a href="operator-deal-reports.html">成約申請</a><a href="operator-invoices.html">請求管理</a><a href="operator-automations.html">自動処理</a><a href="index.html">公開サイト ↗</a></aside><main class="main"><h1>運営お問い合わせ</h1><p class="muted">利用者・ブリーダーから届いた問い合わせを管理します。</p><div class="card pad"><div id="rows">読み込み中…</div></div></main></div><script src="assets/api.js"></script><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dt=t=>new Date(t*1000).toLocaleString('ja-JP');
async function setStatus(id,status){let note='';if(status==='resolved')note=prompt('対応メモ（任意）')||'';await BigPawAPI.updateOperatorSupport(id,{status,operatorNote:note});load()}
async function load(){try{const a=await BigPawAPI.operatorSupport();rows.innerHTML=a.length?a.map(x=>`<div class="ticket"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><b>${esc(x.subject)}</b> <span class="chip">${esc(x.status)}</span><br><span class="muted">${esc(x.category)}｜${esc(x.name)} &lt;${esc(x.email)}&gt;｜${dt(x.created_at)}</span></div></div><p>${esc(x.message)}</p>${x.operator_note?`<div class="notice">対応メモ：${esc(x.operator_note)}</div>`:''}<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="btn btn-sub" onclick="setStatus('${x.id}','reviewing')">対応中</button><button class="btn btn-main" onclick="setStatus('${x.id}','resolved')">対応完了</button><button class="btn btn-sub" onclick="setStatus('${x.id}','closed')">クローズ</button></div></div>`).join(''):'お問い合わせはありません。'}catch(e){rows.innerHTML='運営アカウントでログインしてください。'}}load();
</script><script src="/auth-return-fix.js"></script><style id="bigpaw-role-theme">body{background:#fff7fb!important}body.bigpaw-breeder-theme{background:#f3f8ff!important}body.bigpaw-operator-theme{background:#fffbea!important}</style><script>(function(){var p=location.pathname;if(p.indexOf("/operator-")>=0)document.body.classList.add("bigpaw-operator-theme");else if(p.indexOf("/breeder-")>=0||p.endsWith("/admin.html"))document.body.classList.add("bigpaw-breeder-theme");})();</script></body></html>
