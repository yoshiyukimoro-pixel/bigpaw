<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>運営問い合わせ管理｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"><style>.admin-grid{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.sidebar{background:linear-gradient(180deg,#6d5572,#5b4b62);color:#fff;padding:22px}.sidebar a{display:block;padding:10px 12px;border-radius:10px;margin:4px 0}.main{padding:28px}.ticket{padding:18px 0;border-bottom:1px solid #f0dbe5}.ticket p{white-space:pre-wrap}.reply-box{margin-top:14px;padding:14px;border:1px solid #ead8df;border-radius:14px;background:#fffdfd}.reply-box textarea{width:100%;min-height:150px;resize:vertical;box-sizing:border-box;padding:12px;border:1px solid #d9c8cf;border-radius:10px;font:inherit}.reply-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.reply-history{margin-top:14px}.reply-item{padding:10px 12px;border-radius:10px;background:#fff7fb;margin-top:8px}.reply-item p{margin:6px 0 0}.reply-meta{font-size:12px;color:#857580}@media(max-width:800px){.admin-grid{grid-template-columns:1fr}.sidebar{display:none}.main{padding:14px}.ticket .btn{min-height:48px}}</style></head><body><div class="admin-grid"><aside class="sidebar"><div class="logo"><span class="logo-mark">🐾</span>BIG PAW</div><p style="opacity:.7">運営管理</p><a href="operator-admin.html">ダッシュボード</a><a href="operator-support.html">お問い合わせ</a><a href="operator-deal-reports.html">成約申請</a><a href="operator-invoices.html">請求管理</a><a href="operator-automations.html">自動処理</a><a href="index.html">公開サイト ↗</a></aside><main class="main"><h1>運営お問い合わせ</h1><p class="muted">利用者・ブリーダーから届いた問い合わせを管理します。</p><div class="card pad"><div id="rows">読み込み中…</div></div></main></div><script src="assets/api.js"></script><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dt=t=>new Date(t*1000).toLocaleString('ja-JP');
async function setStatus(id,status){let note='';if(status==='resolved')note=prompt('対応メモ（任意）')||'';await BigPawAPI.updateOperatorSupport(id,{status,operatorNote:note});load()}
async function openReply(id){const box=document.getElementById('reply-'+id);if(!box)return;const isOpen=box.style.display!=='none';if(isOpen){box.style.display='none';return}box.style.display='block';const history=document.getElementById('history-'+id);history.innerHTML='返信履歴を読み込み中…';try{const list=await BigPawAPI.request('/operator/support/'+encodeURIComponent(id)+'/replies');history.innerHTML=list.length?'<b>返信履歴</b>'+list.map(r=>`<div class="reply-item"><div class="reply-meta">${esc(r.operator_name||'BIG PAW運営')}｜${dt(r.created_at)}</div><p>${esc(r.body)}</p></div>`).join(''):'<span class="muted">まだ返信履歴はありません。</span>'}catch(e){history.innerHTML='<span class="muted">返信履歴を読み込めませんでした。</span>'}}
async function sendReply(id){const ta=document.getElementById('replytext-'+id);const btn=document.getElementById('sendreply-'+id);const body=(ta?.value||'').trim();if(!body){alert('返信内容を入力してください。');return}if(!confirm('この内容で返信メールを送信しますか？'))return;btn.disabled=true;btn.textContent='送信中…';try{await BigPawAPI.request('/operator/support/'+encodeURIComponent(id)+'/reply',{method:'POST',body:{body}});alert('返信メールを送信しました。');load()}catch(e){alert(e.message||'返信メールを送信できませんでした。');btn.disabled=false;btn.textContent='送信する'}}
async function load(){try{const a=await BigPawAPI.operatorSupport();rows.innerHTML=a.length?a.map(x=>`<div class="ticket"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><b>${esc(x.subject)}</b> <span class="chip">${esc(x.status)}</span><br><span class="muted">${esc(x.category)}｜${esc(x.name)} &lt;${esc(x.email)}&gt;｜${dt(x.created_at)}</span></div></div><p>${esc(x.message)}</p>${x.operator_note?`<div class="notice">対応メモ：${esc(x.operator_note)}</div>`:''}<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="btn btn-main" type="button" onclick="openReply('${x.id}')">返信する</button><button class="btn btn-sub" type="button" onclick="setStatus('${x.id}','reviewing')">対応中</button><button class="btn btn-main" type="button" onclick="setStatus('${x.id}','resolved')">対応完了</button><button class="btn btn-sub" type="button" onclick="setStatus('${x.id}','closed')">クローズ</button></div><div class="reply-box" id="reply-${x.id}" style="display:none"><div><b>${esc(x.name)}さんへ返信</b><br><span class="muted">送信先：${esc(x.email)}</span></div><textarea id="replytext-${x.id}" placeholder="返信内容を入力してください"></textarea><div class="reply-actions"><button class="btn btn-main" id="sendreply-${x.id}" type="button" onclick="sendReply('${x.id}')">送信する</button><button class="btn btn-sub" type="button" onclick="openReply('${x.id}')">閉じる</button></div><div class="reply-history" id="history-${x.id}"></div></div></div>`).join(''):'お問い合わせはありません。'}catch(e){rows.innerHTML='運営アカウントでログインしてください。'}}load();
</script><script src="/auth-return-fix.js"></script><style id="bigpaw-role-theme">body{background:#fff7fb!important}body.bigpaw-breeder-theme{background:#f3f8ff!important}body.bigpaw-operator-theme{background:#fffbea!important}</style><script>(function(){var p=location.pathname;if(p.indexOf("/operator-")>=0)document.body.classList.add("bigpaw-operator-theme");else if(p.indexOf("/breeder-")>=0||p.endsWith("/admin.html"))document.body.classList.add("bigpaw-breeder-theme");})();</script></body></html>
