<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>お迎え準備｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="topbar">🐾 BIG PAW｜お迎え準備</div><header class="site-header"><div class="wrap nav"><a class="logo" href="index.html"><span class="logo-mark">🐾</span>BIG PAW</a><nav class="navlinks"><a href="deal.html">商談管理</a><a href="messages.html">メッセージ</a></nav></div></header><div class="hero-mini"><div class="wrap"><h1>お迎え準備</h1><p>日時・残金・持ち物・引渡状況をひとつの画面で確認。</p></div></div><main class="wrap"><section class="section"><div class="grid two"><div class="card pad"><div class="stepbar"><div class="step">1. 見学</div><div class="step">2. 予約金</div><div class="step">3. 契約</div><div class="step active">4. お迎え</div></div><div class="form-grid"><div class="field"><label>お迎え日</label><input id="date" type="date"></div><div class="field"><label>時間</label><select id="time"><option>10:00</option><option>11:00</option><option>13:00</option><option selected>14:00</option><option>15:00</option></select></div></div><h2>当日の確認</h2><div class="list"><label class="list-item"><input type="checkbox"> 残金の確認</label><label class="list-item"><input type="checkbox"> キャリー・ケージ等</label><label class="list-item"><input type="checkbox"> 契約書・ワクチン証明書の受領</label><label class="list-item"><input type="checkbox"> フード・給餌量の説明</label></div><button class="btn btn-main btn-wide" style="margin-top:18px" onclick="savePickup(false)">お迎え予定を保存</button></div><aside><div class="card pad sticky"><h2>お支払い</h2><div class="fact"><span>生体価格</span><b id="total">-</b></div><div class="fact" style="margin-top:8px"><span>予約金</span><b id="reserve">-</b></div><div class="fact" style="margin-top:8px"><span>お迎え時残金</span><b id="balance">-</b></div><div id="pickupStatus" class="notice" style="margin-top:14px">未登録</div><button id="completeBtn" class="btn btn-main btn-wide" style="margin-top:10px" onclick="savePickup(true)">お迎え完了として記録</button><div id="completionNote" class="muted" style="margin-top:8px"></div></div></aside></div></section></main><script src="assets/app.js"></script><script src="assets/api.js"></script><script src="assets/bridge.js"></script><script src="assets/workflow.js"></script><script>
function localISODate(d=new Date()){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
let ctx=null,sum=null,me=null;async function init(){const today=localISODate();date.min=today;if(!date.value)date.value=today;try{ctx=await BigPawWorkflow.context();sum=await BigPawBridge.dealSummary(ctx.deal.id);try{me=await BigPawAPI.me()}catch(e){}total.textContent=BigPawWorkflow.yen(sum.deal.total_price);reserve.textContent=BigPawWorkflow.yen(sum.deal.reservation_amount);balance.textContent=BigPawWorkflow.yen(sum.deal.total_price-sum.deal.reservation_amount);if(sum.pickup){const saved=sum.pickup.pickup_date||'';date.value=saved&&saved>=today?saved:today;time.value=sum.pickup.pickup_time||time.value;pickupStatus.textContent=sum.pickup.status==='completed'?'お迎え完了済み':'お迎え予定：'+(sum.pickup.pickup_date||'')+' '+(sum.pickup.pickup_time||'')}if(me?.role==='breeder'){completeBtn.textContent='成約・お迎え完了を申請';completeBtn.onclick=()=>location.href='breeder-deal-report.html?inquiry='+encodeURIComponent(ctx.inquiry.id);completionNote.textContent='運営確認後に成約確定し、5%請求書が自動発行されます。'}else if(me?.role!=='operator'){completeBtn.style.display='none';completionNote.textContent='お迎え完了はブリーダーからの成約申請後、BIG PAW運営が確認して確定します。'}}catch(e){pickupStatus.textContent='ログインして商談から開いてください。'}}async function savePickup(complete){try{await BigPawBridge.savePickup(ctx.deal.id,{date:date.value,time:time.value,complete});alert(complete?'お迎え完了として保存しました':'お迎え予定を保存しました');if(complete)location.href='review.html?inquiry='+encodeURIComponent(ctx.inquiry.id);else init()}catch(e){alert(e.data?.message||e.message||'保存できませんでした')}}init();
</script></body></html>
