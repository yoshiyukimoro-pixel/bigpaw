<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>子犬を掲載｜BIG PAW ブリーダー管理</title><link rel="stylesheet" href="assets/style.css"><style>.wizard{max-width:900px;margin:auto}.photo-box{border:2px dashed #efbfd1;border-radius:18px;padding:32px;text-align:center;background:#fffafd}.photo-box b{display:block;font-size:18px}</style></head><body><div class="topbar">🐾 BIG PAW ブリーダー管理</div><header class="site-header"><div class="wrap nav"><a class="logo" href="admin.html"><span class="logo-mark">🐾</span>BIG PAW 管理</a><nav class="navlinks"><a href="admin.html">子犬管理</a><a href="breeder-inquiries.html">問い合わせ</a><a href="index.html">公開サイト ↗</a></nav></div></header><main class="wrap"><div class="breadcrumb"><a href="admin.html">管理画面</a> ＞ 子犬を新規掲載</div><section class="section wizard"><form class="card pad" onsubmit="savePuppy(event)"><div class="stepbar"><div class="step active">1. 基本情報</div><div class="step active">2. 親犬・健康</div><div class="step active">3. 写真・紹介</div><div class="step">4. 公開</div></div><h1>子犬を掲載</h1><div class="form-grid"><div class="field"><label>犬種</label><select id="breed"><option>スタンダードプードル</option><option>ゴールデンレトリバー</option><option>ラブラドールレトリバー</option><option>バーニーズ・マウンテン・ドッグ</option><option>シベリアンハスキー</option><option>サモエド</option><option>グレートピレニーズ</option><option>ボルゾイ</option><option>その他大型犬</option></select></div><div class="field"><label>性別</label><select id="gender"><option>男の子</option><option>女の子</option></select></div><div class="field"><label>毛色</label><input id="color" value="ブラック"></div><div class="field"><label>生年月日</label><input id="birth" type="date" value="2026-07-01"></div><div class="field"><label>価格（税込）</label><input id="price" type="number" value="258000"></div><div class="field"><label>現在体重 kg</label><input id="weight" type="number" step="0.1" value="10.5"></div><div class="field"><label>成犬時予想 最小 kg</label><input id="adultMin" type="number" value="28"></div><div class="field"><label>成犬時予想 最大 kg</label><input id="adultMax" type="number" value="32"></div><div class="field"><label>父犬</label><select id="father"><option>クラージュ</option><option>未登録</option></select></div><div class="field"><label>母犬</label><select id="mother"><option>ミルク</option><option>アメリー</option><option>シャルム</option><option>未登録</option></select></div></div><h2>健康情報</h2><div class="form-grid"><label class="fact"><input id="health" type="checkbox" checked> 健康診断済み</label><label class="fact"><input type="checkbox" checked> マイクロチップ</label><label class="fact"><input type="checkbox" checked> 混合ワクチン</label><label class="fact"><input type="checkbox" checked> 遺伝子検査情報</label><label class="fact"><input type="checkbox"> 股関節情報</label><label class="fact"><input type="checkbox"> 肘関節情報</label></div><div id="editOnly" style="display:none"><h2 style="margin-top:22px">販売設定</h2><div class="field"><label>販売状況</label><select id="status"><option>募集中</option><option>商談中</option><option>成約済み</option><option>非公開</option></select></div></div><h2 style="margin-top:22px">写真</h2><div class="photo-box"><div style="font-size:50px">📷</div><b>写真を編集（最大10枚）</b><span class="muted">1枚目がメイン写真です。写真を選び直すとメイン写真から順に差し替えます。JPG / PNG / WebP・各8MBまで</span><input id="photo" type="file" accept="image/jpeg,image/png,image/webp" multiple style="display:block;margin:14px auto 0;max-width:100%"><div id="photoPreview" style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px"></div></div><div class="field" style="margin-top:18px"><label>紹介文</label><textarea id="desc">人が大好きで穏やかな子です。親犬情報・健康情報も公開しています。</textarea></div><button class="btn btn-main btn-wide">この内容で掲載する</button><button id="deletePuppyBtn" type="button" class="btn btn-sub btn-wide" style="display:none;margin-top:10px" onclick="deleteCurrentPuppy()">この子犬の掲載を削除</button><div class="notice" style="margin-top:14px">保存後はBIG PAW運営の掲載審査へ進み、承認後に検索・詳細ページへ公開されます。</div></form></section></main><script src="assets/app.js"></script><script src="assets/api.js"></script><script src="assets/bridge.js"></script><script src="assets/breed-data.js"></script><script>
let editId=new URLSearchParams(location.search).get('id')||sessionStorage.getItem('bigpawEditPuppyId');
let selectedPhotos=[];
function syncPhotoInput(){const dt=new DataTransfer();selectedPhotos.forEach(f=>dt.items.add(f));photo.files=dt.files}
function renderSelectedPhotos(){photoPreview.innerHTML=selectedPhotos.map((f,i)=>'<div style="border:1px solid #eee;border-radius:14px;padding:8px"><img src="'+URL.createObjectURL(f)+'" style="width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px"><small style="display:block">'+(i===0?'メイン写真':'写真 '+(i+1))+'</small><div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:6px"><button type="button" class="btn btn-sub" onclick="makeMain('+i+')">メインにする</button><button type="button" class="btn btn-sub" onclick="movePhoto('+i+',-1)">←</button><button type="button" class="btn btn-sub" onclick="movePhoto('+i+',1)">→</button><button type="button" class="btn btn-sub" onclick="removePhoto('+i+')">削除</button></div></div>').join('')}
let adjustTarget=null,adjustScale=1,adjustX=0,adjustY=0,adjustStart=null;
function ensureAdjustModal(){let prior=document.getElementById('photoAdjustModal');if(prior)prior.remove();document.body.insertAdjacentHTML('beforeend','<div id="photoAdjustModal" style="display:none;position:fixed;inset:0;background:#111;z-index:9999;overflow:auto"><div style="max-width:560px;margin:0 auto;min-height:100%;background:#111;color:white"><div style="height:64px;background:white;color:#4d4053;display:flex;align-items:center;justify-content:space-between;padding:0 16px"><button type="button" onclick="closePhotoAdjust()" style="border:0;background:transparent;font-size:18px">‹ 戻る</button><b>画像の編集</b><button type="button" onclick="applyPhotoAdjust()" style="border:0;border-radius:24px;background:#ef7da7;color:white;font-weight:700;padding:11px 20px">適用</button></div><div style="padding:20px 18px 8px"><div id="adjustFrame" style="width:100%;aspect-ratio:1/1;overflow:hidden;background:#222;touch-action:none;position:relative;border:2px solid white"><img id="adjustImg" style="width:100%;height:100%;object-fit:cover;transform-origin:center;user-select:none;-webkit-user-drag:none"></div><div style="margin-top:22px;font-size:14px;color:#ddd">掲載枠は正方形です。写真を移動・拡大して表示位置を調整してください。</div><div style="margin-top:14px;border:1px solid #777;border-radius:14px;padding:14px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px"><span>初期値</span><span>最大</span></div><input id="adjustZoom" type="range" min="1" max="4" step="0.01" value="1" style="width:100%;accent-color:#ef7da7"></div></div></div></div>');const fr=document.getElementById('adjustFrame'),zr=document.getElementById('adjustZoom');if(zr)zr.addEventListener('input',e=>{adjustScale=Math.max(1,Math.min(4,Number(e.target.value)||1));clampAdjust();drawAdjust()});fr.addEventListener('pointerdown',adjustDown);fr.addEventListener('pointermove',adjustMove);fr.addEventListener('pointerup',adjustUp);fr.addEventListener('pointercancel',adjustUp);let ts=null;fr.addEventListener('touchstart',e=>{e.preventDefault();if(e.touches.length===2){const a=e.touches[0],b=e.touches[1];ts={kind:'pinch',dist:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),scale:adjustScale,x:adjustX,y:adjustY,cx:(a.clientX+b.clientX)/2,cy:(a.clientY+b.clientY)/2}}else if(e.touches.length===1){const a=e.touches[0];ts={kind:'pan',sx:a.clientX,sy:a.clientY,x:adjustX,y:adjustY}}},{passive:false});fr.addEventListener('touchmove',e=>{e.preventDefault();if(!ts)return;if(e.touches.length===2&&ts.kind==='pinch'){const a=e.touches[0],b=e.touches[1],dist=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);adjustScale=Math.max(1,Math.min(4,ts.scale*dist/Math.max(1,ts.dist)));adjustX=ts.x+((a.clientX+b.clientX)/2-ts.cx);adjustY=ts.y+((a.clientY+b.clientY)/2-ts.cy);drawAdjust()}else if(e.touches.length===1&&ts.kind==='pan'){const a=e.touches[0];adjustX=ts.x+a.clientX-ts.sx;adjustY=ts.y+a.clientY-ts.sy;drawAdjust()}},{passive:false});fr.addEventListener('touchend',e=>{if(e.touches.length===0)ts=null},{passive:false});fr.addEventListener('wheel',e=>{e.preventDefault();adjustScale=Math.max(1,Math.min(4,adjustScale+(e.deltaY<0?.1:-.1)));drawAdjust()},{passive:false});}
function clampAdjust(){const fr=document.getElementById('adjustFrame'),im=document.getElementById('adjustImg');if(!fr||!im)return;const fw=fr.clientWidth,fh=fr.clientHeight;if(!fw||!fh)return;const iw=im.naturalWidth||fw,ih=im.naturalHeight||fh,cover=Math.max(fw/iw,fh/ih),rw=iw*cover*adjustScale,rh=ih*cover*adjustScale,maxX=Math.max(0,(rw-fw)/2),maxY=Math.max(0,(rh-fh)/2);adjustX=Math.max(-maxX,Math.min(maxX,adjustX));adjustY=Math.max(-maxY,Math.min(maxY,adjustY))}
function drawAdjust(){clampAdjust();const im=document.getElementById('adjustImg'),zr=document.getElementById('adjustZoom');if(im)im.style.transform='translate('+adjustX+'px,'+adjustY+'px) scale('+adjustScale+')';if(zr&&document.activeElement!==zr)zr.value=adjustScale}
function openPhotoAdjust(i){const f=selectedPhotos[i];if(!f)return;ensureAdjustModal();adjustTarget={kind:'new',i:i};adjustScale=1;adjustX=0;adjustY=0;const ai=document.getElementById('adjustImg');ai.onload=()=>{clampAdjust();drawAdjust()};ai.src=URL.createObjectURL(f);document.getElementById('photoAdjustModal').style.display='block';drawAdjust()}
function openPersistedAdjust(i){const p=window.persistedPhotos&&window.persistedPhotos[i];if(!p)return;ensureAdjustModal();adjustTarget={kind:'saved',i:i};adjustScale=1;adjustX=0;adjustY=0;const ai=document.getElementById('adjustImg');ai.onload=()=>{clampAdjust();drawAdjust()};ai.src=p.url;document.getElementById('photoAdjustModal').style.display='block';drawAdjust()}
function closePhotoAdjust(){const m=document.getElementById('photoAdjustModal');if(m)m.style.display='none';adjustTarget=null}
function adjustDown(e){e.currentTarget.setPointerCapture(e.pointerId);adjustStart={x:e.clientX,y:e.clientY,ox:adjustX,oy:adjustY}}
function adjustMove(e){if(!adjustStart)return;adjustX=adjustStart.ox+e.clientX-adjustStart.x;adjustY=adjustStart.oy+e.clientY-adjustStart.y;drawAdjust()}
function adjustUp(){adjustStart=null}
async function applyPhotoAdjust(){const im=document.getElementById('adjustImg'),fr=document.getElementById('adjustFrame');if(!adjustTarget||!im.complete)return;const size=1000,c=document.createElement('canvas');c.width=c.height=size;const ctx=c.getContext('2d');ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#ffffff';ctx.fillRect(0,0,c.width,c.height);ctx.restore();const iw=im.naturalWidth,ih=im.naturalHeight,base=Math.max(size/iw,size/ih),sc=base*adjustScale,w=iw*sc,h=ih*sc;ctx.drawImage(im,(size-w)/2+adjustX*(size/fr.clientWidth),(size-h)/2+adjustY*(size/fr.clientWidth),w,h);const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.92));const file=new File([blob],'adjusted-'+Date.now()+'.jpg',{type:'image/jpeg'});if(adjustTarget.kind==='new'){const prev=selectedPhotos[adjustTarget.i];try{Object.defineProperty(file,'_bigpawOriginal',{value:(prev&&prev._bigpawOriginal)||prev,writable:true})}catch(e){}selectedPhotos[adjustTarget.i]=file;syncPhotoInput();renderSelectedPhotos();closePhotoAdjust();return}try{const old=window.persistedPhotos[adjustTarget.i];const up=await BigPawBridge.upload(file,editId);if(old.isMain&&up.url)await BigPawBridge.updatePuppy(editId,{imageUrl:up.url});await BigPawAPI.request('/puppies/'+encodeURIComponent(editId)+'/photos/'+encodeURIComponent(old.id),{method:'DELETE'});window.persistedPhotos[adjustTarget.i]={id:up.id,url:up.url,isMain:old.isMain,originalUrl:old.originalUrl||originalPhotoSources.get(old.id)||old.url};originalPhotoSources.set(up.id,window.persistedPhotos[adjustTarget.i].originalUrl);renderPersistedPhotos();closePhotoAdjust()}catch(e){alert('写真の調整を保存できませんでした')}}
function makeMain(i){const f=selectedPhotos.splice(i,1)[0];selectedPhotos.unshift(f);syncPhotoInput();renderSelectedPhotos()}
function movePhoto(i,n){const j=i+n;if(j<0||j>=selectedPhotos.length)return;[selectedPhotos[i],selectedPhotos[j]]=[selectedPhotos[j],selectedPhotos[i]];syncPhotoInput();renderSelectedPhotos()}
function removePhoto(i){selectedPhotos.splice(i,1);syncPhotoInput();renderSelectedPhotos()}
photo.addEventListener('change',()=>{selectedPhotos=[...photo.files].slice(0,10);syncPhotoInput();renderSelectedPhotos()});
function renderPersistedPhotos(){if(!window.persistedPhotos)return;photoPreview.innerHTML=window.persistedPhotos.map((p,i)=>'<div style="border:1px solid #eee;border-radius:14px;padding:8px"><img src="'+p.url+'" style="width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px"><small style="display:block">'+(p.isMain?'メイン写真':'登録済み写真')+'</small><div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:6px">'+(!p.isMain?'<button type="button" onclick="setPersistedMain('+i+')">メインにする</button>':'')+'<button type="button" onclick="deletePersistedPhoto('+i+')">削除</button></div></div>').join('')}
async function setPersistedMain(i){const p=window.persistedPhotos&&window.persistedPhotos[i];if(!p)return;await BigPawBridge.updatePuppy(editId,{imageUrl:p.url});window.persistedPhotos.forEach(q=>q.isMain=false);p.isMain=true;renderPersistedPhotos()}
async function deletePersistedPhoto(i){const p=window.persistedPhotos&&window.persistedPhotos[i];if(!p||!confirm('この写真を削除しますか？'))return;try{await BigPawAPI.request('/puppies/'+encodeURIComponent(editId)+'/photos/'+encodeURIComponent(p.id),{method:'DELETE'});window.persistedPhotos.splice(i,1);if(p.isMain&&window.persistedPhotos.length)window.persistedPhotos[0].isMain=true;renderPersistedPhotos()}catch(e){alert('写真を削除できませんでした')}}
function removeExistingMain(){if(!confirm('現在のメイン写真を削除しますか？'))return;window.existingMainImage='';const e=document.getElementById('existingMainPhoto');if(e)e.remove();window.removeExistingMainRequested=true;}
// Allow zooming out below cover-size so the original full image can be restored.
const _drawAdjustCover=drawAdjust;
drawAdjust=function(){const im=document.getElementById('adjustImg');if(im)im.style.transform='translate('+adjustX+'px,'+adjustY+'px) scale('+adjustScale+')'};
// Reversible photo adjustment: always edit from the original source.
const originalPhotoSources=new Map();
const _openPersistedAdjust=openPersistedAdjust;
openPersistedAdjust=function(i){const p=window.persistedPhotos&&window.persistedPhotos[i];if(!p)return;ensureAdjustModal();adjustTarget={kind:'saved',i:i};adjustScale=1;adjustX=0;adjustY=0;const src=p.originalUrl||originalPhotoSources.get(p.id)||p.url;originalPhotoSources.set(p.id,src);p.originalUrl=src;document.getElementById('adjustImg').src=src;document.getElementById('photoAdjustModal').style.display='block';drawAdjust()};
const _openPhotoAdjust=openPhotoAdjust;
openPhotoAdjust=function(i){const f=selectedPhotos[i];if(!f)return;ensureAdjustModal();if(!f._bigpawOriginal)try{Object.defineProperty(f,'_bigpawOriginal',{value:f,writable:true})}catch(e){}adjustTarget={kind:'new',i:i};adjustScale=1;adjustX=0;adjustY=0;const src=f._bigpawOriginal||f;document.getElementById('adjustImg').src=URL.createObjectURL(src);document.getElementById('photoAdjustModal').style.display='block';drawAdjust()};
// Final photo UI overrides.
renderSelectedPhotos=function(){photoPreview.innerHTML=selectedPhotos.map((f,i)=>'<div style="border:1px solid #eee;border-radius:14px;padding:8px"><img src="'+URL.createObjectURL(f)+'" style="width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px"><small style="display:block">'+(i===0?'メイン写真':'写真 '+(i+1))+'</small><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px"><button type="button" onclick="makeMain('+i+')">メインにする</button><button type="button" onclick="openPhotoAdjust('+i+')">写真を調整</button><button type="button" onclick="removePhoto('+i+')">削除</button></div></div>').join('')};
renderPersistedPhotos=function(){if(!window.persistedPhotos)return;photoPreview.innerHTML=window.persistedPhotos.map((p,i)=>'<div style="border:1px solid #eee;border-radius:14px;padding:8px"><img src="'+p.url+'" style="width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px"><small style="display:block">'+(p.isMain?'メイン写真':'登録済み写真')+'</small><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">'+(!p.isMain?'<button type="button" onclick="setPersistedMain('+i+')">メインにする</button>':'')+'<button type="button" onclick="openPersistedAdjust('+i+')">写真を調整</button><button type="button" onclick="deletePersistedPhoto('+i+')">削除</button></div></div>').join('')};
ensureAdjustModal=function(){if(document.getElementById('photoAdjustModal'))return;document.body.insertAdjacentHTML('beforeend','<div id="photoAdjustModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:9999;padding:12px"><div style="max-width:520px;margin:3vh auto;background:#fff;border-radius:16px;padding:14px"><div style="display:flex;justify-content:space-between;align-items:center;background:white;color:#4d4053;padding:12px"><button type="button" onclick="closePhotoAdjust()">‹ 戻る</button><b>画像の編集</b><button type="button" onclick="applyPhotoAdjust()" style="background:#ef7da7;color:white;border:0;border-radius:22px;padding:10px 18px">適用</button></div><div id="adjustFrame" style="margin-top:12px;width:100%;aspect-ratio:1/1;overflow:hidden;background:#eee;touch-action:none;position:relative"><img id="adjustImg" draggable="false" style="width:100%;height:100%;object-fit:cover;transform-origin:center;user-select:none;-webkit-user-drag:none"></div><div style="margin-top:10px">1本指で移動・2本指で拡大縮小</div></div></div>');const fr=document.getElementById('adjustFrame'),pts=new Map();let base=null;const calc=()=>{const a=[...pts.values()];if(a.length===1){if(!base)base={n:1,x:a[0].x,y:a[0].y,ox:adjustX,oy:adjustY};adjustX=base.ox+a[0].x-base.x;adjustY=base.oy+a[0].y-base.y;drawAdjust()}else if(a.length>=2){const dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),cx=(a[0].x+a[1].x)/2,cy=(a[0].y+a[1].y)/2;if(!base||base.n!==2)base={n:2,dist:dist,scale:adjustScale,cx:cx,cy:cy,ox:adjustX,oy:adjustY};adjustScale=Math.max(1,Math.min(4,base.scale*dist/Math.max(1,base.dist)));adjustX=base.ox+cx-base.cx;adjustY=base.oy+cy-base.cy;drawAdjust()}};fr.onpointerdown=e=>{e.preventDefault();fr.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});base=null;calc()};fr.onpointermove=e=>{if(!pts.has(e.pointerId))return;e.preventDefault();pts.set(e.pointerId,{x:e.clientX,y:e.clientY});calc()};const end=e=>{pts.delete(e.pointerId);base=null};fr.onpointerup=end;fr.onpointercancel=end;};
async function initEdit(){if(!editId)return;document.querySelector('h1').textContent='掲載内容を編集';const bc=document.querySelector('.breadcrumb');if(bc)bc.innerHTML='<a href="admin.html">管理画面</a> ＞ 子犬を編集';editOnly.style.display='block';const ds=await BigPawBridge.breederPuppies();let d=ds.find(x=>String(x.id)===String(editId))||ds.find(x=>String(x.id)===String(sessionStorage.getItem('bigpawEditPuppyId')||''));if(!d&&ds.length===1)d=ds[0];if(!d){alert('子犬情報を読み込めませんでした');location.href='admin.html';return;}const m={breed:d.breed,gender:d.gender,color:d.color,birth:d.birth,price:d.price,weight:d.weight,adultMin:d.adultMin,adultMax:d.adultMax,father:d.father,mother:d.mother,desc:d.desc,status:d.status};Object.entries(m).forEach(([k,v])=>{const e=document.getElementById(k);if(e&&v!=null)e.value=v});health.checked=!!d.health;
try{const ps=await BigPawAPI.request('/puppies/'+encodeURIComponent(editId)+'/photos');if(ps&&ps.length){window.persistedPhotos=ps;renderPersistedPhotos();}}catch(e){}if(d.imageUrl&&!(window.persistedPhotos&&window.persistedPhotos.length))photoPreview.innerHTML='<div><img src=\"'+d.imageUrl+'\" style=\"width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:14px\"><small>現在のメイン写真</small></div>';if(window.persistedPhotos&&window.persistedPhotos.length)renderPersistedPhotos();document.querySelector('.btn-wide').textContent='変更内容を保存する';const notes=[...document.querySelectorAll('p,.muted,.notice')];notes.forEach(n=>{if((n.textContent||'').includes('保存後はBIG PAW運営の掲載審査へ進み'))n.textContent='変更内容を保存します。公開状態は現在の掲載設定を引き継ぎます。'});const db=document.getElementById('deletePuppyBtn');if(db)db.style.display='block';}
async function deleteCurrentPuppy(){if(!editId||!confirm('この子犬の掲載を削除しますか？'))return;try{await BigPawAPI.request('/puppies/'+encodeURIComponent(editId),{method:'DELETE'});location.href='admin.html'}catch(e){alert('削除できませんでした')}}
initEdit();
function bigpawBreedKey(name){const a=Array.isArray(window.BIGPAW_BREEDS)?window.BIGPAW_BREEDS:[];const b=a.find(v=>v.ja===name);return b?b.key:({'スタンダードプードル':'standard-poodle','ゴールデンレトリバー':'golden-retriever','ラブラドールレトリバー':'labrador-retriever'}[name]||name)}
async function savePuppy(e){e.preventDefault();const btn=e.submitter;btn.disabled=true;btn.textContent='保存中…';try{if(editId&&window.removeExistingMainRequested&&photo.files.length===0)await BigPawBridge.updatePuppy(editId,{imageUrl:''});

<script id="bigpaw-final-photo-editor">
