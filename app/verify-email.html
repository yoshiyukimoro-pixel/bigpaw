<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>メール確認｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="topbar">🐾 BIG PAW</div><header class="site-header"><div class="wrap nav"><a class="logo" href="index.html"><span class="logo-mark">🐾</span>BIG PAW</a><nav class="navlinks"><a href="account.html">アカウント</a></nav></div></header><main class="wrap"><section class="section" style="max-width:640px;margin:auto"><div class="card pad"><h1>メールアドレスの確認</h1><p class="muted">本人確認用のメール認証です。</p><div id="box"></div></div></section></main><script src="assets/api.js"></script><script>async function run(){const token=new URLSearchParams(location.search).get('token');try{if(token){await BigPawAPI.confirmEmailVerification(token);box.innerHTML='<div class="notice">メールアドレスを確認しました。</div><a class="btn btn-main btn-wide" href="mypage.html" style="margin-top:12px">マイページへ</a>';return}const me=await BigPawAPI.me();if(me.emailVerified){box.innerHTML='<div class="notice">すでに確認済みです。</div>';return}const r=await BigPawAPI.requestEmailVerification();let h='<div class="notice"><b>認証メールを送信しました。</b><br>登録したメールアドレスをご確認ください。通常は数分以内に届きます。<br><br><b>5分ほど待っても届かない場合</b>は、迷惑メールフォルダをご確認ください。あわせて <b>noreply@bigpaw.site</b> からのメールを受信できるよう、受信許可設定をご確認ください。</div>';if(r.devToken)h+=`<a class="btn btn-main btn-wide" style="margin-top:12px" href="verify-email.html?token=${encodeURIComponent(r.devToken)}">開発版：メール確認を完了する</a>`;box.innerHTML=h}catch(e){box.innerHTML='<div class="notice">先にログインしてください。</div><a class="btn btn-main btn-wide" href="login.html" style="margin-top:12px">ログイン</a>'}}run();</script><script src="/auth-return-fix.js"></script></body></html>
