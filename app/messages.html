<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>メッセージ｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"><style>.chat{display:grid;gap:12px}.bubble{max-width:78%;padding:12px 14px;border-radius:16px;background:#fff;border:1px solid var(--line)}.mine{margin-left:auto;background:#fff1f7}.bubble-label{font-size:12px;font-weight:800;opacity:.62;margin-bottom:5px}.chatbox{display:flex;gap:8px;margin-top:14px}.chatbox input{flex:1;border:1px solid var(--line);border-radius:13px;padding:12px}.thread{padding:12px;border:1px solid var(--line);border-radius:13px;margin-bottom:8px;cursor:pointer}.thread.active{background:#fff1f7;border-color:#efb2ca}.step-disabled{pointer-events:none;opacity:.45}.role-notice{margin:14px auto 0;max-width:1100px;padding:10px 14px;border-radius:13px;font-weight:800;text-align:center}.buyer-view{background:#fff7fb!important}.buyer-view .role-notice{background:#fff0f6;color:#7b3f5b;border:1px solid #efc4d6}.breeder-view{background:#f3f8ff!important}.breeder-view .role-notice{background:#e9f3ff;color:#315b85;border:1px solid #b9d7f5}.breeder-view .mine{background:#eaf4ff}.breeder-view .thread.active{background:#eaf4ff;border-color:#9fc8ee}</style></head><body>
<div class="topbar" id="messageTopbar">🐾 大型犬専門｜BIG PAW</div><header class="site-header"><div class="wrap nav"><a class="logo" id="messageLogo" href="index.html"><span class="logo-mark">🐾</span><span id="messageLogoText">BIG PAW</span></a><nav class="navlinks"><a id="navPrimary" href="mypage.html">マイページ</a><a id="navSecondary" href="favorites.html">♡ お気に入り</a></nav></div></header><div id="roleNotice" class="role-notice">ログイン状態を確認中…</div>
<main class="wrap"><div class="breadcrumb"><a id="crumbLink" href="mypage.html">マイページ</a> ＞ メッセージ</div><section class="section"><div class="grid two"><div><div class="card pad"><h2>問い合わせ</h2><div id="threads"></div></div><div class="card pad" style="margin-top:14px"><div class="profile"><div class="avatar">🐾</div><div><b id="who">ブリーダー</b><div class="muted" id="about">問い合わせを選択</div></div></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><div class="chat" id="chat"></div><div class="chatbox"><input id="msg" placeholder="メッセージを入力"><button class="btn btn-main" onclick="sendMsg()">送信</button></div></div></div><aside><div class="card pad sticky"><h2>次のステップ</h2><div class="fact"><span>ステータス</span><b id="chatStatus">-</b></div><div id="stepHint" class="notice" style="margin-top:12px">問い合わせを選択すると見学日程へ進めます。</div><a id="visitLink" class="btn btn-main btn-wide step-disabled" style="margin-top:12px" href="#" aria-disabled="true">見学日程を調整</a><a id="dealLink" class="btn btn-sub btn-wide step-disabled" style="margin-top:10px" href="#" aria-disabled="true">商談・お迎え管理</a><a id="onlineVisit" class="btn btn-main btn-wide step-disabled" style="margin-top:10px" href="#" aria-disabled="true">📹 オンライン見学</a></div></aside></div></section></main>
<script src="assets/app.js"></script><script src="assets/api.js"></script><script src="assets/bridge.js"></script><script>
let selected=null,inquiries=[],me=null;
const qName=q=>q.puppyName||q.puppy_name||'子犬'; const qBreeder=q=>q.breeder||q.breeder_name||'ブリーダー';
function applyRoleUI(){const breederMode=me&&((me.role==='breeder')||(me.role==='operator'));document.body.classList.toggle('breeder-view',!!breederMode);document.body.classList.toggle('buyer-view',!breederMode);if(breederMode){messageTopbar.textContent='🐾 BIG PAW ブリーダー管理';messageLogo.href='admin.html';messageLogoText.textContent='BIG PAW 管理';navPrimary.href='breeder-inquiries.html';navPrimary.textContent='見学・問い合わせ';navSecondary.href='admin.html';navSecondary.textContent='ブリーダー管理';crumbLink.href='breeder-inquiries.html';crumbLink.textContent='見学・問い合わせ';roleNotice.textContent=me.role==='operator'?'運営としてメッセージを確認中':'ブリーダーとして返信中';}else{messageTopbar.textContent='🐾 大型犬専門｜BIG PAW';messageLogo.href='index.html';messageLogoText.textContent='BIG PAW';navPrimary.href='mypage.html';navPrimary.textContent='マイページ';navSecondary.href='favorites.html';navSecondary.textContent='♡ お気に入り';crumbLink.href='mypage.html';crumbLink.textContent='マイページ';roleNotice.textContent='購入希望者としてメッセージ中';}}
function setStepActions(enabled,id=''){[visitLink,dealLink,onlineVisit].forEach(a=>{a.classList.toggle('step-disabled',!enabled);a.setAttribute('aria-disabled',enabled?'false':'true')});if(!enabled){visitLink.href=dealLink.href=onlineVisit.href='#';stepHint.style.display='block';return}visitLink.href='visit-confirm.html?inquiry='+encodeURIComponent(id);dealLink.href='deal.html?inquiry='+encodeURIComponent(id);onlineVisit.href='online-visit.html?inquiry='+encodeURIComponent(id);stepHint.style.display='none'}
async function drawThreads(){setStepActions(false);try{me=await BigPawBridge.me().catch(()=>null);if(me)applyRoleUI();inquiries=await BigPawBridge.inquiries()}catch(e){threads.innerHTML='<div class="notice">ログインするとメッセージを利用できます。</div>';return}threads.innerHTML=inquiries.length?inquiries.map(x=>`<div class="thread ${selected===x.id?'active':''}" onclick="openThread('${x.id}')"><b>${BigPaw.esc(qName(x))}</b><div class="muted">${BigPaw.esc(qBreeder(x))}・${BigPaw.esc(x.status)}</div></div>`).join(''):'<div class="notice">まだ問い合わせはありません。子犬詳細の「見学・問い合わせ」から見学申込みを送信してください。</div>';const wanted=new URLSearchParams(location.search).get('inquiry')||'';const target=(wanted&&inquiries.find(x=>String(x.id)===String(wanted)))||inquiries[0]||null;if(target)await openThread(target.id)}
function senderLabel(m,mine){if(mine){if(me?.role==='breeder')return 'あなた（ブリーダー）';if(me?.role==='operator')return 'あなた（運営）';return 'あなた（購入希望者）'}if(m.role==='breeder')return 'ブリーダー';if(m.role==='operator')return '運営';return '購入希望者'}
async function openThread(id){selected=id;const q=inquiries.find(x=>String(x.id)===String(id));if(!q){setStepActions(false);return}who.textContent=qBreeder(q);about.textContent=qName(q);chatStatus.textContent=q.status;setStepActions(true,id);document.querySelectorAll('.thread').forEach((el,i)=>el.classList.toggle('active',String(inquiries[i]?.id)===String(id)));try{const list=await BigPawBridge.messages(id);chat.innerHTML=list.length?list.map(m=>{const mine=!!(m.sender_user_id&&me&&m.sender_user_id===me.id);return `<div class="bubble ${mine?'mine':''}"><div class="bubble-label">${BigPaw.esc(senderLabel(m,mine))}</div>${BigPaw.esc(m.body||'')}</div>`}).join(''):'<div class="muted">まだメッセージはありません。下から送信できます。</div>'}catch(e){chat.innerHTML='<div class="muted">メッセージを読み込めませんでした。</div>'}}
async function sendMsg(){if(!selected||!msg.value.trim())return;const text=msg.value.trim();msg.value='';try{await BigPawBridge.sendMessage(selected,text);await openThread(selected)}catch(e){alert('送信できませんでした：'+(e.message||''))}}
drawThreads();
</script><script src="/auth-return-fix.js"></script><script>
(async()=>{try{const q=new URLSearchParams(location.search).get("inquiry");if(!q)return;const r=await fetch("/api/inquiries/"+encodeURIComponent(q)+"/visit",{credentials:"same-origin"});if(!r.ok)return;const v=await r.json();if(!v||v.transport!=="オンライン見学"||v.status==="confirmed")return;const a=document.getElementById("onlineVisit");if(!a)return;const box=document.createElement("div");box.id="onlineVisitRequestNotice";box.className="notice";box.style.marginTop="12px";box.innerHTML="<strong>📹 オンライン見学の申込みがあります</strong><br>希望日時："+String(v.visit_date||"")+" "+String(v.visit_time||"")+"<br><span style=\"font-size:.92em\">下の『オンライン見学』から確認・確定してください。</span>";a.parentNode.insertBefore(box,a);a.textContent="📹 オンライン見学を確認・確定する"}catch(e){console.error("online visit notice",e)}})();
</script></body></html>
