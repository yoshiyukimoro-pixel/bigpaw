<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>契約内容確認｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"><style>.contract{font-size:14px}.signbox{border:2px dashed #e8bfd0;border-radius:16px;padding:24px;text-align:center;background:#fffafd}</style></head><body><div class="topbar">🐾 BIG PAW｜契約署名記録</div><header class="site-header"><div class="wrap nav"><a class="logo" href="index.html"><span class="logo-mark">🐾</span>BIG PAW</a><nav class="navlinks"><a href="deal.html">商談管理</a><a href="mypage.html">マイページ</a></nav></div></header><div class="hero-mini"><div class="wrap"><h1>契約内容の確認</h1><p>個体情報・価格・健康情報・引渡条件を確認して署名します。</p></div></div><main class="wrap"><section class="section" style="max-width:900px;margin:auto"><div class="card pad contract"><div class="stepbar"><div class="step">1. 見学</div><div class="step">2. 予約金</div><div class="step active">3. 契約</div><div class="step">4. お迎え</div></div><h2>生体売買契約書（ドラフト）</h2><div class="tablelike"><div class="table-row"><div>犬種</div><div id="breed">-</div></div><div class="table-row"><div>性別・毛色</div><div id="sexcolor">-</div></div><div class="table-row"><div>生年月日</div><div id="birth">-</div></div><div class="table-row"><div>生体価格</div><div id="price">-</div></div><div class="table-row"><div>予約金</div><div id="reservation">-</div></div><div class="table-row"><div>残金</div><div id="balance">-</div></div></div><h3>説明・確認事項</h3><div class="list"><div class="list-item"><span class="tick">✓</span><span>見学・対面で個体を確認した</span></div><div class="list-item"><span class="tick">✓</span><span>飼育方法・健康状態について説明を受けた</span></div><div class="list-item"><span class="tick">✓</span><span>キャンセル・保証条件を確認した</span></div></div><div id="statusBox" class="notice" style="margin-top:18px">署名状況を読み込み中…</div><div class="signbox" style="margin-top:22px"><div class="field" style="text-align:left"><label>署名者氏名</label><input id="sign" placeholder="例：山田 太郎"></div><label><input type="checkbox" id="ok"> 上記内容を確認し、契約に同意します</label><button id="signBtn" class="btn btn-main btn-wide" style="margin-top:14px" onclick="signNow()">署名記録を保存する</button></div><div class="notice" style="margin-top:16px">現在は署名操作と時刻をBIG PAW内に記録します。公開時は正式な電子契約方式・本人確認・改ざん防止仕様を確定して接続します。</div></div></section></main><script src="assets/app.js"></script><script src="assets/api.js"></script><script src="assets/bridge.js"></script><script src="assets/workflow.js"></script><script>
let ctx=null,sum=null,me=null;async function init(){try{ctx=await BigPawWorkflow.context();me=await BigPawBridge.me().catch(()=>null);if(!ctx.deal)throw new Error();sum=await BigPawBridge.dealSummary(ctx.deal.id);breed.textContent=ctx.puppy?.breed||'-';sexcolor.textContent=(ctx.puppy?.gender||'')+'・'+(ctx.puppy?.color||'');birth.textContent=ctx.puppy?.birth||'-';price.textContent=BigPawWorkflow.yen(sum.deal.total_price);reservation.textContent=BigPawWorkflow.yen(sum.deal.reservation_amount);balance.textContent=BigPawWorkflow.yen(sum.deal.total_price-sum.deal.reservation_amount);const c=sum.contract;if(!c)statusBox.textContent='まだ署名されていません。';else statusBox.textContent='購入者署名：'+(c.buyer_signed_at?'済':'未')+' ／ ブリーダー署名：'+(c.breeder_signed_at?'済':'未')+' ／ 状態：'+c.status;if(c?.status==='signed'){signBtn.disabled=true;signBtn.textContent='双方署名済み'}}catch(e){statusBox.textContent='ログインして商談から開いてください。';signBtn.disabled=true}}async function signNow(){if(!sign.value.trim()||!ok.checked){alert('氏名入力と同意チェックが必要です');return}try{const c=await BigPawBridge.signContract(ctx.deal.id);alert('署名を保存しました');if(c.status==='signed')location.href='pickup.html?inquiry='+encodeURIComponent(ctx.inquiry.id);else init()}catch(e){alert(e.message||'署名できませんでした')}}init();
</script></body></html>
