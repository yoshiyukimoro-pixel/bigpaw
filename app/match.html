<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大型犬との暮らし相性チェック｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"><style>.q{padding:18px 0;border-bottom:1px solid var(--line)}.q:last-child{border-bottom:0}.choices{display:grid;gap:7px;margin-top:8px}.choices label{border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer}.score{font-size:40px;font-weight:900;color:#c14f7e}</style></head><body><div class="topbar">🐾 大型犬との暮らしを想像してみよう｜BIG PAW</div><header class="site-header"><div class="wrap nav"><a class="logo" href="index.html"><span class="logo-mark">🐾</span>BIG PAW</a><nav class="navlinks"><a href="breed-guide.html">犬種ガイド</a><a href="cost-simulator.html">飼育費</a><a class="nav-cta" href="index.html#puppies">子犬を探す</a></nav></div></header><div class="hero-mini"><div class="wrap"><h1>大型犬との暮らし相性チェック</h1><p>「飼える・飼えない」を判定するテストではなく、迎える前に準備ポイントを見つけるチェックです。</p></div></div><main class="wrap"><section class="section" style="max-width:820px;margin:auto"><div class="card pad" id="quiz"><div class="q"><b>1. 毎日、散歩や運動の時間を確保できそう？</b><div class="choices"><label><input type="radio" name="q1" value="2"> しっかり確保できる</label><label><input type="radio" name="q1" value="1"> 工夫すればできそう</label><label><input type="radio" name="q1" value="0"> かなり難しい</label></div></div><div class="q"><b>2. 月々のフード・医療・用品費を大型犬サイズで考えている？</b><div class="choices"><label><input type="radio" name="q2" value="2"> 予算を確保している</label><label><input type="radio" name="q2" value="1"> これから具体的に計算する</label><label><input type="radio" name="q2" value="0"> まだ考えていない</label></div></div><div class="q"><b>3. 成犬時のスペースや移動手段は？</b><div class="choices"><label><input type="radio" name="q3" value="2"> 十分考えてある</label><label><input type="radio" name="q3" value="1"> 一部見直しが必要</label><label><input type="radio" name="q3" value="0"> まだ未定</label></div></div><div class="q"><b>4. しつけ・トレーニングに家族で取り組めそう？</b><div class="choices"><label><input type="radio" name="q4" value="2"> 継続して取り組める</label><label><input type="radio" name="q4" value="1"> サポートがあればできそう</label><label><input type="radio" name="q4" value="0"> あまり時間をかけられない</label></div></div><button class="btn btn-main btn-wide" style="margin-top:20px" onclick="check()">チェック結果を見る</button></div><div class="card pad" id="result" style="display:none;margin-top:16px"><div class="score" id="score"></div><h2 id="title"></h2><p id="body"></p><div class="grid three"><a class="card pad" href="breed-guide.html"><b>犬種を比較</b></a><a class="card pad" href="cost-simulator.html"><b>飼育費を計算</b></a><a class="card pad" href="breeders.html"><b>ブリーダーに相談</b></a></div></div></section></main><script>function check(){let s=0;for(let i=1;i<=4;i++){let e=document.querySelector('input[name=q'+i+']:checked');if(!e){alert('すべて回答してください');return}s+=Number(e.value)}let title,body;if(s>=7){title='準備がかなり具体的です';body='犬種ごとの運動量・健康情報・ブリーダーの飼育方針まで比較してみましょう。'}else if(s>=4){title='あと少し具体化すると安心';body='費用、生活スペース、運動時間のうち未確定な部分を先に整理してから子犬を比較すると選びやすくなります。'}else{title='まず暮らしの準備から';body='大型犬は成犬時の大きさ・運動・費用の影響が大きいので、犬種選びの前に生活条件を具体化するのがおすすめです。'}document.getElementById('score').textContent=s+' / 8';document.getElementById('title').textContent=title;document.getElementById('body').textContent=body;document.getElementById('result').style.display='block';document.getElementById('result').scrollIntoView({behavior:'smooth'})}</script></body></html>
