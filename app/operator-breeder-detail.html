<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ブリーダー詳細｜BIG PAW運営</title><link rel="stylesheet" href="assets/style.css"><style>.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:18px}.stat b{display:block;font-size:28px}.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.info{padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff}.info span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.info-grid{grid-template-columns:1fr}}</style></head><body class="bigpaw-operator-theme"><div class="topbar">🐾 BIG PAW 運営管理</div><header class="site-header"><div class="wrap nav"><a class="logo" href="operator-admin.html"><span class="logo-mark">🐾</span>BIG PAW 運営</a><nav class="navlinks"><a href="operator-breeders.html">ブリーダー管理</a><a href="operator-admin.html">ダッシュボード</a></nav></div></header><main class="wrap"><div class="breadcrumb"><a href="operator-breeders.html">ブリーダー管理</a> ＞ 詳細</div><section class="section"><div class="card pad"><h1 id="title">ブリーダー詳細</h1><p class="muted">運営専用の確認画面です。</p><div id="notice" class="notice">読み込み中…</div><div id="detail" style="display:none"><div class="info-grid" style="margin-top:16px"><div class="info"><span>犬舎名</span><b id="kennel">-</b></div><div class="info"><span>都道府県</span><b id="prefecture">-</b></div><div class="info"><span>管理ID</span><b id="breederId">-</b></div><div class="info"><span>登録状態</span><b id="status">-</b></div><div class="info"><span>第一種動物取扱業 登録番号</span><b id="registration">-</b></div><div class="info"><span>公開状態</span><b id="suspended">-</b></div></div><div class="stats" style="margin-top:18px"><div class="card stat"><span class="muted">掲載子犬</span><b id="puppyCount">0</b></div><div class="card stat"><span class="muted">問い合わせ</span><b id="inquiryCount">0</b></div><div class="card stat"><span class="muted">成約・商談</span><b id="dealCount">0</b></div></div><div class="actions"><a id="listingLink" class="btn btn-sub" href="operator-listings.html">子犬掲載管理</a><a id="inquiryLink" class="btn btn-sub" href="messages.html?mode=operator">問い合わせ確認</a><a id="dealLink" class="btn btn-sub" href="operator-deals.html">成約管理</a><a id="revenueLink" class="btn btn-sub" href="operator-revenue.html">売上・手数料</a></div></div></div></section></main><script src="assets/api.js"></script><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=new URLSearchParams(location.search).get('id')||'';async function load(){if(!id){notice.textContent='ブリーダーが選択されていません。';return}try{const [pr,puppies,inquiries,deals]=await Promise.all([fetch('/api/breeder-profile?id='+encodeURIComponent(id),{credentials:'same-origin'}),BigPawAPI.breederPuppies(),BigPawAPI.inquiries(),BigPawAPI.operatorDeals()]);if(!pr.ok)throw new Error('profile');const b=await pr.json();if(!b)throw new Error('not_found');const ps=(puppies||[]).filter(x=>String(x.breederId||'')===String(id));const qs=(inquiries||[]).filter(x=>String(x.breeder_id||'')===String(id));const ds=(deals||[]).filter(x=>String(x.breeder_id||'')===String(id));title.textContent=(b.kennel_name||'ブリーダー')+'｜運営管理';kennel.textContent=b.kennel_name||'-';prefecture.textContent=b.prefecture||'-';breederId.textContent=b.id||'-';status.textContent=b.review_status==='approved'?'承認済み':(b.review_status||'-');registration.textContent=b.registration_no||'-';suspended.textContent=b.billing_suspended?'掲載停止中':(b.review_status==='approved'?'公開中':'非公開');puppyCount.textContent=ps.length;inquiryCount.textContent=qs.length;dealCount.textContent=ds.length;const bid=encodeURIComponent(id);listingLink.href='operator-listings.html?breeder='+bid;inquiryLink.href='messages.html?mode=operator&breeder='+bid;dealLink.href='operator-deals.html?breeder='+bid;revenueLink.href='operator-revenue.html?breeder='+bid;notice.style.display='none';detail.style.display='block'}catch(e){notice.textContent='ブリーダー情報を読み込めませんでした。運営アカウントでログインしているか確認してください。'}}load();</script><script src="/auth-return-fix.js"></script><style>html,body{background:#fffbea!important}</style></body></html>
