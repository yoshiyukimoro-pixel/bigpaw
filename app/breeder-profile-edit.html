<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>犬舎プロフィール編集｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="topbar">🐾 BIG PAW ブリーダー管理</div><header class="site-header"><div class="wrap nav"><a class="logo" href="admin.html"><span class="logo-mark">🐾</span>BIG PAW 管理</a><nav class="navlinks"><a href="admin.html">管理画面</a><a id="publicProfileLink" href="breeders.html">公開ページ ↗</a></nav></div></header><main class="wrap"><div class="breadcrumb"><a href="admin.html">管理画面</a> ＞ 犬舎プロフィール</div><section class="section" style="max-width:850px;margin:auto"><form class="card pad" onsubmit="save(event)"><h1>犬舎プロフィール</h1><div class="form-grid"><div class="field"><label>犬舎名（運営管理用）</label><input id="kennel" required></div><div class="field"><label>都道府県（一般公開）</label><input id="prefecture" required></div><div class="field"><label>第一種動物取扱業 登録番号（非公開）</label><input id="registration"></div></div><div class="field"><label>紹介文</label><textarea id="profile"></textarea></div><div class="notice" style="margin:18px 0">一般公開される所在地は都道府県までです。下の見学先住所・電話番号・アクセス案内は一般公開されず、<b>対面見学の日程をブリーダーが確定した購入希望者にだけ</b>表示されます。オンライン見学では表示されません。</div><h2>見学確定後にだけ開示する情報</h2><div class="field"><label>見学場所の住所</label><input id="visitAddress" autocomplete="street-address" placeholder="見学当日に来てもらう住所"></div><div class="form-grid"><div class="field"><label>当日の連絡先</label><input id="visitPhone" type="tel" autocomplete="tel" placeholder="電話番号"></div><div class="field"><label>アクセス・駐車場案内</label><input id="visitAccess" placeholder="例：駐車場あり／○○駅から徒歩10分"></div></div><div id="msg"></div><button class="btn btn-main btn-wide" style="margin-top:18px">保存する</button></form></section></main><script src="assets/api.js"></script><script>let breederId='';async function load(){try{const b=await BigPawAPI.breederProfile();if(!b)throw 0;breederId=String(b.id||'');kennel.value=b.kennel_name||'';prefecture.value=b.prefecture||'';registration.value=b.registration_no||'';profile.value=b.profile||'';visitAddress.value=b.visit_address||'';visitPhone.value=b.visit_phone||'';visitAccess.value=b.visit_access||'';publicProfileLink.href=breederId?'breeder-detail.html?id='+encodeURIComponent(breederId):'breeders.html'}catch(e){msg.innerHTML='<div class="notice">ブリーダーとしてログインしてください。</div>';publicProfileLink.href='breeders.html'}}async function save(e){e.preventDefault();try{const b=await BigPawAPI.updateBreederProfile({kennelName:kennel.value,prefecture:prefecture.value,registrationNo:registration.value,profile:profile.value,visitAddress:visitAddress.value,visitPhone:visitPhone.value,visitAccess:visitAccess.value});breederId=String(b.id||breederId);publicProfileLink.href=breederId?'breeder-detail.html?id='+encodeURIComponent(breederId):'breeders.html';msg.innerHTML='<div class="notice">保存しました。都道府県のみ一般公開され、見学先情報は対面見学確定後の購入希望者にだけ表示されます。</div>'}catch(x){msg.innerHTML='<div class="notice">保存できませんでした。</div>'}}load();</script></body></html>
