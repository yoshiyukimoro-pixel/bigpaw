<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>犬舎プロフィール編集｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="topbar">🐾 BIG PAW ブリーダー管理</div><header class="site-header"><div class="wrap nav"><a class="logo" href="admin.html"><span class="logo-mark">🐾</span>BIG PAW 管理</a><nav class="navlinks"><a href="admin.html">管理画面</a><a href="breeder-detail.html">公開ページ ↗</a></nav></div></header><main class="wrap"><div class="breadcrumb"><a href="admin.html">管理画面</a> ＞ 犬舎プロフィール</div><section class="section" style="max-width:850px;margin:auto"><form class="card pad" onsubmit="save(event)"><h1>犬舎プロフィール</h1><div class="form-grid"><div class="field"><label>犬舎名</label><input id="kennel" required></div><div class="field"><label>都道府県</label><input id="prefecture" required></div><div class="field"><label>第一種動物取扱業 登録番号</label><input id="registration"></div></div><div class="field"><label>紹介文</label><textarea id="profile"></textarea></div><div id="msg"></div><button class="btn btn-main btn-wide" style="margin-top:18px">保存する</button></form></section></main><script src="assets/api.js"></script><script>async function load(){try{const b=await BigPawAPI.breederProfile();if(!b)throw 0;kennel.value=b.kennel_name||'';prefecture.value=b.prefecture||'';registration.value=b.registration_no||'';profile.value=b.profile||''}catch(e){msg.innerHTML='<div class="notice">ブリーダーとしてログインしてください。</div>'}}async function save(e){e.preventDefault();try{await BigPawAPI.updateBreederProfile({kennelName:kennel.value,prefecture:prefecture.value,registrationNo:registration.value,profile:profile.value});msg.innerHTML='<div class="notice">保存しました。</div>'}catch(x){msg.innerHTML='<div class="notice">保存できませんでした。</div>'}}load();</script></body></html>
