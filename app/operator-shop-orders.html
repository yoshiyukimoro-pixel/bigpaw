<!doctype html>
<html lang="ja" data-bp-page-theme="operator">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>フードショップ注文管理｜BIG PAW運営</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/account-page-theme.css?v=20261005">
  <style>
    body{background:#fffbea;color:#263447}.wrap{max-width:1000px;margin:auto;padding:20px}
    .top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
    .notice{background:#fff4d6;border-left:5px solid #c18b19;padding:12px 15px;border-radius:8px}
    .order{background:white;border:1px solid #d9e0e8;border-radius:12px;padding:16px;margin:12px 0}
    .row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.amount{font-weight:800;font-size:20px}
    .muted{color:#657386;font-size:13px}.state{font-weight:750;color:#765a13}
    details{margin-top:10px}summary{cursor:pointer;font-weight:700}ul{padding-left:22px}
    .reconcile{border-top:1px solid #e3e7eb;margin-top:14px;padding-top:12px}.reconcile label{display:block;font-weight:700}
    .reconcile input{box-sizing:border-box;width:min(100%,480px);padding:10px;margin:6px 0;border:1px solid #8793a1;border-radius:7px}
    .audit{margin:24px 0;padding:16px;border:1px solid #d9e0e8;border-radius:12px;background:white}
    #message{padding:18px;background:#fff;border-radius:10px}
    @media(max-width:600px){.wrap{padding:14px}.order{padding:13px}}
  </style>
</head>
<body class="bp-account-page">
  <main class="wrap">
    <div class="top"><h1>フードショップ注文管理</h1><button id="refresh" type="button">再読み込み</button></div>
    <p class="notice"><strong>運営ログイン専用</strong>。一覧は過去の記録を表示します。過去の入金確認だけでは現在の返金状況は分からないため、発注・発送前にSquareの最新状態を確認してください。住所・氏名・電話番号は表示しません。</p>
    <p class="muted">手動照合は、本番で運営者が専用設定を有効にした場合のみ利用できます。Squareの最新情報を読み取ってBIG PAWの入金記録を更新します。決済・返金・発注・発送・メール送信は行いません。</p>
    <p id="message" role="status">注文情報を読み込んでいます…</p>
    <section id="orders" aria-label="ショップ注文一覧"></section>
    <section class="audit"><h2>手動照合の操作記録</h2><p id="audit">読み込み中…</p></section>
    <p><a href="operator-admin.html">運営管理へ戻る</a></p>
  </main>
  <script>
  (()=>{
    const msg=document.getElementById('message'), list=document.getElementById('orders');
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const date=s=>{if(!Number.isInteger(s)||s<0)return '—';try{return new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',dateStyle:'medium',timeStyle:'short'}).format(new Date(s*1000))}catch{return '—'}};
    async function loadAudit(){const el=document.getElementById('audit');try{const r=await fetch('/api/operator/shop-orders/audit',{credentials:'same-origin',cache:'no-store'});if(!r.ok)throw Error();const d=await r.json();el.textContent=d.events.length?d.events.map(x=>`${date(x.created_at)}　${x.order_id}　${x.outcome==='newly_paid'?'新規入金確認':x.outcome==='already_paid'?'再照合成功':'照合不成立'}　運営ID ${x.actor_id}`).join(' / '):'手動照合の記録はありません。'}catch{el.textContent='操作記録を取得できませんでした。'}}
    async function reconcile(form){const fields=new FormData(form),orderId=fields.get('order_id'),paymentId=String(fields.get('payment_id')||'').trim();if(!/^[A-Za-z0-9_-]{8,192}$/.test(paymentId)){msg.textContent='Squareの決済IDを正しく入力してください。';return}if(!confirm('Squareの最新決済情報を照合します。新しい支払いや返金、発送は行いません。続けますか？'))return;msg.textContent='Squareの最新情報を照合しています…';try{const t=await fetch('/api/operator/shop-orders/reconcile-token',{credentials:'same-origin',cache:'no-store'});if(!t.ok)throw Error();const token=await t.json();const r=await fetch('/api/operator/shop-orders/reconcile',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({order_id:orderId,payment_id:paymentId,csrf_token:token.csrf_token})});const d=await r.json();if(!r.ok)throw Error();const successMessage=d.new_transition?'Squareで入金を新規確認し、監査記録を保存しました。':'Squareの最新状態を再確認し、監査記録を保存しました。';form.reset();await load();await loadAudit();msg.textContent=successMessage}catch{await loadAudit();msg.textContent='照合できませんでした。Square側の情報を確認し、同じ注文の状態が解決するまで新しい決済リンクを作らないでください。'}}
    async function load(){msg.textContent='注文情報を読み込んでいます…';list.replaceChildren();try{
      const r=await fetch('/api/operator/shop-orders',{credentials:'same-origin',headers:{Accept:'application/json'},cache:'no-store'});
      if(r.status===401||r.status===403){msg.textContent='運営アカウントでログインしてください。';return}
      if(!r.ok)throw Error();const d=await r.json();
      msg.textContent=`表示中 ${d.count}件（最大100件）。現在の決済・返金状況はSquareで個別確認が必要です。`;
      if(!d.orders?.length){msg.textContent='注文記録はまだありません。';return}
      list.innerHTML=d.orders.map(o=>{
        const state=o.payment_recorded_historically?'過去にSquare入金確認あり':'入金確認記録なし';
        return `<article class="order"><div class="row"><strong class="state">${state}</strong><span class="amount">${Number(o.amount_yen).toLocaleString('ja-JP')}円</span></div>
        <p><code>${esc(o.order_id)}</code></p><p class="muted">注文記録：${date(o.created_at)}　過去の入金確認：${date(o.paid_at)}</p>
        <details><summary>注文商品を表示（${o.items.length}品目）</summary><ul>${o.items.map(i=>`<li>${esc(i.name)}／${esc(i.size)} × ${esc(i.qty)}　${Number(i.unit_yen).toLocaleString('ja-JP')}円</li>`).join('')}</ul></details>
        <p class="muted">署名付き決済通知の検証記録：${esc(o.verified_signed_event_count)}件。現在の入金・返金状況を示すものではありません。</p>
        <form class="reconcile"><label>Square決済IDを入力して最新状態を照合</label><input name="payment_id" autocomplete="off" maxlength="192" required placeholder="Squareの決済詳細にあるID"><input type="hidden" name="order_id" value="${esc(o.order_id)}"><button type="submit">Squareと照合</button><p class="muted">決済IDは正規のSquare管理画面から確認してください。照合はSquareへの読み取りと内部記録のみを行い、返金・発送・メール送信はしません。</p></form></article>`;
      }).join('');
      list.querySelectorAll('.reconcile').forEach(form=>form.addEventListener('submit',ev=>{ev.preventDefault();reconcile(form)}));
    }catch{msg.textContent='注文一覧を取得できませんでした。時間をおいて再読み込みしてください。'}}
    document.getElementById('refresh').addEventListener('click',()=>{load();loadAudit()});load();loadAudit();
  })();
  </script>
</body>
</html>
