<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>成約管理｜BIG PAW運営</title><link rel="stylesheet" href="assets/style.css"><style>.admin-grid{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.sidebar{background:linear-gradient(180deg,#6d5572,#5b4b62);color:#fff;padding:22px}.sidebar a{display:block;padding:10px 12px;border-radius:10px;margin:4px 0}.sidebar a.active,.sidebar a:hover{background:rgba(255,255,255,.1)}.main{padding:28px}@media(max-width:800px){.admin-grid{grid-template-columns:1fr}.sidebar{display:none}.main{padding:14px}}</style></head><body><div class="admin-grid"><aside class="sidebar"><div class="logo"><span class="logo-mark">🐾</span>BIG PAW</div><p style="opacity:.7">運営管理</p><a href="operator-admin.html">ダッシュボード</a><a href="operator-deal-reports.html">成約申請</a><a class="active" href="operator-deals.html">成約管理</a><a href="operator-revenue.html">売上・手数料</a><a href="operator-reports.html">通報対応</a><a href="index.html">公開サイト ↗</a></aside><main class="main"><h1>成約管理</h1><p class="muted">見学から成約までの実データを確認し、手動決済時は予約金の入金確認を行います。</p><section class="section"><div class="card pad"><div id="rows">読み込み中…</div></div></section></main></div><script src="assets/api.js"></script><script>
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function yen(n){return Number(n||0).toLocaleString()+'円'}
async function markPaid(id,amount){if(!confirm(yen(amount)+'の入金を確認済みにしますか？'))return;try{await BigPawAPI.payReservation(id,amount);await load()}catch(e){alert(e.message||'更新できませんでした')}}
async function load(){try{const a=await BigPawAPI.operatorDeals();rows.innerHTML=a.length?a.map(x=>`<div style="padding:16px 0;border-bottom:1px solid #f1dbe5"><b>${esc(x.puppy_name)}</b>｜${esc(x.breed)}<br><span class="muted">${esc(x.breeder_name||'')} × ${esc(x.buyer_name||x.buyer_email)} / ${yen(x.total_price)}</span><div class="chips" style="margin-top:8px"><span class="chip">商談: ${esc(x.status)}</span><span class="chip">予約金: ${esc(x.reservation_status||'未入金')}</span><span class="chip">契約: ${esc(x.contract_status||'未作成')}</span><span class="chip">お迎え: ${esc(x.pickup_status||'未設定')}</span></div>${x.reservation_status!=='paid'?`<button class="btn btn-main" style="margin-top:10px" onclick="markPaid('${x.id}',${x.reservation_amount})">予約金 ${yen(x.reservation_amount)} を入金確認</button>`:''}</div>`).join(''):'商談データはありません。'}catch(e){rows.innerHTML='運営アカウントでログインしてください。'}}load();
</script><script src="/auth-return-fix.js"></script><style id="bigpaw-role-theme">body{background:#fff7fb!important}body.bigpaw-breeder-theme{background:#f3f8ff!important}body.bigpaw-operator-theme{background:#fffbea!important}</style><script>(function(){var p=location.pathname;if(p.indexOf("/operator-")>=0)document.body.classList.add("bigpaw-operator-theme");else if(p.indexOf("/breeder-")>=0||p.endsWith("/admin.html"))document.body.classList.add("bigpaw-breeder-theme");})();</script></body></html>
