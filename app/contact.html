<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>お問い合わせ｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="topbar">🐾 BIG PAW</div><header class="site-header"><div class="wrap nav"><a class="logo" href="index.html"><span class="logo-mark">🐾</span>BIG PAW</a><nav class="navlinks"><a href="search.html">子犬を探す</a><a href="breeders.html">ブリーダー</a><a href="faq.html">FAQ</a></nav></div></header><main class="wrap"><section class="section" style="max-width:760px;margin:auto"><form class="card pad" id="form"><h1>BIG PAW運営へお問い合わせ</h1><p class="muted">掲載・会員登録・成約・請求・サイト利用について、運営へお問い合わせいただけます。</p><div class="notice" style="margin:14px 0">直接のご連絡：<a href="mailto:info@bigpaw.jp">info@bigpaw.jp</a> ／ 090-5995-2485</div><div class="form-grid"><div class="field"><label>お名前</label><input id="name" required maxlength="100"></div><div class="field"><label>メールアドレス</label><input id="email" type="email" required maxlength="254"></div><div class="field"><label>カテゴリ</label><select id="category"><option>サイト利用について</option><option>ブリーダー掲載について</option><option>成約・請求について</option><option>掲載内容・トラブルについて</option><option>その他</option></select></div><div class="field"><label>件名</label><input id="subject" required maxlength="200"></div></div><div class="field"><label>お問い合わせ内容</label><textarea id="message" required maxlength="5000" style="min-height:180px"></textarea></div><div id="result"></div><button class="btn btn-main btn-wide">送信する</button></form></section></main><footer><div class="wrap foot"><b>BIG PAW</b><small><a href="terms.html">利用規約</a>　<a href="privacy.html">プライバシー</a>　<a href="contact.html">お問い合わせ</a></small></div></footer><script src="assets/api.js"></script><script>
form.addEventListener('submit',async e=>{e.preventDefault();const btn=form.querySelector('button');btn.disabled=true;try{const r=await BigPawAPI.sendSupport({name:name.value,email:email.value,category:category.value,subject:subject.value,message:message.value});result.innerHTML=`<div class="notice">お問い合わせを受け付けました。受付番号：<b>${String(r.id).replace(/[&<>"']/g,'')}</b></div>`;form.reset()}catch(x){result.innerHTML='<div class="notice">送信できませんでした。入力内容をご確認のうえ、時間をおいてお試しください。</div>'}finally{btn.disabled=false}});
</script></body></html>
