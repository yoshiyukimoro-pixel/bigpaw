<!doctype html><html lang="ja" data-bp-page-theme="operator"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>登録ユーザー｜BIG PAW運営</title><link rel="stylesheet" href="assets/style.css"><style>.user-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.user-tools input{flex:1;min-width:240px}.role-badge{display:inline-block;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:800;background:#f0ede5}.role-badge.breeder{background:#eaf3ff;color:#346995}.role-badge.buyer{background:#fff0f6;color:#a2446e}.role-badge.operator{background:#fff5cf;color:#755c00}.verify-ok{color:#2e7d32;font-weight:700}.verify-wait{color:#9b5d00;font-weight:700}</style><link rel="stylesheet" href="assets/account-page-theme.css?v=20261005"></head><body class="bp-account-page"><div class="topbar">🐾 BIG PAW 運営管理</div><header class="site-header"><div class="wrap nav"><a class="logo" href="operator-admin.html"><span class="logo-mark">🐾</span>BIG PAW 運営</a><nav class="navlinks"><a href="operator-admin.html">ダッシュボード</a><a href="operator-breeders.html">ブリーダー管理</a><a href="operator-listings.html">子犬掲載管理</a></nav></div></header><div class="hero-mini"><div class="wrap"><h1>登録ユーザー</h1><p>一般ユーザー・ブリーダー・運営アカウントを確認します。住所や電話番号などの個人情報はこの一覧には表示しません。</p></div></div><main class="wrap"><section class="section"><div class="card pad"><div class="user-tools"><input id="search" placeholder="名前・メール・管理ID・犬舎名で検索"><button class="btn btn-sub" type="button" onclick="load()">検索</button></div><div id="summary" class="notice" style="margin-bottom:14px">読み込み中…</div><div id="users" class="tablelike"><div class="table-row"><div>読み込み中</div><div>登録ユーザーを確認しています…</div></div></div></div></section></main><script src="assets/api.js"></script><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const roleLabel=r=>({buyer:'一般ユーザー',breeder:'ブリーダー',operator:'運営'}[r]||r||'-');const appLabel=s=>({pending:'審査待ち',approved:'承認済み',rejected:'差し戻し'}[s]||s||'');const dateText=v=>{if(!v)return '-';const d=new Date(Number(v)*1000);return isNaN(d)?'-':d.toLocaleString('ja-JP')};async function load(){const q=(search.value||'').trim().toLowerCase();try{let rows=await BigPawAPI.request('/operator/users');if(!Array.isArray(rows))rows=[];if(q)rows=rows.filter(u=>[u.id,u.email,u.last,u.first,u.display_name,u.kennel_name,u.prefecture].some(v=>String(v||'').toLowerCase().includes(q)));summary.textContent=`登録ユーザー ${rows.length}件を表示中。詳細画面で必要な情報だけ確認できます。`;users.innerHTML=rows.length?rows.map(u=>{const name=u.display_name||[u.last,u.first].filter(Boolean).join(' ')||'名前未登録';const app=u.breeder_application_status?`<br><span class="muted">ブリーダー申請：${esc(appLabel(u.breeder_application_status))}${u.kennel_name?' ／ '+esc(u.kennel_name):''}</span>`:'';return `<div class="table-row"><div><span class="role-badge ${esc(u.role)}">${esc(roleLabel(u.role))}</span><br><b>${esc(name)}</b></div><div><span>${esc(u.email||'-')}</span><br><span class="muted">管理ID：${esc(u.id||'')} ／ 登録：${esc(dateText(u.created_at))}</span><br><span class="${u.email_verified?'verify-ok':'verify-wait'}">${u.email_verified?'メール認証済み':'メール未認証'}</span>${app}<div style="margin-top:9px"><a class="btn btn-sub" href="operator-user-detail.html?id=${encodeURIComponent(u.id||'')}">ユーザー詳細を見る</a></div></div></div>`}).join(''):'<div class="table-row"><div>ユーザー</div><div>該当する登録ユーザーはいません。</div></div>'}catch(e){summary.textContent='登録ユーザーを読み込めませんでした。';users.innerHTML='<div class="table-row"><div>権限</div><div>運営アカウントでログインしてください。</div></div>'}}load();</script><script src="/auth-return-fix.js"></script><style id="bigpaw-role-theme">body{background:#fffbea!important}</style></body></html>
