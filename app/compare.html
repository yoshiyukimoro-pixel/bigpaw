<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>子犬を比較｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"><style>.compare{overflow:auto}.compare table{width:100%;min-width:720px;border-collapse:collapse}.compare th,.compare td{padding:14px;border-bottom:1px solid var(--line);text-align:left}.compare th:first-child,.compare td:first-child{background:#fff8fc;font-weight:900;width:150px}</style></head><body><div class="topbar">🐾 大型犬専門｜BIG PAW</div><header class="site-header"><div class="wrap nav"><a class="logo" href="index.html"><span class="logo-mark">🐾</span>BIG PAW</a><nav class="navlinks"><a href="search.html">子犬を探す</a><a href="favorites.html">♡ お気に入り</a><a class="nav-cta" href="mypage.html">マイページ</a></nav></div></header><div class="hero-mini"><div class="wrap"><h1>子犬を比較</h1><p>お気に入りの子を、大型犬ならではの項目で比較。</p></div></div><main class="wrap"><section class="section"><div class="card pad compare" id="cmp"></div></section></main><script src="assets/app.js"></script><script>const ids=BigPaw.getFavorites();let dogs=ids.map(id=>BigPaw.getPuppy(id)).filter(Boolean);if(!dogs.length)dogs=BigPaw.getPuppies().slice(0,3);const rows=[['犬種',p=>p.breed],['性別',p=>p.gender],['毛色',p=>p.color],['価格',p=>BigPaw.currency(p.price)],['地域',p=>p.area],['現在体重',p=>(p.weight||'-')+'kg'],['成犬時目安',p=>(p.adultMin||'-')+'〜'+(p.adultMax||'-')+'kg'],['健康情報',p=>p.health?'掲載あり':'未掲載'],['ブリーダー',p=>p.breeder],['募集状況',p=>p.status]];cmp.innerHTML=`<table><tr><th>比較項目</th>${dogs.map(p=>`<th><a href="puppy-detail.html?id=${p.id}">${BigPaw.esc(p.name)}</a></th>`).join('')}</tr>${rows.map(r=>`<tr><td>${r[0]}</td>${dogs.map(p=>`<td>${BigPaw.esc(r[1](p))}</td>`).join('')}</tr>`).join('')}</table>`;</script></body></html>
