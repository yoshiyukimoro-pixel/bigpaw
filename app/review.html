<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>口コミ投稿｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"><style>.stars{display:flex;gap:6px}.stars button{border:0;background:transparent;font-size:34px;cursor:pointer;filter:grayscale(1);opacity:.35}.stars button.on{filter:none;opacity:1}</style></head><body><div class="topbar">🐾 BIG PAW｜お迎え後もつながる</div><header class="site-header"><div class="wrap nav"><a class="logo" href="index.html"><span class="logo-mark">🐾</span>BIG PAW</a><nav class="navlinks"><a href="mypage.html">マイページ</a></nav></div></header><div class="hero-mini"><div class="wrap"><h1>ブリーダーの口コミ</h1><p>お迎え後の体験を、次に大型犬を迎える家族へ。</p></div></div><main class="wrap"><section class="section" style="max-width:760px;margin:auto"><div class="card pad"><div class="profile"><div class="avatar">🐩</div><div><b id="breeder">ブリーダー</b><div class="muted" id="target">お迎えした子犬</div></div></div><div id="posted" class="notice" style="display:none;margin-top:18px">この取引には口コミを投稿済みです。</div><h2 style="margin-top:24px">満足度</h2><div class="stars" id="stars"><button onclick="rate(1)">★</button><button onclick="rate(2)">★</button><button onclick="rate(3)">★</button><button onclick="rate(4)">★</button><button onclick="rate(5)">★</button></div><div class="field" style="margin-top:18px"><label>口コミ</label><textarea id="text" placeholder="見学時の説明、お迎えまでの対応、お迎え後のサポートなど"></textarea></div><label><input type="checkbox" id="reviewConfirm"> 実際にお迎えした取引についての口コミです</label><button id="submitBtn" class="btn btn-main btn-wide" style="margin-top:16px" onclick="submitReview()">口コミを投稿</button></div></section></main><script src="assets/app.js"></script><script src="assets/api.js"></script><script src="assets/bridge.js"></script><script src="assets/workflow.js"></script><script>
let r=0,ctx=null,sum=null;function rate(n){r=n;document.querySelectorAll('#stars button').forEach((b,i)=>b.classList.toggle('on',i<n))}async function init(){try{ctx=await BigPawWorkflow.context();sum=await BigPawBridge.dealSummary(ctx.deal.id);breeder.textContent=ctx.puppy?.breeder||ctx.inquiry.breeder||'ブリーダー';target.textContent=(ctx.puppy?.breed||'')+'｜'+(ctx.puppy?.name||'子犬');if(sum.review){posted.style.display='block';submitBtn.disabled=true;submitBtn.textContent='投稿済み';rate(sum.review.rating);text.value=sum.review.body||''}}catch(e){posted.style.display='block';posted.textContent='ログインして成約済みの取引から開いてください。';submitBtn.disabled=true}}async function submitReview(){const checked=document.getElementById('reviewConfirm')?.checked;if(!r||!text.value.trim()||!checked){alert('評価・口コミ・確認チェックを入力してください');return}try{await BigPawBridge.addReview(ctx.deal.id,{rating:r,body:text.value.trim()});alert('口コミを投稿しました');location.href='mypage.html'}catch(e){alert(e.status===409?'お迎え完了後に投稿できます。':(e.message||'投稿できませんでした'))}}init();
</script></body></html>
