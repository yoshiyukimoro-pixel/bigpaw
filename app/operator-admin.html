<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>運営管理｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"><style>.admin-grid{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.sidebar{background:linear-gradient(180deg,#6d5572,#5b4b62);color:#fff;padding:22px}.sidebar a{display:block;padding:10px 12px;border-radius:10px;margin:4px 0}.sidebar a:hover{background:rgba(255,255,255,.1)}.main{padding:28px}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.statbox{padding:18px}.statbox b{font-size:28px;display:block}.statlink{display:block;text-decoration:none;color:inherit;cursor:pointer;border-radius:18px}.statlink .statbox{height:100%;box-sizing:border-box}.statlink:active{transform:scale(.985)}@media(max-width:800px){.admin-grid{grid-template-columns:1fr}.sidebar{display:none}.statgrid{grid-template-columns:1fr 1fr}.main{padding:14px}}</style></head><body><div class="admin-grid"><aside class="sidebar"><div class="logo"><span class="logo-mark">🐾</span>BIG PAW</div><p style="opacity:.7">運営管理</p><a href="operator-admin.html">ダッシュボード</a><a href="operator-breeders.html">ブリーダー審査</a><a href="operator-listings.html">子犬掲載審査</a><a href="operator-reports.html">通報・違反対応</a><a href="operator-support.html">運営お問い合わせ</a><a href="operator-deal-reports.html">成約申請</a><a href="operator-deals.html">成約管理</a><a href="operator-revenue.html">売上・手数料</a><a href="operator-invoices.html">請求管理</a><a href="operator-audit.html">監査ログ</a><a href="operator-backups.html">バックアップ</a><a href="operator-automations.html">自動処理モニター</a><a href="project-status.html">開発状況</a><a href="backend-status.html">システム状態</a><a href="index.html">公開サイト ↗</a></aside><main class="main"><h1>運営ダッシュボード</h1><p class="muted">BIG PAW全体を管理する運営者向け画面。</p><div class="statgrid"><div class="card statbox"><span class="muted">登録ユーザー</span><b id="opUsers">-</b></div><a class="statlink" href="operator-breeders.html" aria-label="掲載ブリーダーを確認"><div class="card statbox"><span class="muted">掲載ブリーダー</span><b id="opBreeders">-</b></div></a><a class="statlink" href="operator-listings.html" aria-label="募集中の子犬を確認"><div class="card statbox"><span class="muted">募集中の子犬</span><b id="opPuppies">-</b></div></a><a class="statlink" href="messages.html?mode=operator" aria-label="未返信問い合わせを確認"><div class="card statbox"><span class="muted">未返信問い合わせ</span><b id="opInquiries">-</b></div></a><a class="statlink" href="operator-deal-reports.html" aria-label="成約申請待ちを確認"><div class="card statbox"><span class="muted">成約申請待ち</span><b id="opDealReports">-</b></div></a><a class="statlink" href="operator-support.html" aria-label="運営問い合わせを確認"><div class="card statbox"><span class="muted">運営問い合わせ</span><b id="opSupport">-</b></div></a></div><section class="section"><div class="card pad"><h2>運営で確認する項目</h2><div class="chips"><span class="chip">本人確認</span><span class="chip">動物取扱業情報</span><span class="chip">掲載内容</span><span class="chip">健康情報</span><span class="chip">通報対応</span><span class="chip">口コミ</span></div><div id="opNotice" class="notice" style="margin-top:16px">サーバーデータを読み込み中…</div></div></section></main></div><script src="assets/app.js"></script><script src="assets/api.js"></script><script>
(async()=>{if(BigPawAPI.isLive()){try{const s=await BigPawAPI.operatorStats();opUsers.textContent=s.users;opBreeders.textContent=s.breeders;opPuppies.textContent=s.openPuppies;opInquiries.textContent=s.unanswered;opDealReports.textContent=s.pendingDealReports||0;opSupport.textContent=s.openSupport||0;opNotice.textContent='SQLiteの実データを表示しています。'}catch(e){opNotice.innerHTML=e.status===401?'運営アカウントでログインしてください。<br><a class="btn btn-main" href="login.html" style="margin-top:10px">ログイン</a>':'サーバー集計を読み込めませんでした。'}}else{opUsers.textContent=1;opBreeders.textContent=1;opPuppies.textContent=BigPaw.getPuppies().filter(p=>p.status==='募集中').length;opInquiries.textContent=BigPaw.getInquiries().length;opDealReports.textContent=0;opSupport.textContent=0;opNotice.textContent='ファイル表示のためデモデータを表示しています。'}})();
</script><style id="bigpaw-operator-theme-lock">html,body{background:#fffbea!important;background-color:#fffbea!important}body::before{background:#fffbea!important}</style><script src="/auth-return-fix.js"></script><style id="bigpaw-role-theme">body{background:#fff7fb!important}body.bigpaw-breeder-theme{background:#f3f8ff!important}body.bigpaw-operator-theme{background:#fffbea!important}</style><script>(function(){var p=location.pathname;if(p.indexOf("/operator-")>=0)document.body.classList.add("bigpaw-operator-theme");else if(p.indexOf("/breeder-")>=0||p.endsWith("/admin.html"))document.body.classList.add("bigpaw-breeder-theme");})();</script><div id="operator-menu-links"><h2>運営メニュー</h2><p><a class="btn btn-main" href="/operator-breeders.html">ブリーダー審査</a> <a class="btn btn-main" href="/operator-listings.html">子犬掲載審査</a> <a class="btn btn-main" href="/operator-invoices.html">請求管理</a> <a class="btn btn-sub" href="/index.html">一般公開サイト確認</a></p></div></body></html>
