<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>パスワード再設定｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="topbar">🐾 大型犬専門｜BIG PAW</div><header class="site-header"><div class="wrap nav"><a class="logo" href="index.html"><span class="logo-mark">🐾</span>BIG PAW</a></div></header><main class="wrap"><section class="section" style="max-width:600px;margin:auto"><div class="card pad"><h1>パスワードを再設定</h1><p class="muted">登録メールアドレスを入力してください。パスワード再設定用のリンクをメールでお送りします。</p><form onsubmit="requestReset(event)"><div class="field"><label>メールアドレス</label><input id="email" type="email" required></div><button class="btn btn-main btn-wide">再設定リンクを送信</button></form><div id="result" style="margin-top:16px"></div><div class="notice" style="margin-top:14px;font-size:13px;line-height:1.7"><b>メールが届かない場合</b><br>5分ほど待っても届かない場合は、迷惑メールフォルダをご確認ください。あわせて <b>noreply@bigpaw.site</b> からのメールを受信できるよう、受信許可設定をご確認ください。</div></div></section></main><script src="assets/api.js"></script><script>async function requestReset(e){e.preventDefault();result.innerHTML='';try{const r=await BigPawAPI.requestPasswordReset(email.value.trim());let html='<div class="notice">該当するアカウントがある場合、パスワード再設定メールを送信しました。通常は数分以内に届きます。</div>';if(r.devToken)html+=`<a class="btn btn-main btn-wide" style="margin-top:12px" href="reset-password.html?token=${encodeURIComponent(r.devToken)}">再設定ページを開く</a>`;result.innerHTML=html}catch(x){result.innerHTML='<div class="notice">しばらくしてからもう一度お試しください。</div>'}}</script></body></html>
