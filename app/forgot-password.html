<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>パスワード再設定｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="topbar">🐾 大型犬専門｜BIG PAW</div><header class="site-header"><div class="wrap nav"><a class="logo" href="index.html"><span class="logo-mark">🐾</span>BIG PAW</a></div></header><main class="wrap"><section class="section" style="max-width:600px;margin:auto"><div class="card pad"><h1>パスワードを再設定</h1><p class="muted">登録メールアドレスを入力してください。本番公開時はメールで再設定リンクを送信します。</p><form onsubmit="requestReset(event)"><div class="field"><label>メールアドレス</label><input id="email" type="email" required></div><button class="btn btn-main btn-wide">再設定リンクを発行</button></form><div id="result" style="margin-top:16px"></div><p class="muted" style="font-size:12px">開発版ではメール送信サービス未接続のため、再設定リンクをこの画面に表示します。</p></div></section></main><script src="assets/api.js"></script><script>async function requestReset(e){e.preventDefault();result.innerHTML='';try{const r=await BigPawAPI.requestPasswordReset(email.value.trim());let html='<div class="notice">該当するアカウントがある場合、再設定手続きを発行しました。</div>';if(r.devToken)html+=`<a class="btn btn-main btn-wide" style="margin-top:12px" href="reset-password.html?token=${encodeURIComponent(r.devToken)}">開発版：再設定ページを開く</a>`;result.innerHTML=html}catch(x){result.innerHTML='<div class="notice">しばらくしてからもう一度お試しください。</div>'}}</script></body></html>
