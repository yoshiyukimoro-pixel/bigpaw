<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大型犬ブリーダーを探す｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="topbar">🐾 大型犬専門｜BIG PAW</div><header class="site-header"><div class="wrap nav"><a class="logo" href="index.html"><span class="logo-mark">🐾</span>BIG PAW</a><nav class="navlinks"><a href="search.html">子犬を探す</a><a href="breeders.html">ブリーダー</a><a href="favorites.html">♡ お気に入り</a><a class="nav-cta" href="login.html">ログイン</a></nav></div></header><div class="hero-mini"><div class="wrap"><h1>大型犬ブリーダーを探す</h1><p>BIG PAWの審査を通過した大型犬ブリーダーを掲載。公開ページでは犬舎名や直接連絡先を表示せず、問い合わせはBIG PAW内で行います。</p></div></div><main class="wrap"><section class="section"><div class="card pad"><div class="form-grid"><div class="field"><label>キーワード</label><input id="kw" placeholder="都道府県・紹介文" oninput="render()"></div></div></div><div class="grid three" id="list" style="margin-top:18px"></div></section></main><footer><div class="wrap foot"><b>BIG PAW</b><small>大型犬専門 子犬マッチングサービス</small></div></footer><script src="assets/app.js"></script><script src="assets/api.js"></script><script>let rows=[];const esc=s=>BigPaw.esc(String(s??''));async function load(){try{rows=await BigPawAPI.breeders();render()}catch(e){list.innerHTML='<div class="card pad">ブリーダー情報を読み込めませんでした。</div>'}}function render(){const q=(kw.value||'').trim().toLowerCase();const a=rows.filter(x=>!q||(`${x.prefecture||''} ${x.profile||''}`).toLowerCase().includes(q));list.innerHTML=a.length?a.map(b=>`<a class="card kennel-card" href="breeder-detail.html?id=${encodeURIComponent(b.id)}"><div class="avatar">🐾</div><div><b>${esc(b.kennel_name||'BIGPAW認定ブリーダー')}</b><div class="muted">ブリーダーID：${esc(b.id||"")}</div><div class="chips"><span class="chip">募集中 ${b.open_puppies||0}頭</span>${b.rating?`<span class="chip">★ ${b.rating} (${b.review_count})</span>`:''}</div><p class="muted">${esc((b.profile||'').slice(0,85))}</p></div></a>`).join(''):'<div class="card pad">該当するブリーダーはありません。</div>'}load();</script></body></html>
