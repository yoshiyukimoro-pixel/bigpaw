<!doctype html><html lang="ja" data-bp-page-theme="operator"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>バックアップ｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="assets/account-page-theme.css?v=20261005"></head><body class="bp-account-page"><div class="topbar">🐾 BIG PAW 運営管理</div><header class="site-header"><div class="wrap nav"><a class="logo" href="operator-admin.html"><span class="logo-mark">🐾</span>BIG PAW 運営</a><nav class="navlinks"><a href="operator-admin.html">ダッシュボード</a><a href="operator-audit.html">監査ログ</a></nav></div></header><main class="wrap"><section class="section"><div class="section-head"><div><h1>データバックアップ</h1><p>SQLiteデータベースのスナップショット作成・復元。</p></div><button class="btn btn-main" onclick="createBk()">今すぐバックアップ</button></div><div class="card pad"><div id="msg"></div><div class="notice" style="margin-bottom:14px">外部保管用として、最新バックアップを「ダウンロード」してGoogle Driveの「BIG PAW Backups」などRailway以外の場所にも保存してください。復元は現在のDBを自動で退避してから実行します。</div><div id="list">読み込み中…</div></div></section></main><script src="assets/api.js"></script><script>function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function t(v){return new Date(v*1000).toLocaleString('ja-JP')}function dl(enc){const f=decodeURIComponent(enc);location.href='/api/operator/backups/'+encodeURIComponent(f)+'/download'}async function load(){try{const a=await BigPawAPI.backups();list.innerHTML=a.length?a.map(x=>`<div style="padding:12px 0;border-bottom:1px solid #f1dbe5"><b>${esc(x.filename)}</b><br><span class="muted">${t(x.created_at)}</span><br><button class="btn btn-main" style="margin-top:8px" onclick="dl('${encodeURIComponent(x.filename)}')">ダウンロード</button> <button class="btn btn-sub" style="margin-top:8px" onclick="restore('${encodeURIComponent(x.filename)}')">このバックアップへ復元</button></div>`).join(''):'まだバックアップはありません。'}catch(e){list.innerHTML='運営アカウントでログインしてください。'}}async function createBk(){try{const r=await BigPawAPI.createBackup();msg.innerHTML=`<div class="notice">作成しました：${esc(r.filename)}。外部保管する場合は下の「ダウンロード」を押してください。</div>`;load()}catch(e){msg.innerHTML='<div class="notice">作成できませんでした。</div>'}}async function restore(enc){const f=decodeURIComponent(enc);const c=prompt('復元するには RESTORE BIG PAW と入力してください。\n対象: '+f);if(c!=='RESTORE BIG PAW')return;try{const r=await BigPawAPI.restoreBackup(f,c);msg.innerHTML=`<div class="notice">復元しました。復元直前DBも ${esc(r.safetyBackup)} として保存しました。</div>`;load()}catch(e){alert(e.message||'復元できませんでした')}}load();</script></body></html>
