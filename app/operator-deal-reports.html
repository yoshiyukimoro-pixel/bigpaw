<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>成約申請管理｜BIG PAW運営</title><link rel="stylesheet" href="assets/style.css"><style>.admin-grid{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.sidebar{background:linear-gradient(180deg,#6d5572,#5b4b62);color:#fff;padding:22px}.sidebar a{display:block;padding:10px 12px;border-radius:10px;margin:4px 0}.sidebar a.active,.sidebar a:hover{background:rgba(255,255,255,.1)}.main{padding:28px}.report{padding:18px 0;border-bottom:1px solid var(--line)}@media(max-width:800px){.admin-grid{grid-template-columns:1fr}.sidebar{display:none}.main{padding:14px}}</style></head><body><div class="admin-grid"><aside class="sidebar"><div class="logo"><span class="logo-mark">🐾</span>BIG PAW</div><p style="opacity:.7">運営管理</p><a href="operator-admin.html">ダッシュボード</a><a class="active" href="operator-deal-reports.html">成約申請</a><a href="operator-deals.html">成約管理</a><a href="operator-invoices.html">請求管理</a><a href="operator-revenue.html">売上・手数料</a><a href="index.html">公開サイト ↗</a></aside><main class="main"><h1>成約申請管理</h1><p class="muted">ブリーダーから届いた「成約・お迎え完了」の申請を確認します。承認すると成約確定し、5%の請求書が自動発行されます。</p><section class="section"><div class="card pad"><div id="rows">読み込み中…</div></div></section></main></div><script src="assets/app.js"></script><script src="assets/api.js"></script><script>
const esc=s=>BigPaw.esc(s), yen=n=>BigPaw.currency(Number(n||0));
async function review(id,action){let note='';if(action==='reject')note=prompt('差し戻し理由を入力してください')||'';if(action==='approve'&&!confirm('成約内容を確認し、成約確定して5%請求書を発行しますか？'))return;try{await BigPawAPI.reviewDealReport(id,{action,reviewNote:note});await load()}catch(e){alert(e.message||'更新できませんでした')}}
async function load(){try{const a=await BigPawAPI.operatorDealReports();rows.innerHTML=a.length?a.map(x=>`<div class="report"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><b>${esc(x.puppy_name)}｜${esc(x.breed)}</b><br><span class="muted">${esc(x.kennel_name)} / 購入者 ${esc(x.buyer_display||'')}<br>申請価格 ${yen(x.final_sale_amount)} / お迎え ${esc(x.pickup_date)}</span></div><div><span class="chip">${x.status==='pending'?'確認待ち':x.status==='approved'?'承認済み':'差し戻し'}</span></div></div>${x.note?`<p>${esc(x.note)}</p>`:''}${x.review_note?`<div class="notice">${esc(x.review_note)}</div>`:''}<div style="margin-top:10px">${x.status==='pending'?`<button class="btn btn-main" onclick="review('${x.id}','approve')">承認して成約確定</button> <button class="btn btn-sub" onclick="review('${x.id}','reject')">差し戻し</button>`:''}${x.invoice_no?`<span class="chip">請求 ${esc(x.invoice_no)} / ${yen(x.fee_amount)}</span>`:''}</div></div>`).join(''):'<p class="muted">成約申請はありません。</p>'}catch(e){rows.innerHTML='運営アカウントでログインしてください。'}}load();
</script><script src="/auth-return-fix.js"></script><style id="bigpaw-role-theme">body{background:#fff7fb!important}body.bigpaw-breeder-theme{background:#f3f8ff!important}body.bigpaw-operator-theme{background:#fffbea!important}</style><script>(function(){var p=location.pathname;if(p.indexOf("/operator-")>=0)document.body.classList.add("bigpaw-operator-theme");else if(p.indexOf("/breeder-")>=0||p.endsWith("/admin.html"))document.body.classList.add("bigpaw-breeder-theme");})();</script></body></html>
