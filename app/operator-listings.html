<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>子犬掲載管理｜BIG PAW運営</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="topbar">🐾 BIG PAW 運営管理</div><header class="site-header"><div class="wrap nav"><a class="logo" href="operator-admin.html"><span class="logo-mark">🐾</span>BIG PAW 運営</a><nav class="navlinks"><a href="operator-admin.html">ダッシュボード</a><a href="operator-breeders.html">ブリーダー管理</a><a href="operator-reports.html">通報</a></nav></div></header><div class="hero-mini"><div class="wrap"><h1>子犬掲載管理</h1><p>承認済みブリーダーの子犬は保存後すぐ公開されます。運営では掲載内容の確認・編集・非公開・再公開を管理できます。</p></div></div><main class="wrap"><section class="section"><div id="summary" class="notice" style="margin-bottom:16px"></div><div class="dog-cards" id="cards"></div></section></main><script src="assets/app.js"></script><script src="assets/api.js"></script><script>const esc=s=>BigPaw.esc(String(s??''));const breederId=new URLSearchParams(location.search).get('breeder')||'';async function review(id,status){const note=status==='rejected'?(prompt('非公開・差し戻し理由を入力')||'掲載内容の再確認をお願いします'):(prompt('運営メモ（任意）')||'');try{await BigPawAPI.reviewListing(id,{reviewStatus:status,moderationNote:note});load()}catch(e){alert('更新できませんでした')}}function actions(p){const id=String(p.id||'').replace(/'/g,"\\'");const edit=`<a class="btn btn-sub" href="breeder-puppy-new.html?id=${encodeURIComponent(p.id)}">編集・確認</a>`;if(p.reviewStatus==='approved')return `${edit}<button class="btn btn-sub" onclick="review('${id}','rejected')">非公開にする</button>`;if(p.reviewStatus==='rejected')return `${edit}<button class="btn btn-main" onclick="review('${id}','approved')">再公開する</button>`;return `${edit}<button class="btn btn-main" onclick="review('${id}','approved')">公開する</button><button class="btn btn-sub" onclick="review('${id}','rejected')">非公開にする</button>`}async function load(){try{let a=await BigPawAPI.operatorListings();if(breederId)a=a.filter(x=>String(x.breederId||'')===String(breederId));const approved=a.filter(x=>x.reviewStatus==='approved').length;const rejected=a.filter(x=>x.reviewStatus==='rejected').length;const pending=a.filter(x=>x.reviewStatus!=='approved'&&x.reviewStatus!=='rejected').length;summary.innerHTML=(breederId?`<a href="operator-breeder-detail.html?id=${encodeURIComponent(breederId)}" style="font-weight:900">← ブリーダー詳細へ戻る</a><br>`:'')+(breederId?'選択したブリーダーのみ表示｜':'')+`掲載 ${a.length}件｜公開中 ${approved}件｜非公開 ${rejected}件｜要確認 ${pending}件`;cards.innerHTML=a.length?a.map(p=>`<div class="card dog-card"><div class="dogpic">${p.imageUrl?`<img src="${esc(p.imageUrl)}" alt="" style="width:100%;height:100%;object-fit:cover">`:'🐾'}</div><div class="body"><span class="status">${esc(p.reviewStatus==='approved'?'公開中':(p.reviewStatus==='rejected'?'非公開':p.reviewStatus||'要確認'))}</span><h3>${esc(p.breed)}｜${esc(p.gender)}</h3><div class="muted">${esc(p.breeder)}・${BigPaw.currency(p.price)}</div><p class="muted">${esc(p.name)}<br>${esc(p.moderationNote||'')}</p><div style="display:flex;gap:8px;flex-wrap:wrap">${actions(p)}</div></div></div>`).join(''):'掲載はありません。'}catch(e){cards.innerHTML='<div class="card pad">運営アカウントでログインしてください。</div>'}}load();</script><script src="/auth-return-fix.js"></script><style id="bigpaw-role-theme">body{background:#fff7fb!important}body.bigpaw-breeder-theme{background:#f3f8ff!important}body.bigpaw-operator-theme{background:#fffbea!important}</style><script>(function(){var p=location.pathname;if(p.indexOf("/operator-")>=0)document.body.classList.add("bigpaw-operator-theme");else if(p.indexOf("/breeder-")>=0||p.endsWith("/admin.html"))document.body.classList.add("bigpaw-breeder-theme");})();</script></body></html>
