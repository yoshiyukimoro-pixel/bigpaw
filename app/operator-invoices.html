<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>成約手数料請求｜BIG PAW運営</title><link rel="stylesheet" href="assets/style.css"></head><body>
<div class="topbar">🐾 BIG PAW 運営管理</div><header class="site-header"><div class="wrap nav"><a class="logo" href="operator-admin.html"><span class="logo-mark">🐾</span>BIG PAW 運営</a><nav class="navlinks"><a href="operator-revenue.html">売上</a><a href="operator-deal-reports.html">成約申請</a><a href="operator-deals.html">成約管理</a></nav></div></header><div class="hero-mini"><div class="wrap"><h1>成約手数料の請求管理</h1><p>お迎え完了時に生体価格の5%（税込）の請求書を自動発行。支払期限は請求日から7日以内です。入金確認後に支払済みへ変更します。期限超過中は当該ブリーダーの公開掲載が自動停止し、入金確認後に自動再開します。</p></div></div><main class="wrap"><section class="section"><div class="card pad"><div id="rows">読み込み中…</div></div></section></main><script src="assets/api.js"></script><script>
const yen=n=>Number(n||0).toLocaleString()+'円';const dt=t=>t?new Date(t*1000).toLocaleDateString('ja-JP'):'-';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function setStatus(id,status){if(!confirm(status==='paid'?'入金確認済みにしますか？':'この請求を取消しますか？'))return;await BigPawAPI.updateOperatorInvoice(id,{status});load()}
async function remind(id){if(!confirm('ブリーダーへ支払い確認の通知を送りますか？'))return;const r=await BigPawAPI.remindOperatorInvoice(id);alert(r.mailSent?'メールとサイト内通知を送信しました。':'サイト内通知を送信しました。SMTP未設定のためメールは送信されていません。')}
async function load(){try{const a=await BigPawAPI.operatorInvoices();const now=Math.floor(Date.now()/1000);rows.innerHTML=a.length?a.map(x=>{const overdue=x.status==='issued'&&Number(x.due_at)<now;const label=x.status==='paid'?'支払済み':x.status==='void'?'取消':overdue?'期限超過':'お支払い待ち';return `<div style="padding:16px 0;border-bottom:1px solid #f1dbe5"><b>${esc(x.invoice_no)}</b>｜${esc(x.kennel_name)} ${x.billing_suspended?'<span class="chip" style="background:#fff0f0;color:#b84c4c">掲載停止中</span> ':''}<span class="chip" style="${overdue?'background:#fff0f0;color:#b84c4c':''}">${label}</span><br><span class="muted">${esc(x.puppy_name)} / 成約額 ${yen(x.sale_amount)} / 料率 ${(x.rate_bps/100).toFixed(2)}%</span><br><strong style="font-size:20px">${yen(x.fee_amount)}</strong> <span class="muted">支払期限 ${dt(x.due_at)}</span><div style="margin-top:9px">${x.status==='issued'?`<button class="btn btn-main" onclick="setStatus('${x.id}','paid')">入金確認</button> <button class="btn btn-sub" onclick="remind('${x.id}')">支払い確認を送る</button> <button class="btn btn-sub" onclick="setStatus('${x.id}','void')">取消</button>`:''}</div></div>`}).join(''):'請求はありません。';}catch(e){rows.innerHTML='運営アカウントでログインしてください。'}}load();
</script><script src="/auth-return-fix.js"></script><style id="bigpaw-role-theme">body{background:#fff7fb!important}body.bigpaw-breeder-theme{background:#f3f8ff!important}body.bigpaw-operator-theme{background:#fffbea!important}</style><script>(function(){var p=location.pathname;if(p.indexOf("/operator-")>=0)document.body.classList.add("bigpaw-operator-theme");else if(p.indexOf("/breeder-")>=0||p.endsWith("/admin.html"))document.body.classList.add("bigpaw-breeder-theme");})();</script></body></html>
