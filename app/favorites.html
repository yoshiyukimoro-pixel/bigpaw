<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>お気に入り｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="topbar">🐾 大型犬専門｜BIG PAW</div><header class="site-header"><div class="wrap nav"><a class="logo" href="index.html"><span class="logo-mark">🐾</span>BIG PAW</a><nav class="navlinks"><a href="search.html">子犬を探す</a><a href="compare.html">比較する</a><a class="nav-cta" href="mypage.html">マイページ</a></nav></div></header><div class="hero-mini"><div class="wrap"><h1>♡ お気に入り</h1><p>気になる大型犬の子犬をまとめて比較。</p></div></div><main class="wrap"><section class="section" id="favArea"><div class="card empty"><h2>読み込み中…</h2></div></section></main><script src="assets/app.js"></script><script src="assets/api.js"></script><script>
function favCard(p){return '<div class="card dog-card"><a href="puppy-detail.html?id='+encodeURIComponent(p.id)+'"><div class="dogpic">'+(p.imageUrl?'<img src="'+BigPaw.esc(p.imageUrl)+'" alt="" style="width:100%;height:100%;object-fit:cover">':'🐾')+'</div><div class="body"><span class="status">'+BigPaw.esc(p.status||'')+'</span><h3>'+BigPaw.esc(p.breed||'')+'｜'+BigPaw.esc(p.gender||'')+'</h3><div class="muted">'+BigPaw.esc(p.area||'')+'・'+BigPaw.esc(p.breeder||'BIGPAW認定ブリーダー')+'</div><b>'+BigPaw.currency(Number(p.price||0))+'</b></div></a><div style="padding:0 15px 15px"><button class="btn btn-sub btn-wide" onclick="removeFav(\''+String(p.id).replace(/'/g,'')+'\')">お気に入りから外す</button></div></div>'}
async function renderFav(){try{const dogs=await BigPawAPI.favorites();favArea.innerHTML=dogs.length?'<div style="display:flex;justify-content:flex-end;margin-bottom:14px"><a class="btn btn-sub" href="compare.html">お気に入りを比較する</a></div><div class="dog-cards">'+dogs.map(favCard).join('')+'</div>':'<div class="card empty"><div class="big">♡</div><h2>まだお気に入りはありません</h2><p class="muted">気になる子を見つけたら♡を押して保存できます。</p><a class="btn btn-main" href="search.html">子犬を探す</a></div>';}catch(e){if(e.status===401){favArea.innerHTML='<div class="card empty"><div class="big">♡</div><h2>ログインするとお気に入りを保存できます</h2><a class="btn btn-main" href="login.html">ログイン</a></div>';}else favArea.innerHTML='<div class="card empty"><h2>お気に入りを読み込めませんでした</h2><button class="btn btn-main" onclick="renderFav()">再読み込み</button></div>';}}
async function removeFav(id){try{await BigPawAPI.toggleFavorite(id);await renderFav();}catch(e){alert('お気に入りを更新できませんでした')}}
renderFav();
</script></body></html>
