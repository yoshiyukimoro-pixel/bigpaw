<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>開示請求・メールアドレス確認｜BIG PAW</title>
<style>
*{box-sizing:border-box}
body{font:16px/1.7 -apple-system,BlinkMacSystemFont,"Hiragino Sans",Meiryo,sans-serif;background:#f7f8fb;color:#17243a;margin:0;padding:20px}
main{max-width:650px;background:white;border:1px solid #e4e9f3;border-radius:16px;padding:28px;margin:8vh auto}
h1{font-size:22px}p{margin:16px 0}
button{border:0;border-radius:10px;background:#1864a0;color:white;font-weight:700;padding:14px 18px;font-size:16px;min-height:48px;cursor:pointer}
button:disabled{background:#8399a7}
#feedback{min-height:28px;padding-top:8px;white-space:pre-wrap}
a{color:#155f9b}
</style></head>
<body><main>
<h1>BIG PAW｜販売者情報の開示請求</h1>
<p>開示をご希望いただいたメールアドレスを確認します。以下のボタンを押すと、ご請求のあった販売業者の住所・電話番号を<strong>このメールの宛先</strong>へ自動送信します。</p>
<p>このページに住所・電話番号を表示することはありません。お心当たりがない場合は操作せずに閉じてください。</p>
<button type="button" id="confirm" disabled>メールアドレスを確認して開示を受け取る</button>
<div id="feedback" role="status" aria-live="polite"></div>
<p><a href="shop-commerce.html">特定商取引法の表示（下書き）へ戻る</a></p>
</main><script>
(()=>{
  const params=new URLSearchParams(location.hash.replace(/^#/,''));
  let token=params.get('token')||'';
  // Fragment tokens are never sent in HTTP request URLs. Clear after load.
  history.replaceState(null,'',location.pathname);
  const button=document.getElementById('confirm');
  const feedback=document.getElementById('feedback');
  if(!/^[A-Za-z0-9_-]{30,200}$/.test(token)){
    feedback.textContent='確認リンクが無効です。開示請求フォームから改めてお申し込みください。';
    return;
  }
  button.disabled=false;
  button.addEventListener('click',async()=>{
    if(button.disabled)return;
    button.disabled=true;
    button.textContent='送信の受付を確認しています…';
    feedback.textContent='';
    const selected=token;
    token='';
    try{
      const res=await fetch('/api/shop/seller-disclosure/confirm',{
        method:'POST',headers:{'Content-Type':'application/json','Cache-Control':'no-store'},
        credentials:'same-origin',body:JSON.stringify({token:selected}),cache:'no-store'
      });
      const data=await res.json().catch(()=>({}));
      if(res.ok&&data.status==='provider_accepted'){
        feedback.textContent='メール配信サービスが開示情報の送信を受け付けました。確認されたメールアドレスの受信箱をご確認ください。';
      }else if(data.error==='invalid_or_expired'){
        feedback.textContent='確認リンクは無効または期限切れです。再度、開示請求フォームから請求してください。';
      }else{
        feedback.textContent='送信状況を確認できませんでした。誤って重複送信しないため再送は行いません。info@bigpaw.site へお問い合わせください。';
      }
    }catch(_){
      feedback.textContent='送信結果が不明です。重複送信を防ぐため自動で再試行しません。info@bigpaw.site へお問い合わせください。';
    }finally{
      button.textContent='送信受付の確認が終了しました';
    }
  });
})();
</script></body></html>
