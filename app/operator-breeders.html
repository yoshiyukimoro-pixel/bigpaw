<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ブリーダー管理｜BIG PAW運営</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="topbar">🐾 BIG PAW 運営管理</div><header class="site-header"><div class="wrap nav"><a class="logo" href="operator-admin.html"><span class="logo-mark">🐾</span>BIG PAW 運営</a><nav class="navlinks"><a href="operator-admin.html">ダッシュボード</a><a href="operator-listings.html">子犬掲載管理</a><a href="operator-reports.html">通報</a></nav></div></header><div class="hero-mini"><div class="wrap"><h1>ブリーダー管理</h1><p>新規申請の審査と、承認済みブリーダーの登録情報・掲載状況を管理します。</p></div></div><main class="wrap"><section class="section"><div class="card pad"><div class="chips" style="margin-bottom:14px"><span class="chip">審査待ち</span><span class="chip">承認済み</span><span class="chip">差し戻し</span></div><div id="registeredBreederBox" class="card pad" style="margin-bottom:14px"><b>登録済みブリーダー</b><p class="muted">犬舎名・所在地・管理IDを確認し、「管理・詳細を見る」からそのブリーダーだけに絞って管理できます。</p><div id="registeredBreeders" class="tablelike"><div class="table-row"><div>読み込み中</div><div>登録済みブリーダーを確認しています…</div></div></div></div><div class="card pad" style="margin-bottom:14px"><b>全体管理</b><p class="muted">全ブリーダー横断で確認する場合はこちら。個別管理は上の登録済みブリーダーから詳細を開いてください。</p><div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn btn-sub" href="operator-listings.html">全子犬掲載</a><a class="btn btn-sub" href="messages.html?mode=operator">全問い合わせ</a><a class="btn btn-sub" href="operator-deals.html">全成約</a><a class="btn btn-sub" href="operator-revenue.html">全売上・手数料</a></div></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px"><input id="breederSearch" placeholder="犬舎名・代表者・都道府県・管理IDで検索" style="flex:1;min-width:240px"><button class="btn btn-sub" type="button" onclick="load()">検索</button></div><div id="apps" class="tablelike"><div class="table-row"><div>読み込み中</div><div>申請データを確認しています…</div></div></div></div></section></main><script src="assets/api.js"></script><script>
const label=s=>({pending:'審査待ち',approved:'承認済み',rejected:'差し戻し'}[s]||s);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadRegistered(q=''){if(!BigPawAPI.isLive()){registeredBreeders.innerHTML='<div class="table-row"><div>デモ</div><div>サーバー起動時に登録済みブリーダーが表示されます。</div></div>';return}try{const r=await fetch('/api/breeders',{credentials:'same-origin'});if(!r.ok)throw new Error('breeders');const pubs=await r.json();const rows=(await Promise.all((Array.isArray(pubs)?pubs:[]).map(async b=>{try{const rr=await fetch('/api/breeder-profile?id='+encodeURIComponent(b.id),{credentials:'same-origin'});if(!rr.ok)return null;return await rr.json()}catch(_e){return null}}))).filter(Boolean);const filtered=q?rows.filter(b=>[b.kennel_name,b.prefecture,b.id,b.registration_no].some(v=>String(v||'').toLowerCase().includes(q))):rows;registeredBreeders.innerHTML=filtered.length?filtered.map(b=>`<div class="table-row"><div><b>${esc(b.kennel_name||'名称未設定')}</b></div><div><span class="muted">${esc(b.prefecture||'所在地未設定')}　｜　${esc(label(b.review_status||'approved'))}</span><br><span class="muted">管理ID：${esc(b.id||'')}</span><div style="margin-top:8px"><a class="btn btn-sub" href="operator-breeder-detail.html?id=${encodeURIComponent(b.id||'')}">管理・詳細を見る</a></div></div></div>`).join(''):'<div class="table-row"><div>登録済み</div><div>該当するブリーダーはいません。</div></div>'}catch(e){registeredBreeders.innerHTML='<div class="table-row"><div>確認できません</div><div>登録済みブリーダーを読み込めませんでした。</div></div>'}}
async function load(){const q=(document.getElementById('breederSearch')?.value||'').trim().toLowerCase();if(!BigPawAPI.isLive()){apps.innerHTML='<div class="table-row"><div>デモ</div><div>サーバー起動時に実申請が表示されます。</div></div>';await loadRegistered(q);return}try{let rows=await BigPawAPI.breederApplications();if(q)rows=rows.filter(a=>[a.kennel_name,a.representative,a.prefecture,a.id,a.email].some(v=>String(v||'').toLowerCase().includes(q)));apps.innerHTML=rows.length?rows.map(a=>`<div class="table-row"><div>${label(a.status)}</div><div><b>${esc(a.kennel_name)}</b>｜${esc(a.primary_breed)}<br><span class="muted">管理ID：${esc(a.id)}</span><br><span class="muted">代表：${esc(a.representative)}　${esc(a.prefecture)}<br>登録番号：${esc(a.registration_no)}　有効期限：${esc(a.expires_on)}<br>${esc(a.email)}</span>${a.registration_proof_url?'<div style=\"margin-top:10px\"><a class=\"btn btn-sub proof-link\" target=\"_blank\" rel=\"noopener\" href=\"'+esc(a.registration_proof_url)+'\">第一種動物取扱業 登録証の写しを確認</a></div>':''}${a.status==='pending'?`<div style="display:flex;gap:8px;margin-top:10px"><button class="btn btn-main" onclick="review('${a.id}','approved')">承認</button><button class="btn btn-sub" onclick="review('${a.id}','rejected')">差し戻し</button></div>`:''}${a.review_note?`<div class="notice" style="margin-top:8px">${esc(a.review_note)}</div>`:''}</div></div>`).join(''):'<div class="table-row"><div>申請</div><div>審査待ちの申請はありません。</div></div>'}catch(e){apps.innerHTML='<div class="table-row"><div>権限</div><div>運営アカウントでログインしてください。</div></div>'}await loadRegistered(q)}async function review(id,status){let note='';if(status==='rejected')note=prompt('差し戻し理由を入力してください')||'';try{await BigPawAPI.updateBreederApplication(id,{status,reviewNote:note});await load()}catch(e){alert('更新できませんでした')}}load();
</script><script src="/auth-return-fix.js"></script><style id="bigpaw-role-theme">body{background:#fff7fb!important}body.bigpaw-breeder-theme{background:#f3f8ff!important}body.bigpaw-operator-theme{background:#fffbea!important}</style><script>(function(){var p=location.pathname;if(p.indexOf("/operator-")>=0)document.body.classList.add("bigpaw-operator-theme");else if(p.indexOf("/breeder-")>=0||p.endsWith("/admin.html"))document.body.classList.add("bigpaw-breeder-theme");})();</script></body></html>
