<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>通報・違反対応｜BIG PAW運営</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="topbar">🐾 BIG PAW 運営管理</div><header class="site-header"><div class="wrap nav"><a class="logo" href="operator-admin.html"><span class="logo-mark">🐾</span>BIG PAW 運営</a><nav class="navlinks"><a href="operator-admin.html">ダッシュボード</a><a href="operator-breeders.html">ブリーダー審査</a><a href="operator-listings.html">掲載審査</a></nav></div></header><div class="hero-mini"><div class="wrap"><h1>通報・違反対応</h1><p>利用者から届いた報告を記録し、対応状況を管理。</p></div></div><main class="wrap"><section class="section"><div class="card pad"><div id="rows">読み込み中…</div></div></section></main><script src="assets/api.js"></script><script>function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function setStatus(id,status){await BigPawAPI.updateReport(id,{status});load()}async function load(){try{const a=await BigPawAPI.reports();rows.innerHTML=a.length?a.map(x=>`<div style="padding:16px 0;border-bottom:1px solid #f1dbe5"><b>${esc(x.reason)}</b> <span class="chip">${esc(x.status)}</span><br><span class="muted">${esc(x.puppy_name||x.kennel_name||'対象未指定')}</span><p>${esc(x.detail)}</p><div style="display:flex;gap:8px"><button class="btn btn-sub" onclick="setStatus('${x.id}','reviewing')">確認中</button><button class="btn btn-main" onclick="setStatus('${x.id}','resolved')">解決</button><button class="btn btn-sub" onclick="setStatus('${x.id}','dismissed')">対象外</button></div></div>`).join(''):'通報はありません。'}catch(e){rows.innerHTML='運営アカウントでログインしてください。'}}load();</script><script src="/auth-return-fix.js"></script><style id="bigpaw-role-theme">body{background:#fff7fb!important}body.bigpaw-breeder-theme{background:#f3f8ff!important}body.bigpaw-operator-theme{background:#fffbea!important}</style><script>(function(){var p=location.pathname;if(p.indexOf("/operator-")>=0)document.body.classList.add("bigpaw-operator-theme");else if(p.indexOf("/breeder-")>=0||p.endsWith("/admin.html"))document.body.classList.add("bigpaw-breeder-theme");})();</script></body></html>
