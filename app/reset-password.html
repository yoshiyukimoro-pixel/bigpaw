<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>新しいパスワード｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="topbar">🐾 BIG PAW</div><header class="site-header"><div class="wrap nav"><a class="logo" href="index.html"><span class="logo-mark">🐾</span>BIG PAW</a></div></header><main class="wrap"><section class="section" style="max-width:600px;margin:auto"><form class="card pad" onsubmit="save(event)"><h1>新しいパスワード</h1><div class="field"><label>新しいパスワード（8文字以上）</label><input id="pw" type="password" minlength="8" required></div><div class="field"><label>確認</label><input id="pw2" type="password" minlength="8" required></div><div id="msg"></div><button class="btn btn-main btn-wide">変更する</button></form></section></main><script src="assets/api.js"></script><script>const token=new URLSearchParams(location.search).get('token')||'';async function save(e){e.preventDefault();if(pw.value!==pw2.value){msg.innerHTML='<p style="color:#c65584">パスワードが一致しません。</p>';return}try{await BigPawAPI.confirmPasswordReset(token,pw.value);msg.innerHTML='<div class="notice">変更しました。ログインし直してください。</div><a class="btn btn-main btn-wide" href="login.html" style="margin-top:12px">ログインへ</a>'}catch(x){msg.innerHTML='<p style="color:#c65584">リンクが無効か期限切れです。</p>'}}</script></body></html>
