<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大型犬の飼育費シミュレーター｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"><style>.result{font-size:38px;font-weight:900;color:#c14f7e}.range{width:100%;accent-color:#ef7fa8}</style></head><body><div class="topbar">🐾 大型犬を迎える前の費用チェック｜BIG PAW</div><header class="site-header"><div class="wrap nav"><a class="logo" href="index.html"><span class="logo-mark">🐾</span>BIG PAW</a><nav class="navlinks"><a href="breed-guide.html">犬種ガイド</a><a href="match.html">相性チェック</a><a class="nav-cta" href="index.html#puppies">子犬を探す</a></nav></div></header><div class="hero-mini"><div class="wrap"><h1>大型犬 飼育費シミュレーター</h1><p>フード・トリミング・保険・医療予備費などを自分の条件で計算。</p></div></div><main class="wrap"><section class="section"><div class="grid two"><div class="card pad"><div class="field"><label>犬種</label><select id="breed" onchange="preset()"><option value="standard">スタンダードプードル</option><option value="golden">ゴールデンレトリバー</option><option value="lab">ラブラドール</option><option value="bernese">バーニーズ</option><option value="husky">ハスキー</option><option value="samoyed">サモエド</option></select></div><div class="field"><label>フード代（月）</label><input id="food" type="number" value="15000" oninput="calc()"></div><div class="field"><label>トリミング・シャンプー等（月平均）</label><input id="groom" type="number" value="12000" oninput="calc()"></div><div class="field"><label>ペット保険（月）</label><input id="insurance" type="number" value="5000" oninput="calc()"></div><div class="field"><label>予防薬・ワクチン・健康診断（月平均）</label><input id="medical" type="number" value="5000" oninput="calc()"></div><div class="field"><label>おやつ・消耗品・その他（月）</label><input id="other" type="number" value="5000" oninput="calc()"></div></div><aside><div class="card pad sticky"><h2>月額目安</h2><div class="result" id="monthly">42,000円</div><p class="muted">年間：約 <b id="yearly">504,000円</b></p><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h2>10年間の単純計算</h2><div class="price" id="tenyear">5,040,000円</div><div class="notice" style="margin-top:14px">これは生活設計用の簡易計算です。病気・手術・介護、地域差、フードの種類、トリミング頻度などで大きく変わります。</div></div></aside></div></section></main><script>const presets={standard:[15000,12000,5000,5000,5000],golden:[16000,5000,5000,5000,5000],lab:[16000,4000,5000,5000,5000],bernese:[20000,6000,6000,6000,6000],husky:[17000,6000,5000,5000,5000],samoyed:[18000,9000,6000,5000,6000]};function preset(){let a=presets[document.getElementById('breed').value];['food','groom','insurance','medical','other'].forEach((id,i)=>document.getElementById(id).value=a[i]);calc()}function calc(){let m=['food','groom','insurance','medical','other'].reduce((s,id)=>s+(Number(document.getElementById(id).value)||0),0);document.getElementById('monthly').textContent=m.toLocaleString()+'円';document.getElementById('yearly').textContent=(m*12).toLocaleString()+'円';document.getElementById('tenyear').textContent=(m*120).toLocaleString()+'円'}calc()</script></body></html>
