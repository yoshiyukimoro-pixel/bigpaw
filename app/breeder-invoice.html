<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>請求書｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"><style>
.invoice{max-width:850px;margin:28px auto;background:#fff;border:1px solid #eadbe3;border-radius:18px;padding:34px;box-shadow:0 12px 34px rgba(90,70,85,.08)}
.inv-head{display:flex;justify-content:space-between;gap:24px;align-items:flex-start}.inv-title{font-size:34px;letter-spacing:.12em;margin:0}.right{text-align:right}.amount{font-size:32px;font-weight:900;margin:12px 0}.invoice-table{width:100%;border-collapse:collapse;margin:24px 0}.invoice-table th,.invoice-table td{padding:12px;border-bottom:1px solid #eadbe3;text-align:left}.invoice-table th:last-child,.invoice-table td:last-child{text-align:right}.totals{margin-left:auto;max-width:380px}.total-row{display:flex;justify-content:space-between;padding:8px 0}.grand{font-size:20px;font-weight:900;border-top:2px solid #5b4b62;margin-top:6px;padding-top:12px}.bank{background:#fff7fb;border:1px solid #f0dbe5;border-radius:14px;padding:16px;margin-top:24px}.actions{max-width:850px;margin:20px auto;display:flex;gap:10px;justify-content:flex-end}
@media(max-width:640px){.invoice{margin:12px;padding:20px}.inv-head{display:block}.right{text-align:left;margin-top:18px}.inv-title{font-size:28px}.amount{font-size:27px}.actions{margin:12px}.invoice-table th:nth-child(2),.invoice-table td:nth-child(2){display:none}}
@media print{body{background:#fff}.topbar,.site-header,.actions{display:none!important}.invoice{box-shadow:none;border:0;margin:0;max-width:none;padding:10mm}.bank{break-inside:avoid}}
</style></head><body>
<div class="topbar">🐾 大型犬専門｜BIG PAW</div><header class="site-header"><div class="wrap nav"><a class="logo" href="admin.html"><span class="logo-mark">🐾</span>BIG PAW</a><nav class="navlinks"><a href="breeder-billing.html">請求・お支払い</a></nav></div></header>
<div class="actions"><a class="btn btn-sub" href="breeder-billing.html">← 請求一覧</a><button class="btn btn-main" onclick="window.print()">印刷 / PDF保存</button></div>
<main id="doc" class="invoice"><p>読み込み中…</p></main>
<script src="assets/api.js"></script><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP');
const date=n=>n?new Date(Number(n)*1000).toLocaleDateString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit'}):'-';
(async()=>{try{
 const id=new URLSearchParams(location.search).get('id'); if(!id)throw new Error('請求書IDがありません。');
 const [list,cfg]=await Promise.all([BigPawAPI.breederInvoices(),BigPawAPI.breederBillingConfig()]);
 const x=list.find(v=>v.id===id); if(!x)throw new Error('請求書が見つかりません。');
 const total=Number(x.fee_amount||0); const tax=Math.floor(total*10/110); const net=total-tax;
 const bank=[cfg.bankName,cfg.bankBranch,cfg.bankAccountType,cfg.bankAccountNo].filter(Boolean).join('　');
 const issuerAddress=[cfg.postal?('〒'+cfg.postal):'',cfg.address].filter(Boolean).join(' ');
 doc.innerHTML=`
 <div class="inv-head"><div><h1 class="inv-title">請 求 書</h1><p style="font-size:20px;margin:28px 0 4px"><b>${esc(x.kennel_name||'ブリーダー')} 御中</b></p><p class="muted">下記の通りご請求申し上げます。</p></div><div class="right"><b>${esc(cfg.issuerName||'BIG PAW運営')}</b><br>${issuerAddress?esc(issuerAddress)+'<br>':''}${cfg.invoiceRegistrationNo?'登録番号 '+esc(cfg.invoiceRegistrationNo)+'<br>':''}<span class="muted">請求番号 ${esc(x.invoice_no)}</span><br><span class="muted">発行日 ${date(x.issued_at)}</span></div></div>
 <div style="margin-top:30px"><span class="muted">ご請求金額（税込）</span><div class="amount">${yen(total)}</div><b>支払期限：${date(x.due_at)}</b> <span class="chip">請求日から7日以内</span></div>
 <table class="invoice-table"><thead><tr><th>内容</th><th>対象</th><th>金額</th></tr></thead><tbody><tr><td>BIG PAW 成約手数料 5%（税込）</td><td>${esc(x.puppy_name)} / ${esc(x.breed)}<br><span class="muted">生体販売価格 ${yen(x.sale_amount)}</span></td><td>${yen(total)}</td></tr></tbody></table>
 <div class="totals"><div class="total-row"><span>税抜相当額</span><b>${yen(net)}</b></div><div class="total-row"><span>消費税相当額（10%）</span><b>${yen(tax)}</b></div><div class="total-row grand"><span>合計（税込）</span><span>${yen(total)}</span></div></div>
 <div class="bank"><b>お振込先</b><p>${bank?esc(bank):'公開前にBIG PAW運営の振込先口座を設定してください。'}${cfg.bankAccountHolder?'<br>口座名義　'+esc(cfg.bankAccountHolder):''}</p><small class="muted">振込手数料はブリーダー様のご負担となります。請求番号をお控えください。</small></div>
 <p class="muted" style="margin-top:22px">ステータス：${x.status==='paid'?'支払済み':x.status==='void'?'取消':'お支払い待ち'}</p>`;
}catch(e){doc.innerHTML=`<h2>請求書を表示できません</h2><p class="muted">${esc(e.message||'ブリーダーアカウントでログインしてください。')}</p>`}})();
</script></body></html>
