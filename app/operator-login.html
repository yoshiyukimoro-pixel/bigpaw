<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>運営ログイン｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"><style>html,body{background:#fffbea!important}.operator-note{background:#fff6c9;border:1px solid #ead16a;border-radius:14px;padding:14px;margin-bottom:16px;color:#665100}</style></head><body><div class="topbar">🐾 BIG PAW｜運営専用</div><header class="site-header"><div class="wrap nav"><a class="logo" href="index.html"><span class="logo-mark">🐾</span>BIG PAW</a></div></header><main class="wrap"><section class="section" style="max-width:560px;margin:auto"><form class="card pad" onsubmit="doOperatorLogin(event)"><h1>運営ログイン</h1><div class="operator-note">BIG PAW運営アカウント専用の入口です。</div><div class="field"><label>運営メールアドレス</label><input id="email" required type="email" autocomplete="email"></div><div class="field"><label>パスワード</label><input id="password" required type="password" autocomplete="current-password"></div><div id="err" style="color:#c65584;font-weight:800;margin-bottom:10px"></div><button class="btn btn-main btn-wide">運営管理へログイン</button><a class="btn btn-sub btn-wide" style="margin-top:12px" href="login.html">購入希望者・ブリーダーのログインへ</a></form></section></main><script src="assets/app.js"></script><script src="assets/api.js"></script><script src="assets/bridge.js"></script><script>
async function clearSession(){try{await fetch('/api/logout',{method:'POST',credentials:'include'})}catch(e){}}
async function doOperatorLogin(e){e.preventDefault();err.textContent='';try{const r=await BigPawBridge.login(email.value.trim(),password.value);const role=r?.user?.role||r?.role||'';if(role!=='operator'){await clearSession();err.textContent='この入口はBIG PAW運営アカウント専用です。';return}location.href='operator-admin.html'}catch(x){err.textContent='メールアドレスまたはパスワードが違います'}}
</script><script src="/auth-return-fix.js"></script></body></html>
