<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>見学・問い合わせ｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="topbar">🐾 大型犬専門｜BIG PAW</div><header class="site-header"><div class="wrap nav"><a class="logo" href="index.html"><span class="logo-mark">🐾</span>BIG PAW</a><nav class="navlinks"><a href="search.html">子犬を探す</a><a href="breeders.html">ブリーダー</a><a href="favorites.html">♡ お気に入り</a><a class="nav-cta" href="mypage.html">マイページ</a></nav></div></header><div class="hero-mini"><div class="wrap"><h1>見学・問い合わせ</h1><p id="puppyLabel">気になる子についてブリーダーへ相談</p></div></div><main class="wrap"><section class="section"><div class="grid two"><form id="inquiryForm" class="card pad" onsubmit="sendInquiry(event)"><div class="stepbar"><div class="step active">1. 内容入力</div><div class="step">2. 送信</div><div class="step">3. 日程調整</div><div class="step">4. 見学確定</div></div><div id="puppyError" class="notice" style="display:none;margin-bottom:14px"></div><div class="form-grid"><div class="field"><label>お名前 *</label><input id="name" required placeholder="例：山田 太郎"></div><div class="field"><label>電話番号 *</label><input id="phone" required inputmode="tel" placeholder="090-0000-0000"></div><div class="field"><label>メールアドレス *</label><input id="email" required type="email"></div><div class="field"><label>希望内容 *</label><select id="kind"><option>現地で見学を希望</option><option>この子について質問</option><option>お迎え時期について相談</option><option>その他</option><option value="オンライン見学を希望">オンライン見学を希望</option></select></div><div class="field"><label>第1希望日</label><input id="date1" type="date"><label style="display:block;margin-top:10px">第1希望時間<input id="preferredTime1" name="preferredtime1" type="time"></label></div><div class="field"><label>第2希望日</label><input id="date2" type="date"><label style="display:block;margin-top:10px">第2希望時間<input id="preferredTime2" name="preferredtime2" type="time"></label></div></div><div class="field"><label>メッセージ</label><textarea id="message" placeholder="家族構成、先住犬、大型犬の飼育経験なども書けます。"></textarea></div><label style="display:flex;gap:8px;font-size:13px"><input type="checkbox" required> 利用規約・プライバシーポリシーに同意する</label><button id="submitInquiryBtn" class="btn btn-main btn-wide" style="margin-top:16px">送信する</button></form><aside><div class="card pad sticky"><h2>お問い合わせ前に</h2><div class="list"><div class="list-item"><span class="tick">✓</span><div>見学日時はブリーダーと調整</div></div><div class="list-item"><span class="tick">✓</span><div>大型犬の飼育環境について相談可能</div></div><div class="list-item"><span class="tick">✓</span><div>契約前に必要な確認・説明へ進む</div></div></div><div class="notice" style="margin-top:14px">見学希望を送信すると、そのまま日程調整へ進みます。</div></div></aside></div></section></main><script src="assets/app.js"></script><script src="assets/api.js"></script><script src="assets/bridge.js"></script><script>
const qp=new URLSearchParams(location.search),pid=qp.get('id')||qp.get('puppy')||'';let p=null,puppyReady=false;
function disableInquiry(reason){puppyReady=false;puppyLabel.textContent=reason;puppyError.textContent=reason+' 子犬詳細ページから「見学・問い合わせ」を押し直してください。';puppyError.style.display='block';submitInquiryBtn.disabled=true;submitInquiryBtn.textContent='子犬を選択してください'}
(async()=>{if(!pid){disableInquiry('子犬情報が選択されていません。');return}try{p=await BigPawBridge.puppy(pid);if(!p)throw new Error('not found');puppyReady=true;puppyLabel.textContent=p.breeder+'｜'+p.breed+' '+p.color+'の'+p.gender;const u=await BigPawBridge.me().catch(()=>null);if(u){name.value=((u.last||'')+' '+(u.first||'')).trim();email.value=u.email||''}}catch(e){disableInquiry('子犬情報を読み込めませんでした。')}})();
async function sendInquiry(e){e.preventDefault();if(!pid||!p||!puppyReady){disableInquiry('子犬情報を読み込めませんでした。');return}try{const details=[kind.value];if(date1.value)details.push('第1希望 '+date1.value+(preferredTime1.value?' '+preferredTime1.value:''));if(date2.value)details.push('第2希望 '+date2.value+(preferredTime2.value?' '+preferredTime2.value:''));if(message.value.trim())details.push(message.value.trim());const created=await BigPawBridge.addInquiry({puppyId:p.id,name:name.value,phone:phone.value,email:email.value,kind:kind.value,preferredDate:date1.value,message:details.join('\n')});const inquiryId=created&&created.id?String(created.id):'';if(!inquiryId)throw new Error('inquiry_not_created');alert(kind.value==='現地で見学を希望'?'見学申込みを送信しました。続けて日程を確認してください。':'問い合わせを送信しました');if(kind.value==='現地で見学を希望'){location.href='visit-confirm.html?inquiry='+encodeURIComponent(inquiryId);return}location.href='messages.html?inquiry='+encodeURIComponent(inquiryId)}catch(x){alert(x.status===401?'問い合わせには会員ログインが必要です。':'送信できませんでした。時間をおいてもう一度お試しください。')}}
</script><script id="buyerProfileAutofill">
(async()=>{try{const r=await fetch("/api/me",{credentials:"same-origin"});if(!r.ok)return;const z=await r.json(),u=z.user||z||{};
const inputs=[...document.querySelectorAll("input")],find=(types)=>inputs.find(e=>types.includes((e.name||e.id||"").toLowerCase())||types.some(k=>(e.placeholder||"").toLowerCase().includes(k)));
const set=(e,v)=>{if(e&&!e.value&&v)e.value=v};
set(find(["name","buyername","fullname"]),[u.last,u.first].filter(Boolean).join(" ").trim()||u.name||"");
set(find(["phone","tel","telephone"]),u.phone||u.tel||"");
set(find(["email","mail"]),u.email||"");
}catch(e){console.error("buyer autofill",e)}})();
</script></body></html>
