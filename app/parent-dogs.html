<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>親犬管理｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"><style>.parent-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.parentpic{height:170px;background:linear-gradient(145deg,#ffe7ef,#f4d3e0);display:grid;place-items:center;font-size:72px;overflow:hidden}.parentpic img{width:100%;height:100%;object-fit:cover}.modal{position:fixed;inset:0;background:rgba(86,58,80,.45);display:none;place-items:center;padding:18px}.modal.show{display:grid}.box{background:#fff;width:min(620px,100%);max-height:90vh;overflow:auto;border-radius:22px;padding:22px}@media(max-width:700px){.parent-grid{grid-template-columns:1fr}}</style></head><body><div class="topbar">🐾 BIG PAW ブリーダー管理</div><header class="site-header"><div class="wrap nav"><a class="logo" href="admin.html"><span class="logo-mark">🐾</span>BIG PAW 管理</a><nav class="navlinks"><a href="admin.html">子犬管理</a><a href="breeder-inquiries.html">問い合わせ</a><a href="health-records.html">健康情報</a></nav></div></header><div class="hero-mini"><div class="wrap"><h1>親犬管理</h1><p>親犬の体格・毛色・遺伝子・健康情報を子犬ページへ紐づけます。</p></div></div><main class="wrap"><section class="section"><div style="display:flex;justify-content:flex-end;margin-bottom:14px"><button class="btn btn-main" onclick="openModal()">＋ 親犬を登録</button></div><div id="parentList" class="parent-grid"></div></section></main><div class="modal" id="modal"><form class="box" onsubmit="saveParent(event)"><h2>親犬を登録</h2><div class="form-grid"><div class="field"><label>名前 *</label><input id="pdName" required></div><div class="field"><label>父犬 / 母犬</label><select id="pdSex"><option>父犬</option><option>母犬</option></select></div><div class="field"><label>犬種</label><input id="pdBreed" placeholder="例：スタンダードプードル"></div><div class="field"><label>毛色</label><input id="pdColor" placeholder="例：ブラック"></div><div class="field"><label>体高 cm</label><input id="pdHeight" type="number" step="0.1"></div><div class="field"><label>体重 kg</label><input id="pdWeight" type="number" step="0.1"></div></div><div class="field"><label>遺伝子情報</label><textarea id="pdGenetics"></textarea></div><div class="field"><label>健康情報の概要</label><textarea id="pdHealth"></textarea></div><div class="field"><label>メモ</label><textarea id="pdNotes"></textarea></div><div style="display:flex;gap:10px;justify-content:flex-end"><button type="button" class="btn btn-sub" onclick="closeModal()">キャンセル</button><button class="btn btn-main">登録する</button></div></form></div><script src="assets/app.js"></script><script src="assets/api.js"></script><script>
function card(d){return `<div class="card"><div class="parentpic">🐩</div><div class="pad"><div class="chips"><span class="chip">${BigPaw.esc(d.sex)}</span><span class="chip">${BigPaw.esc(d.color||'')}</span></div><h2>${BigPaw.esc(d.name)}</h2><div class="fact-grid"><div class="fact"><span>犬種</span><b>${BigPaw.esc(d.breed||'-')}</b></div><div class="fact"><span>体高</span><b>${d.height_cm||'-'}cm</b></div><div class="fact"><span>体重</span><b>${d.weight_kg||'-'}kg</b></div><div class="fact"><span>健康情報</span><b>${BigPaw.esc(d.health_summary||'未登録')}</b></div></div><p class="muted">${BigPaw.esc(d.genetics||'')}</p><a class="btn btn-sub btn-wide" href="health-records.html?parentDogId=${encodeURIComponent(d.id)}">健康・検査記録を見る</a></div></div>`}
async function load(){try{const list=await BigPawAPI.parentDogs();parentList.innerHTML=list.length?list.map(card).join(''):'<div class="card empty" style="grid-column:1/-1"><h2>親犬はまだ登録されていません</h2><p class="muted">「＋ 親犬を登録」から登録できます。</p></div>'}catch(e){if(e.status===401||e.status===403){parentList.innerHTML='<div class="card empty" style="grid-column:1/-1"><h2>ブリーダーログインが必要です</h2><a class="btn btn-main" href="login.html">ログイン</a></div>'}else{parentList.innerHTML='<div class="card empty" style="grid-column:1/-1"><h2>親犬情報を読み込めませんでした</h2><button class="btn btn-sub" onclick="load()">再読み込み</button></div>'}}}
function openModal(){modal.classList.add('show')}function closeModal(){modal.classList.remove('show')}async function saveParent(e){e.preventDefault();try{await BigPawAPI.addParentDog({name:pdName.value,sex:pdSex.value,breed:pdBreed.value,color:pdColor.value,heightCm:Number(pdHeight.value)||null,weightKg:Number(pdWeight.value)||null,genetics:pdGenetics.value,healthSummary:pdHealth.value,notes:pdNotes.value});closeModal();e.target.reset();load()}catch(x){alert(x.status===401||x.status===403?'ブリーダーとしてログインしてください。':'保存できませんでした')}}load();
</script></body></html>
