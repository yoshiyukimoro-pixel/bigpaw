<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>健康状態｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"><style>.health-box{max-width:620px}.current-status{margin:14px 0;padding:14px 16px;border-radius:14px;background:#f7f7fb}.current-status b{font-size:18px}.status-good{font-weight:900}.status-notgood{font-weight:900}@media(max-width:640px){.health-actions{display:block!important}.health-actions .btn{width:100%;margin-top:12px}}</style></head><body><div class="topbar">🐾 BIG PAW ブリーダー管理</div><header class="site-header"><div class="wrap nav"><a class="logo" href="admin.html"><span class="logo-mark">🐾</span>BIG PAW 管理</a><nav class="navlinks"><a href="admin.html">子犬管理</a><a href="parent-dogs.html">親犬</a><a href="breeder-inquiries.html">問い合わせ</a></nav></div></header><div class="hero-mini"><div class="wrap"><h1>健康状態</h1><p>犬を選んで、現在の健康状態を登録します。</p></div></div><main class="wrap"><section class="section"><div class="card pad health-box"><div class="field"><label>犬を選択</label><select id="targetSelect"><option value="">読み込み中…</option></select></div><div id="healthForm" style="display:none;margin-top:20px"><div class="current-status"><span class="muted">現在の登録</span><div><b id="currentStatus">未登録</b></div></div><div class="health-actions" style="display:flex;gap:12px;align-items:end"><div class="field" style="flex:1;margin:0"><label>健康状態</label><select id="healthStatus"><option value="良好">良好</option><option value="良好ではない">良好ではない</option></select></div><button id="saveBtn" class="btn btn-main" onclick="saveHealthStatus()">保存する</button></div></div><div id="emptyState" class="empty"><h2>犬を選択してください</h2></div></div></section></main><script src="assets/app.js"></script><script src="assets/api.js"></script><script>
const qp=new URLSearchParams(location.search);let activePuppyId=qp.get('puppyId')||'',activeParentId=qp.get('parentDogId')||'';
function selectedKey(){return activePuppyId?'puppy:'+activePuppyId:activeParentId?'parent:'+activeParentId:''}
function setTargetFromKey(v){activePuppyId='';activeParentId='';if(v.startsWith('puppy:'))activePuppyId=v.slice(6);else if(v.startsWith('parent:'))activeParentId=v.slice(7);const q=new URLSearchParams();if(activePuppyId)q.set('puppyId',activePuppyId);if(activeParentId)q.set('parentDogId',activeParentId);history.replaceState(null,'',location.pathname+(q.toString()?'?'+q:''))}
async function loadTargets(){try{const [puppies,parents]=await Promise.all([BigPawAPI.breederPuppies(),BigPawAPI.parentDogs()]);const opts=[];for(const p of puppies)opts.push({value:'puppy:'+p.id,label:'子犬｜'+(p.name||p.breed||p.id)});for(const p of parents)opts.push({value:'parent:'+p.id,label:'親犬｜'+(p.name||p.id)+(p.sex?'（'+p.sex+'）':'')});targetSelect.innerHTML='<option value="">選択してください</option>'+opts.map(o=>`<option value="${BigPaw.esc(o.value)}">${BigPaw.esc(o.label)}</option>`).join('');let key=selectedKey();if(key&&!opts.some(o=>o.value===key))key='';if(!key&&opts.length===1)key=opts[0].value;targetSelect.value=key;setTargetFromKey(key);await loadStatus()}catch(e){targetSelect.innerHTML='<option value="">読み込めませんでした</option>';emptyState.innerHTML='<h2>犬の情報を読み込めませんでした</h2>'}}
async function loadStatus(){const key=selectedKey();if(!key){healthForm.style.display='none';emptyState.style.display='block';return}healthForm.style.display='block';emptyState.style.display='none';currentStatus.textContent='読み込み中…';try{const list=await BigPawAPI.healthRecords(activeParentId?{parentDogId:activeParentId}:{puppyId:activePuppyId});const rec=list.find(r=>String(r.category||'')==='健康状態'&&['良好','良好ではない'].includes(String(r.result||'')))||list.find(r=>['良好','良好ではない'].includes(String(r.result||'')));if(rec){currentStatus.textContent=rec.result;healthStatus.value=rec.result}else{currentStatus.textContent='未登録';healthStatus.value='良好'}}catch(e){currentStatus.textContent='読み込めませんでした'}}
targetSelect.addEventListener('change',async()=>{setTargetFromKey(targetSelect.value);await loadStatus()});
async function saveHealthStatus(){if(!selectedKey()){alert('犬を選択してください。');return}saveBtn.disabled=true;try{await BigPawAPI.addHealthRecord({puppyId:activePuppyId||null,parentDogId:activeParentId||null,category:'健康状態',itemName:'健康状態',result:healthStatus.value,testedOn:''});currentStatus.textContent=healthStatus.value;alert('健康状態を保存しました。')}catch(e){alert(e.status===401||e.status===403?'ブリーダーとしてログインしてください。':'保存できませんでした')}finally{saveBtn.disabled=false}}
loadTargets();
</script></body></html>
