<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>健康情報管理｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"><style>.modal{position:fixed;inset:0;background:rgba(86,58,80,.45);display:none;place-items:center;padding:18px}.modal.show{display:grid}.box{background:#fff;width:min(600px,100%);border-radius:22px;padding:22px}</style></head><body><div class="topbar">🐾 BIG PAW ブリーダー管理</div><header class="site-header"><div class="wrap nav"><a class="logo" href="admin.html"><span class="logo-mark">🐾</span>BIG PAW 管理</a><nav class="navlinks"><a href="admin.html">子犬管理</a><a href="parent-dogs.html">親犬</a><a href="breeder-inquiries.html">問い合わせ</a></nav></div></header><div class="hero-mini"><div class="wrap"><h1>健康・検査情報</h1><p>大型犬で特に確認したい健康情報を、子犬・親犬ごとに記録。</p></div></div><main class="wrap"><section class="section"><div class="card pad"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><h2 id="targetTitle">健康記録</h2><p class="muted" id="targetSub">子犬または親犬を選択</p></div><button class="btn btn-main" onclick="openModal()">＋ 健康情報を追加</button></div><div class="tablelike" id="records" style="margin-top:16px"></div></div><div class="card pad" style="margin-top:18px"><h2>大型犬向け検査テンプレート</h2><div class="chips"><span class="chip">股関節</span><span class="chip">肘関節</span><span class="chip">眼科</span><span class="chip">心臓</span><span class="chip">犬種別遺伝子検査</span><span class="chip">ワクチン</span><span class="chip">マイクロチップ</span></div><p class="muted">犬種ごとに必要項目をテンプレート化し、未入力を分かりやすくする設計です。</p></div></section></main><div class="modal" id="modal"><form class="box" onsubmit="saveRecord(event)"><h2>健康・検査記録を追加</h2><div class="form-grid"><div class="field"><label>カテゴリ</label><select id="hrCategory"><option>健康診断</option><option>ワクチン</option><option>個体識別</option><option>股関節</option><option>肘関節</option><option>眼科</option><option>心臓</option><option>遺伝子検査</option><option>その他</option></select></div><div class="field"><label>項目名 *</label><input id="hrItem" required></div><div class="field"><label>結果</label><input id="hrResult"></div><div class="field"><label>検査・接種日</label><input id="hrDate" type="date"></div></div><div style="display:flex;gap:10px;justify-content:flex-end"><button type="button" class="btn btn-sub" onclick="closeModal()">キャンセル</button><button class="btn btn-main">保存する</button></div></form></div><script src="assets/app.js"></script><script src="assets/api.js"></script><script>
const qp=new URLSearchParams(location.search),puppyId=qp.get('puppyId')||(!qp.get('parentDogId')?'p1':''),parentDogId=qp.get('parentDogId')||'';const demo=[{category:'健康診断',item_name:'一般健康診断',result:'異常所見なし',tested_on:'2026-08-18'},{category:'ワクチン',item_name:'6種混合ワクチン',result:'1回目',tested_on:'2026-08-21'},{category:'個体識別',item_name:'マイクロチップ',result:'装着済み',tested_on:''}];
async function load(){targetTitle.textContent=parentDogId?'親犬の健康・検査記録':'子犬の健康・検査記録';targetSub.textContent=parentDogId?`親犬ID: ${parentDogId}`:`子犬ID: ${puppyId}`;let list=demo;if(BigPawAPI.isLive()){try{list=await BigPawAPI.healthRecords(parentDogId?{parentDogId}:{puppyId})}catch(e){if(e.status===401){records.innerHTML='<div class="empty"><h2>ブリーダーログインが必要です</h2><a class="btn btn-main" href="login.html">ログイン</a></div>';return}}}records.innerHTML=list.length?list.map(r=>`<div class="table-row"><div>${BigPaw.esc(r.category)}</div><div><b>${BigPaw.esc(r.item_name||r.itemName)}</b><br><span class="muted">${BigPaw.esc(r.tested_on||r.testedOn||'日付未登録')}｜${BigPaw.esc(r.result||'')}</span></div></div>`).join(''):'<div class="empty"><h2>記録はまだありません</h2></div>'}
function openModal(){modal.classList.add('show')}function closeModal(){modal.classList.remove('show')}async function saveRecord(e){e.preventDefault();if(!BigPawAPI.isLive()){alert('サーバー版で保存できます。');closeModal();return}try{await BigPawAPI.addHealthRecord({puppyId:puppyId||null,parentDogId:parentDogId||null,category:hrCategory.value,itemName:hrItem.value,result:hrResult.value,testedOn:hrDate.value});closeModal();e.target.reset();load()}catch(x){alert(x.status===401?'ブリーダーとしてログインしてください。':'保存できませんでした')}}load();
</script></body></html>
