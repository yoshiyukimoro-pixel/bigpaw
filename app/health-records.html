<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>健康情報管理｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"><style>
.modal{position:fixed;inset:0;background:rgba(86,58,80,.45);display:none;place-items:center;padding:18px;z-index:9999}.modal.show{display:grid}.box{background:#fff;width:min(640px,100%);max-height:88vh;overflow:auto;border-radius:22px;padding:22px}.health-template{border:0;cursor:pointer}.health-help{font-size:13px;color:#8a7b8d;margin-top:6px}.health-preview{margin-top:14px;padding:12px 14px;background:#fff7fb;border:1px solid #f1dbe6;border-radius:14px}.health-preview b{display:block;margin-bottom:4px}@media(max-width:640px){.health-head{align-items:flex-start!important;flex-direction:column}.health-head .btn{width:100%}.box{padding:18px}}
</style></head><body><div class="topbar">🐾 BIG PAW ブリーダー管理</div><header class="site-header"><div class="wrap nav"><a class="logo" href="admin.html"><span class="logo-mark">🐾</span>BIG PAW 管理</a><nav class="navlinks"><a href="admin.html">子犬管理</a><a href="parent-dogs.html">親犬</a><a href="breeder-inquiries.html">問い合わせ</a></nav></div></header><div class="hero-mini"><div class="wrap"><h1>健康情報</h1><p>子犬・親犬ごとの健康状態や必要な記録を、かんたんに残せます。</p></div></div><main class="wrap"><section class="section"><div class="card pad"><div class="field" style="max-width:560px;margin-bottom:18px"><label>記録する犬を選択</label><select id="targetSelect"><option value="">読み込み中…</option></select></div><div class="health-head" style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><h2 id="targetTitle">健康記録</h2><p class="muted" id="targetSub">子犬または親犬を選択</p></div><button id="addHealthBtn" class="btn btn-main" onclick="openModal()" disabled>＋ 健康情報を追加</button></div><div class="tablelike" id="records" style="margin-top:16px"></div></div><div class="card pad" style="margin-top:18px"><h2>よく使う項目</h2><p class="muted">項目を押すと、その内容を選択した状態で記録できます。</p><div class="chips"><button class="chip health-template" onclick="openTemplate('健康状態')">健康状態</button><button class="chip health-template" onclick="openTemplate('ワクチン')">ワクチン</button><button class="chip health-template" onclick="openTemplate('個体識別')">マイクロチップ</button><button class="chip health-template" onclick="openTemplate('遺伝子検査')">遺伝子検査</button><button class="chip health-template" onclick="openTemplate('その他')">その他</button></div></div></section></main><div class="modal" id="modal"><form class="box" onsubmit="saveRecord(event)"><h2>健康情報を追加</h2><p class="muted">基本は選ぶだけで登録できます。必要なときだけ詳細を追記してください。</p><div class="form-grid"><div class="field"><label>カテゴリ *</label><select id="hrCategory" required onchange="refreshHealthChoices()"><option value="健康状態">健康状態</option><option value="ワクチン">ワクチン</option><option value="個体識別">マイクロチップ</option><option value="遺伝子検査">遺伝子検査</option><option value="その他">その他</option></select></div><div class="field"><label>項目 *</label><select id="hrItemSelect" required onchange="toggleCustomItem();updatePreview()"></select><input id="hrItemCustom" style="display:none;margin-top:8px" placeholder="項目名を入力" oninput="updatePreview()"></div><div class="field"><label>状態・結果 *</label><select id="hrStatus" required onchange="updatePreview()"></select><div class="health-help">カテゴリに合わせて選択肢が変わります。</div></div><div class="field"><label>記録日</label><input id="hrDate" type="date" onchange="updatePreview()"></div></div><div class="field" style="margin-top:12px"><label>詳細・病院名・製品名など（任意）</label><input id="hrDetail" placeholder="例：6種混合／食欲・便ともに問題なし／○○動物病院" oninput="updatePreview()"><div class="health-help">選択肢だけで足りる場合は空欄で大丈夫です。</div></div><div class="health-preview"><b>登録内容</b><span id="healthPreviewText">選択内容がここに表示されます。</span></div><div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px"><button type="button" class="btn btn-sub" onclick="closeModal()">キャンセル</button><button class="btn btn-main">保存する</button></div></form></div><script src="assets/app.js"></script><script src="assets/api.js"></script><script>
const qp=new URLSearchParams(location.search);let activePuppyId=qp.get('puppyId')||'',activeParentId=qp.get('parentDogId')||'';
const HEALTH_ITEMS={
'健康状態':['全身状態','健康診断','通院・治療','その他'],
'ワクチン':['混合ワクチン','狂犬病予防接種','その他'],
'個体識別':['マイクロチップ装着','マイクロチップ登録','登録情報変更','その他'],
'遺伝子検査':['犬種別遺伝子検査','単項目遺伝子検査','その他'],
'その他':['その他']};
const HEALTH_RESULTS={
'健康状態':['良好','経過観察','要受診','治療中','治療済み'],
'ワクチン':['接種済み','接種予定','接種見合わせ'],
'個体識別':['装着済み','登録済み','登録手続き中'],
'遺伝子検査':['クリア','キャリア','アフェクテッド','結果待ち'],
'その他':['問題なし','経過観察','対応中','対応済み','その他']};
function selectedKey(){return activePuppyId?'puppy:'+activePuppyId:activeParentId?'parent:'+activeParentId:''}
function setTargetFromKey(v){activePuppyId='';activeParentId='';if(v.startsWith('puppy:'))activePuppyId=v.slice(6);else if(v.startsWith('parent:'))activeParentId=v.slice(7);const q=new URLSearchParams();if(activePuppyId)q.set('puppyId',activePuppyId);if(activeParentId)q.set('parentDogId',activeParentId);history.replaceState(null,'',location.pathname+(q.toString()?'?'+q:''));addHealthBtn.disabled=!v}
async function loadTargets(){try{const [puppies,parents]=await Promise.all([BigPawAPI.breederPuppies(),BigPawAPI.parentDogs()]);const opts=[];for(const p of puppies)opts.push({value:'puppy:'+p.id,label:'子犬｜'+(p.name||p.breed||p.id)});for(const p of parents)opts.push({value:'parent:'+p.id,label:'親犬｜'+(p.name||p.id)+'（'+(p.sex||'')+'）'});targetSelect.innerHTML='<option value="">選択してください</option>'+opts.map(o=>`<option value="${BigPaw.esc(o.value)}">${BigPaw.esc(o.label)}</option>`).join('');let key=selectedKey();if(key&&!opts.some(o=>o.value===key))key='';if(!key&&opts.length===1)key=opts[0].value;targetSelect.value=key;setTargetFromKey(key);await loadRecords()}catch(e){targetSelect.innerHTML='<option value="">読み込めませんでした</option>';records.innerHTML='<div class="empty"><h2>対象の犬を読み込めませんでした</h2><button class="btn btn-sub" onclick="loadTargets()">再読み込み</button></div>'}}
async function loadRecords(){const key=selectedKey();if(!key){targetTitle.textContent='健康記録';targetSub.textContent='子犬または親犬を選択してください';records.innerHTML='<div class="empty"><h2>記録する犬を選択してください</h2></div>';return}targetTitle.textContent=activeParentId?'親犬の健康記録':'子犬の健康記録';const selected=targetSelect.options[targetSelect.selectedIndex];targetSub.textContent=selected?selected.textContent:'';records.innerHTML='<div class="muted">読み込み中…</div>';try{const list=await BigPawAPI.healthRecords(activeParentId?{parentDogId:activeParentId}:{puppyId:activePuppyId});records.innerHTML=list.length?list.map(r=>`<div class="table-row"><div>${BigPaw.esc(r.category)}</div><div><b>${BigPaw.esc(r.item_name||r.itemName)}</b><br><span class="muted">${BigPaw.esc(r.tested_on||r.testedOn||'日付未登録')}｜${BigPaw.esc(r.result||'')}</span></div></div>`).join(''):'<div class="empty"><h2>記録はまだありません</h2></div>'}catch(e){records.innerHTML='<div class="empty"><h2>健康記録を読み込めませんでした</h2><button class="btn btn-sub" onclick="loadRecords()">再読み込み</button></div>'}}
targetSelect.addEventListener('change',async()=>{setTargetFromKey(targetSelect.value);await loadRecords()});
function refreshHealthChoices(){const c=hrCategory.value;hrItemSelect.innerHTML=(HEALTH_ITEMS[c]||['その他']).map(v=>`<option value="${BigPaw.esc(v)}">${BigPaw.esc(v)}</option>`).join('');hrStatus.innerHTML=(HEALTH_RESULTS[c]||['その他']).map(v=>`<option value="${BigPaw.esc(v)}">${BigPaw.esc(v)}</option>`).join('');toggleCustomItem();updatePreview()}
function toggleCustomItem(){const custom=hrItemSelect.value==='その他';hrItemCustom.style.display=custom?'block':'none';hrItemCustom.required=custom;if(!custom)hrItemCustom.value=''}
function currentItem(){return hrItemSelect.value==='その他'?(hrItemCustom.value.trim()||'その他'):hrItemSelect.value}
function currentResult(){const s=hrStatus.value||'',d=hrDetail.value.trim();return d?s+'｜'+d:s}
function updatePreview(){const d=hrDate.value?'／'+hrDate.value:'';healthPreviewText.textContent=(hrCategory.value||'')+'／'+currentItem()+'／'+(currentResult()||'結果未選択')+d}
function openModal(category=''){if(!selectedKey()){alert('先に記録する犬を選択してください。');return}if(category)hrCategory.value=category;refreshHealthChoices();modal.classList.add('show')}
function openTemplate(category){openModal(category)}
function closeModal(){modal.classList.remove('show')}
async function saveRecord(e){e.preventDefault();if(!selectedKey()){alert('記録する犬を選択してください。');return}const item=currentItem();if(!item){alert('項目を選択してください。');return}try{await BigPawAPI.addHealthRecord({puppyId:activePuppyId||null,parentDogId:activeParentId||null,category:hrCategory.value,itemName:item,result:currentResult(),testedOn:hrDate.value});closeModal();e.target.reset();hrCategory.value='健康状態';refreshHealthChoices();await loadRecords()}catch(x){alert(x.status===401||x.status===403?'ブリーダーとしてログインしてください。':'保存できませんでした')}}
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});refreshHealthChoices();loadTargets();
</script></body></html>
