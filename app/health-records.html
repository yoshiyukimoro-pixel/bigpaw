<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>健康情報管理｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"><style>.modal{position:fixed;inset:0;background:rgba(86,58,80,.45);display:none;place-items:center;padding:18px}.modal.show{display:grid}.box{background:#fff;width:min(600px,100%);border-radius:22px;padding:22px}</style></head><body><div class="topbar">🐾 BIG PAW ブリーダー管理</div><header class="site-header"><div class="wrap nav"><a class="logo" href="admin.html"><span class="logo-mark">🐾</span>BIG PAW 管理</a><nav class="navlinks"><a href="admin.html">子犬管理</a><a href="parent-dogs.html">親犬</a><a href="breeder-inquiries.html">問い合わせ</a></nav></div></header><div class="hero-mini"><div class="wrap"><h1>健康・検査情報</h1><p>大型犬で特に確認したい健康情報を、子犬・親犬ごとに記録。</p></div></div><main class="wrap"><section class="section"><div class="card pad"><div class="field" style="max-width:560px;margin-bottom:18px"><label>記録する犬を選択</label><select id="targetSelect"><option value="">読み込み中…</option></select></div><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><h2 id="targetTitle">健康記録</h2><p class="muted" id="targetSub">子犬または親犬を選択</p></div><button id="addHealthBtn" class="btn btn-main" onclick="openModal()" disabled>＋ 健康情報を追加</button></div><div class="tablelike" id="records" style="margin-top:16px"></div></div><div class="card pad" style="margin-top:18px"><h2>大型犬向け検査テンプレート</h2><div class="chips"><span class="chip">股関節</span><span class="chip">肘関節</span><span class="chip">眼科</span><span class="chip">心臓</span><span class="chip">犬種別遺伝子検査</span><span class="chip">ワクチン</span><span class="chip">マイクロチップ</span></div><p class="muted">犬種ごとに必要項目をテンプレート化し、未入力を分かりやすくする設計です。</p></div></section></main><div class="modal" id="modal"><form class="box" onsubmit="saveRecord(event)"><h2>健康・検査記録を追加</h2><div class="form-grid"><div class="field"><label>カテゴリ</label><select id="hrCategory"><option>健康診断</option><option>ワクチン</option><option>個体識別</option><option>股関節</option><option>肘関節</option><option>眼科</option><option>心臓</option><option>遺伝子検査</option><option>その他</option></select></div><div class="field"><label>項目名 *</label><input id="hrItem" required></div><div class="field"><label>結果</label><input id="hrResult"></div><div class="field"><label>検査・接種日</label><input id="hrDate" type="date"></div></div><div style="display:flex;gap:10px;justify-content:flex-end"><button type="button" class="btn btn-sub" onclick="closeModal()">キャンセル</button><button class="btn btn-main">保存する</button></div></form></div><script src="assets/app.js"></script><script src="assets/api.js"></script><script>
const qp=new URLSearchParams(location.search);let activePuppyId=qp.get('puppyId')||'',activeParentId=qp.get('parentDogId')||'';
function selectedKey(){return activePuppyId?'puppy:'+activePuppyId:activeParentId?'parent:'+activeParentId:''}
function setTargetFromKey(v){activePuppyId='';activeParentId='';if(v.startsWith('puppy:'))activePuppyId=v.slice(6);else if(v.startsWith('parent:'))activeParentId=v.slice(7);const q=new URLSearchParams();if(activePuppyId)q.set('puppyId',activePuppyId);if(activeParentId)q.set('parentDogId',activeParentId);history.replaceState(null,'',location.pathname+(q.toString()?'?'+q:''));addHealthBtn.disabled=!v}
async function loadTargets(){try{const [puppies,parents]=await Promise.all([BigPawAPI.breederPuppies(),BigPawAPI.parentDogs()]);const opts=[];for(const p of puppies)opts.push({value:'puppy:'+p.id,label:'子犬｜'+(p.name||p.breed||p.id)});for(const p of parents)opts.push({value:'parent:'+p.id,label:'親犬｜'+(p.name||p.id)+'（'+(p.sex||'')+'）'});targetSelect.innerHTML='<option value="">選択してください</option>'+opts.map(o=>`<option value="${BigPaw.esc(o.value)}">${BigPaw.esc(o.label)}</option>`).join('');let key=selectedKey();if(key&&!opts.some(o=>o.value===key))key='';if(!key&&opts.length===1)key=opts[0].value;targetSelect.value=key;setTargetFromKey(key);await loadRecords()}catch(e){targetSelect.innerHTML='<option value="">読み込めませんでした</option>';records.innerHTML='<div class="empty"><h2>対象の犬を読み込めませんでした</h2><button class="btn btn-sub" onclick="loadTargets()">再読み込み</button></div>'}}
async function loadRecords(){const key=selectedKey();if(!key){targetTitle.textContent='健康記録';targetSub.textContent='子犬または親犬を選択してください';records.innerHTML='<div class="empty"><h2>記録する犬を選択してください</h2></div>';return}targetTitle.textContent=activeParentId?'親犬の健康・検査記録':'子犬の健康・検査記録';const selected=targetSelect.options[targetSelect.selectedIndex];targetSub.textContent=selected?selected.textContent:'';records.innerHTML='<div class="muted">読み込み中…</div>';try{const list=await BigPawAPI.healthRecords(activeParentId?{parentDogId:activeParentId}:{puppyId:activePuppyId});records.innerHTML=list.length?list.map(r=>`<div class="table-row"><div>${BigPaw.esc(r.category)}</div><div><b>${BigPaw.esc(r.item_name||r.itemName)}</b><br><span class="muted">${BigPaw.esc(r.tested_on||r.testedOn||'日付未登録')}｜${BigPaw.esc(r.result||'')}</span></div></div>`).join(''):'<div class="empty"><h2>記録はまだありません</h2></div>'}catch(e){records.innerHTML='<div class="empty"><h2>健康記録を読み込めませんでした</h2><button class="btn btn-sub" onclick="loadRecords()">再読み込み</button></div>'}}
targetSelect.addEventListener('change',async()=>{setTargetFromKey(targetSelect.value);await loadRecords()});
function openModal(){if(!selectedKey())return;modal.classList.add('show')}function closeModal(){modal.classList.remove('show')}async function saveRecord(e){e.preventDefault();if(!selectedKey()){alert('記録する犬を選択してください。');return}try{await BigPawAPI.addHealthRecord({puppyId:activePuppyId||null,parentDogId:activeParentId||null,category:hrCategory.value,itemName:hrItem.value,result:hrResult.value,testedOn:hrDate.value});closeModal();e.target.reset();loadRecords()}catch(x){alert(x.status===401||x.status===403?'ブリーダーとしてログインしてください。':'保存できませんでした')}}loadTargets();
</script></body></html>
