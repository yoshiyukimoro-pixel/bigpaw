<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>見学日程｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="topbar">🐾 大型犬専門｜BIG PAW</div><header class="site-header"><div class="wrap nav"><a class="logo" href="index.html"><span class="logo-mark">🐾</span>BIG PAW</a><nav class="navlinks"><a href="messages.html">メッセージ</a><a href="mypage.html">マイページ</a></nav></div></header><div class="hero-mini"><div class="wrap"><h1 id="pageTitle">見学日程</h1><p id="subtitle">問い合わせ中の子犬</p></div></div><main class="wrap"><section class="section" style="max-width:760px;margin:auto"><div class="card pad"><div class="stepbar"><div class="step">1. 問い合わせ</div><div class="step active">2. 見学調整</div><div class="step">3. 対面説明</div><div class="step">4. 契約へ</div></div><div id="empty" class="notice" style="display:none">先に子犬へ問い合わせをしてください。</div><div id="form"><div class="form-grid"><div class="field"><label>見学日</label><input id="visitDate" type="date"></div><div class="field"><label>時間</label><select id="visitTime"><option>10:00</option><option>11:00</option><option>13:00</option><option>14:00</option><option>15:00</option></select></div><div class="field"><label>人数</label><select id="party"><option value="1">1名</option><option value="2" selected>2名</option><option value="3">3名</option><option value="4">4名以上</option></select></div><div class="field"><label>来訪方法</label><select id="transport"><option>車</option><option>電車・徒歩</option><option>その他</option></select></div></div><div id="visitNotice" class="notice">見学希望の状況を確認しています。</div><div id="visitContactBox" class="notice" style="display:none;margin-top:14px"><b>見学場所</b><div id="visitAddressText" style="margin-top:8px"></div><div id="visitPhoneText"></div><div id="visitAccessText"></div><p class="muted" style="margin-bottom:0">この情報は対面見学が確定した方にだけ表示されています。第三者への共有はお控えください。</p></div><button id="saveVisitBtn" class="btn btn-main btn-wide" style="margin-top:16px" onclick="saveVisit()">この日時で見学を確定する</button></div></div></section></main><script src="assets/app.js"></script><script src="assets/api.js"></script><script src="assets/bridge.js"></script><script>
function localISODate(d=new Date()){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
let inquiry=null,puppy=null,role='buyer';
function showVisitContact(v){const c=v?.visitContact;if(!c)return;const parts=[c.address,c.phone,c.access].filter(Boolean);if(!parts.length)return;visitAddressText.textContent=c.address?'住所：'+c.address:'';visitPhoneText.textContent=c.phone?'当日の連絡先：'+c.phone:'';visitAccessText.textContent=c.access?'アクセス・駐車場：'+c.access:'';visitContactBox.style.display='block'}
function prefillFromInquiry(today){const pref=inquiry?.preferred_date||inquiry?.preferredDate||'';if(pref&&pref>=today)visitDate.value=pref;const text=String(inquiry?.message||'');const m=text.match(/第1希望\s+\d{4}-\d{2}-\d{2}\s+(\d{2}:\d{2})/);if(m&&Array.from(visitTime.options).some(o=>o.value===m[1]))visitTime.value=m[1]}
function setBuyerView(v){[visitDate,visitTime,party,transport].forEach(x=>x.disabled=true);saveVisitBtn.style.display='none';if(v?.status==='confirmed'){pageTitle.textContent='見学日時が確定しました';visitNotice.textContent='ブリーダーが見学日時を確定しました。下の見学場所・当日の連絡先をご確認ください。';showVisitContact(v)}else{pageTitle.textContent='ブリーダー確認待ち';visitNotice.textContent='見学希望はブリーダーへ送信済みです。ブリーダーが希望日時を確認して確定すると、メールでお知らせします。対面見学の場合は、確定後に見学場所と当日の連絡先が表示されます。'}}
async function init(){const today=localISODate();visitDate.min=today;visitDate.value=today;try{const me=await BigPawAPI.me();role=String(me.role||'buyer');const list=await BigPawBridge.inquiries();const wanted=new URLSearchParams(location.search).get('inquiry')||'';inquiry=(wanted&&list.find(x=>String(x.id)===String(wanted)))||null;if(!inquiry){empty.style.display='block';empty.textContent='見学申込みが見つかりません。子犬詳細から「見学・問い合わせ」を送信してください。';form.style.display='none';return}try{puppy=await BigPawBridge.puppy(inquiry.puppy_id||inquiry.puppyId)}catch(e){}subtitle.textContent=(puppy?.breeder||inquiry.breeder_name||inquiry.breeder||'ブリーダー')+'｜'+(puppy?.name||inquiry.puppy_name||inquiry.puppyName||'子犬');prefillFromInquiry(today);const v=await BigPawBridge.visit(inquiry.id).catch(()=>null);if(v){const saved=v.visit_date||v.date||'';visitDate.value=saved&&saved>=today?saved:visitDate.value;visitTime.value=v.visit_time||v.time||visitTime.value;party.value=String(v.party_size||v.partySize||2);transport.value=v.transport||'車'}if(role==='breeder'||role==='operator'){pageTitle.textContent='見学日程を確定';visitNotice.textContent='購入希望者から届いた希望日時を確認し、問題なければ見学日時を確定してください。確定後、対面見学の場合だけ登録済みの見学場所・当日連絡先が購入希望者へ表示・メール送信されます。';saveVisitBtn.style.display='block'}else{setBuyerView(v)}}catch(e){empty.style.display='block';empty.textContent='ログインして見学申込みを確認してください。';form.style.display='none'}}
async function saveVisit(){if(!inquiry||!(role==='breeder'||role==='operator'))return;try{await BigPawBridge.saveVisit(inquiry.id,{date:visitDate.value,time:visitTime.value,partySize:Number(party.value),transport:transport.value,status:'confirmed'});alert('見学日程を確定しました。購入希望者へ通知しました。');location.href='messages.html?inquiry='+encodeURIComponent(inquiry.id)}catch(e){if(e.status===409||String(e.message||'').includes('見学場所')){visitNotice.innerHTML='対面見学を確定するには、見学場所の住所と当日の連絡先の登録が必要です。<br><a href="breeder-profile-edit.html" style="font-weight:900;color:#c14f7e">犬舎プロフィールで見学先情報を登録する →</a>';return}alert(e.message||'保存できませんでした')}}init();
</script></body></html>
