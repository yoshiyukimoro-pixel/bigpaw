<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>見学日程｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="topbar">🐾 大型犬専門｜BIG PAW</div><header class="site-header"><div class="wrap nav"><a class="logo" href="index.html"><span class="logo-mark">🐾</span>BIG PAW</a><nav class="navlinks"><a href="messages.html">メッセージ</a><a href="mypage.html">マイページ</a></nav></div></header><div class="hero-mini"><div class="wrap"><h1>見学日程を確定</h1><p id="subtitle">問い合わせ中の子犬</p></div></div><main class="wrap"><section class="section" style="max-width:760px;margin:auto"><div class="card pad"><div class="stepbar"><div class="step">1. 問い合わせ</div><div class="step active">2. 見学調整</div><div class="step">3. 対面説明</div><div class="step">4. 契約へ</div></div><div id="empty" class="notice" style="display:none">先に子犬へ問い合わせをしてください。</div><div id="form"><div class="form-grid"><div class="field"><label>見学日</label><input id="visitDate" type="date" value="2026-09-22"></div><div class="field"><label>時間</label><select id="visitTime"><option>10:00</option><option>11:00</option><option>13:00</option><option>14:00</option><option>15:00</option></select></div><div class="field"><label>人数</label><select id="party"><option value="1">1名</option><option value="2" selected>2名</option><option value="3">3名</option><option value="4">4名以上</option></select></div><div class="field"><label>来訪方法</label><select id="transport"><option>車</option><option>電車・徒歩</option><option>その他</option></select></div></div><div class="notice">詳細住所は、日程確定後にブリーダーから案内する運用を想定しています。</div><button class="btn btn-main btn-wide" style="margin-top:16px" onclick="confirmVisit()">この日程で保存する</button></div></div></section></main><script src="assets/app.js"></script><script src="assets/api.js"></script><script src="assets/bridge.js"></script><script src="assets/workflow.js"></script><script>
let ctx=null;async function init(){try{ctx=await BigPawWorkflow.context();if(!ctx.inquiry){empty.style.display='block';form.style.display='none';return}subtitle.textContent=(ctx.puppy?.breeder||ctx.inquiry.breeder||'ブリーダー')+'｜'+(ctx.puppy?.name||ctx.inquiry.puppyName||'子犬');const v=await BigPawBridge.visit(ctx.inquiry.id).catch(()=>null);if(v){visitDate.value=v.visit_date||v.date||visitDate.value;visitTime.value=v.visit_time||v.time||visitTime.value;party.value=String(v.party_size||v.partySize||2);transport.value=v.transport||'車'}}catch(e){empty.style.display='block';empty.textContent='ログインして問い合わせを選択してください。';form.style.display='none'}}async function confirmVisit(){try{await BigPawBridge.saveVisit(ctx.inquiry.id,{date:visitDate.value,time:visitTime.value,partySize:Number(party.value),transport:transport.value,status:'confirmed'});alert('見学日程を保存しました');location.href='deal.html?inquiry='+encodeURIComponent(ctx.inquiry.id)}catch(e){alert(e.message||'保存できませんでした')}}init();
</script></body></html>
