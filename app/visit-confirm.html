<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>見学日程｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="topbar">🐾 大型犬専門｜BIG PAW</div><header class="site-header"><div class="wrap nav"><a class="logo" href="index.html"><span class="logo-mark">🐾</span>BIG PAW</a><nav class="navlinks"><a href="messages.html">メッセージ</a><a href="mypage.html">マイページ</a></nav></div></header><div class="hero-mini"><div class="wrap"><h1 id="pageTitle">見学日程を調整</h1><p id="subtitle">問い合わせ中の子犬</p></div></div><main class="wrap"><section class="section" style="max-width:760px;margin:auto"><div class="card pad"><div class="stepbar"><div class="step">1. 問い合わせ</div><div class="step active">2. 見学調整</div><div class="step">3. 対面説明</div><div class="step">4. 契約へ</div></div><div id="empty" class="notice" style="display:none">先に子犬へ問い合わせをしてください。</div><div id="form"><div class="form-grid"><div class="field"><label>見学日</label><input id="visitDate" type="date"></div><div class="field"><label>時間</label><select id="visitTime"><option>10:00</option><option>11:00</option><option>13:00</option><option>14:00</option><option>15:00</option></select></div><div class="field"><label>人数</label><select id="party"><option value="1">1名</option><option value="2" selected>2名</option><option value="3">3名</option><option value="4">4名以上</option></select></div><div class="field"><label>来訪方法</label><select id="transport"><option>車</option><option>電車・徒歩</option><option>その他</option></select></div></div><div id="visitNotice" class="notice">希望日時をブリーダーへ送信します。ブリーダーの確認後に見学日時が確定します。</div><button id="saveVisitBtn" class="btn btn-main btn-wide" style="margin-top:16px" onclick="saveVisit()">この日時を希望として送る</button></div></div></section></main><script src="assets/app.js"></script><script src="assets/api.js"></script><script src="assets/bridge.js"></script><script>
function localISODate(d=new Date()){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
let inquiry=null,puppy=null,role='buyer';
async function init(){const today=localISODate();visitDate.min=today;visitDate.value=today;try{const me=await BigPawAPI.me();role=String(me.role||'buyer');const list=await BigPawBridge.inquiries();const wanted=new URLSearchParams(location.search).get('inquiry')||'';inquiry=(wanted&&list.find(x=>String(x.id)===String(wanted)))||list[0]||null;if(!inquiry){empty.style.display='block';form.style.display='none';return}try{puppy=await BigPawBridge.puppy(inquiry.puppy_id||inquiry.puppyId)}catch(e){}subtitle.textContent=(puppy?.breeder||inquiry.breeder_name||inquiry.breeder||'ブリーダー')+'｜'+(puppy?.name||inquiry.puppy_name||inquiry.puppyName||'子犬');const v=await BigPawBridge.visit(inquiry.id).catch(()=>null);if(v){const saved=v.visit_date||v.date||'';visitDate.value=saved&&saved>=today?saved:today;visitTime.value=v.visit_time||v.time||visitTime.value;party.value=String(v.party_size||v.partySize||2);transport.value=v.transport||'車'}if(role==='breeder'||role==='operator'){pageTitle.textContent='見学日程を確定';visitNotice.textContent='購入希望者から届いた希望日時を確認し、問題なければ見学日時を確定してください。';saveVisitBtn.textContent='この日時で見学を確定する'}else if(v?.status==='confirmed'){visitNotice.textContent='見学日時は確定済みです。変更したい場合はブリーダーへメッセージでご相談ください。';saveVisitBtn.disabled=true;saveVisitBtn.textContent='見学日時確定済み'}}catch(e){empty.style.display='block';empty.textContent='ログインして問い合わせを選択してください。';form.style.display='none'}}
async function saveVisit(){if(!inquiry)return;const confirming=role==='breeder'||role==='operator';try{await BigPawBridge.saveVisit(inquiry.id,{date:visitDate.value,time:visitTime.value,partySize:Number(party.value),transport:transport.value,status:confirming?'confirmed':'proposed'});alert(confirming?'見学日程を確定しました。':'見学の希望日時を送信しました。');location.href='messages.html?inquiry='+encodeURIComponent(inquiry.id)}catch(e){alert(e.message||'保存できませんでした')}}init();
</script></body></html>
