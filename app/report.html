<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>掲載内容を報告｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="topbar">🐾 BIG PAW 安心・安全</div><header class="site-header"><div class="wrap nav"><a class="logo" href="index.html"><span class="logo-mark">🐾</span>BIG PAW</a></div></header><main class="wrap"><section class="section" style="max-width:680px;margin:auto"><form class="card pad" onsubmit="send(event)"><h1>掲載内容を運営へ報告</h1><p class="muted">誤った情報、不適切な表示、トラブルなどをBIG PAW運営が確認します。</p><div class="field"><label>理由</label><select id="reason" required><option value="">選択してください</option><option>掲載情報が事実と異なる可能性</option><option>健康情報・検査情報について確認したい</option><option>不適切なメッセージ・対応</option><option>その他</option></select></div><div class="field"><label>詳細</label><textarea id="detail" required placeholder="具体的な内容を入力してください"></textarea></div><div id="msg"></div><button class="btn btn-main btn-wide">運営へ送信</button></form></section></main><script src="assets/api.js"></script><script>const puppyId=new URLSearchParams(location.search).get('puppy')||'';async function send(e){e.preventDefault();try{const r=await BigPawAPI.addReport({puppyId,reason:reason.value,detail:detail.value});msg.innerHTML=`<div class="notice">受け付けました。受付番号：${r.id}</div>`;e.target.querySelector('button').disabled=true}catch(x){msg.innerHTML='<div class="notice">送信にはログインが必要です。<a href="login.html"><b>ログイン</b></a></div>'}}</script></body></html>
