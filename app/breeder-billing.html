<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>請求・お支払い｜BIG PAW</title><link rel="stylesheet" href="assets/style.css"></head><body>
<div class="topbar">🐾 BIG PAW ブリーダー管理</div><header class="site-header"><div class="wrap nav"><a class="logo" href="admin.html"><span class="logo-mark">🐾</span>BIG PAW</a><nav class="navlinks"><a href="admin.html">管理画面</a><a href="breeder-fees.html">料金</a><a href="index.html">公開サイト</a></nav></div></header>
<div class="hero-mini"><div class="wrap"><h1>請求・お支払い</h1><p id="billingLead">成約手数料の請求状況を確認できます。請求書は成約申請をBIG PAW運営が確認した時点で自動発行されます。</p></div></div><main class="wrap"><div id="suspendNotice" class="notice" style="display:none;margin-top:28px;background:#fff0f0;border-color:#efb8b8;color:#8f3030"><b>⚠ 公開掲載を一時停止しています</b><br>支払期限を過ぎた未払い請求があります。犬舎ページと子犬掲載は一般公開されていません。BIG PAW運営で入金確認後、自動で掲載を再開します。</div><section class="section"><div class="card pad"><div id="summary" class="fact-grid"></div><div id="rows" style="margin-top:22px">読み込み中…</div></div></section></main><script src="assets/api.js"></script><script>
const yen=n=>Number(n||0).toLocaleString()+'円';const dt=t=>t?new Date(t*1000).toLocaleDateString('ja-JP'):'-';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pct=bps=>{const n=Number(bps||0)/100;return (Number.isInteger(n)?String(n):n.toFixed(2).replace(/0+$/,'').replace(/\.$/,''))+'%'};
(async()=>{try{const [a,bp,cfg]=await Promise.all([BigPawAPI.breederInvoices(),BigPawAPI.breederProfile(),BigPawAPI.breederBillingConfig()]);const rateLabel=pct(cfg.commissionRateBps||500);const dueDays=Number(cfg.commissionDueDays||7);billingLead.textContent=`成約手数料${rateLabel}（税込）の請求状況を確認できます。請求書は成約申請をBIG PAW運営が確認した時点で自動発行され、支払期限は請求日から${dueDays}日以内です。`;suspendNotice.style.display=bp&&bp.billing_suspended?'block':'none';const now=Math.floor(Date.now()/1000);const outstanding=a.filter(x=>x.status==='issued').reduce((n,x)=>n+x.fee_amount,0);const paid=a.filter(x=>x.status==='paid').reduce((n,x)=>n+x.fee_amount,0);const overdue=a.filter(x=>x.status==='issued'&&Number(x.due_at)<now).reduce((n,x)=>n+x.fee_amount,0);summary.innerHTML=`<div class="fact"><span>未払い</span><b>${yen(outstanding)}</b></div><div class="fact"><span>うち期限超過</span><b>${yen(overdue)}</b></div><div class="fact"><span>支払済み累計</span><b>${yen(paid)}</b></div><div class="fact"><span>手数料率</span><b>${rateLabel}（税込）</b></div>`;rows.innerHTML=a.length?a.map(x=>{const isOver=x.status==='issued'&&Number(x.due_at)<now;const label=x.status==='paid'?'支払済み':x.status==='void'?'取消':isOver?'期限超過':'お支払い待ち';return `<div style="padding:16px 0;border-bottom:1px solid #f1dbe5"><b>${esc(x.invoice_no)}</b>　<span class="chip" style="${isOver?'background:#fff0f0;color:#b84c4c':''}">${label}</span><br><span class="muted">${esc(x.puppy_name)} / ${esc(x.breed)}　成約額 ${yen(x.sale_amount)}</span><br><strong style="font-size:20px">請求額 ${yen(x.fee_amount)}</strong><br><span class="muted">発行 ${dt(x.issued_at)} / 支払期限 ${dt(x.due_at)}</span><div style="margin-top:9px"><a class="btn btn-sub" href="breeder-invoice.html?id=${encodeURIComponent(x.id)}">請求書を開く</a></div></div>`}).join(''):'現在、請求はありません。';}catch(e){rows.innerHTML='ブリーダーアカウントでログインしてください。';}})();
</script><script src="/auth-return-fix.js"></script><style id="bigpaw-role-theme">body{background:#fff7fb!important}body.bigpaw-breeder-theme{background:#f3f8ff!important}body.bigpaw-operator-theme{background:#fffbea!important}</style><script>(function(){var p=location.pathname;if(p.indexOf("/operator-")>=0)document.body.classList.add("bigpaw-operator-theme");else if(p.indexOf("/breeder-")>=0||p.endsWith("/admin.html"))document.body.classList.add("bigpaw-breeder-theme");})();</script></body></html>
