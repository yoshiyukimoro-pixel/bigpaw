name: One-time BIG PAW operator mail test safety check
on:
  push:
    branches:
      - fix/one-time-bigpaw-mail-probe-20261010
  pull_request:
    paths:
      - app/backend/one_time_operator_mail_probe.py
      - app/backend/test_one_time_operator_mail_probe.py
      - app/backend/start_live.py
      - .github/workflows/one-time-operator-mail-check.yml

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test one-shot live sender and delivery audit offline
        run: |
          set -euo pipefail
          python3 -m py_compile app/backend/one_time_operator_mail_probe.py app/backend/test_one_time_operator_mail_probe.py app/backend/start_live.py app/backend/server.py
          python3 app/backend/test_one_time_operator_mail_probe.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app/backend/start_live.py').read_text(encoding='utf-8')
          p=Path('app/backend/one_time_operator_mail_probe.py').read_text(encoding='utf-8')
          assert "if os.environ.get('BIGPAW_ONE_TIME_MAIL_PROBE_ID')" in s
          assert "threading.Thread(target=run_one_time_operator_mail_probe, daemon=True)" in s
          assert 'TARGET = "info@bigpaw.site"' in p
          assert 'live_send_mail()' in p
          assert 'os.O_EXCL' in p
          assert 'RESEND_API_KEY' in p
          assert 'if not probe_id:' in p
          print('ONE_SHOT_PROBE_SAFETY_OK')
          PY
      - name: Full existing production Docker build and all release gates
        run: |
          set -euo pipefail
          if docker build --no-cache -t bigpaw-one-time-mail-probe .; then
            echo 'DOCKER_HUB_BUILD_OK'
          else
            sed 's@^FROM python:3.13-slim$@FROM public.ecr.aws/docker/library/python:3.13-slim@' Dockerfile > Dockerfile.ci
            docker build --no-cache -f Dockerfile.ci -t bigpaw-one-time-mail-probe .
            echo 'ECR_MIRROR_BUILD_OK'
          fi
      - name: Confirm web server and operator application alert remain healthy
        run: |
          set -euo pipefail
          docker run -d --name bigpaw-mail-probe-smoke -p 18080:8080 -e BIGPAW_DATA_DIR=/tmp/bigpaw-mail-probe -e BIGPAW_ENV=development -e BIGPAW_DEV_LINKS=1 -e PORT=8080 bigpaw-one-time-mail-probe python3 backend/server.py
          trap 'docker rm -f bigpaw-mail-probe-smoke >/dev/null 2>&1 || true' EXIT
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18080/api/health >/dev/null; then ready=1; break; fi
            if ! docker inspect -f '{{.State.Running}}' bigpaw-mail-probe-smoke | grep -q true; then break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then docker logs bigpaw-mail-probe-smoke; exit 1; fi
          curl -fsS http://127.0.0.1:18080/operator-admin.html | grep -q 'breederApplicationAlert'
          echo 'ONE_SHOT_MAIL_PROBE_FULL_REGRESSION_OK'
