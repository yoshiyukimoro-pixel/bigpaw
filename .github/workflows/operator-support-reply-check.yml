name: Operator support reply safe check

on:
  push:
    branches:
      - feature/operator-support-reply-20260928
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax check reply patch
        run: python3 -m py_compile app/backend/operator_support_reply_patch.py

      - name: Build BIG PAW image without deploying
        run: docker build --no-cache -t bigpaw-support-reply-check .

      - name: Verify reply feature and protected operator scope
        run: |
          docker run --rm --entrypoint python3 bigpaw-support-reply-check -c "from pathlib import Path; s=Path('/app/backend/server.py').read_text(); h=Path('/app/operator-support.html').read_text(); compile(s,'/app/backend/server.py','exec'); assert 'CREATE TABLE IF NOT EXISTS support_replies' in s; assert \"/api/operator/support/([^/]+)/reply\" in s; assert \"/api/operator/support/([^/]+)/replies\" in s; assert \"self.require(['operator'])\" in s; assert 'support_reply_sent' in s; assert '返信する' in h; assert '送信する' in h; assert '/operator/support/' in h; print('OPERATOR_SUPPORT_REPLY_ACCEPTANCE_OK|server_syntax=valid')"

      - name: Railway-equivalent production startup smoke test
        run: |
          set -euo pipefail
          START="python3 backend/auth_cookie_hardening_patch.py && python3 backend/safari_gallery_runtime_patch.py && python3 backend/support_contact_runtime_patch.py && python3 backend/offsite_backup_runtime_patch.py && python3 backend/login_prompt_runtime_patch.py && python3 backend/direct_payment_runtime_patch.py && python3 backend/breeder_mobile_menu_runtime_patch.py && exec python3 backend/start_live.py"
          docker run -d --name bigpaw-support-smoke -p 18080:8080 \
            -e PORT=8080 \
            -e BIGPAW_ENV=production \
            -e BIGPAW_DATA_DIR=/tmp/bigpaw-data \
            -e BIGPAW_ADMIN_EMAIL=smoke@example.com \
            -e BIGPAW_ADMIN_PASSWORD='SmokeTestPassword123!' \
            -e BIGPAW_PAYMENT_MODE=manual \
            bigpaw-support-reply-check sh -c "$START"
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/api/health >/tmp/health.json; then
              ok=1
              break
            fi
            if ! docker inspect -f '{{.State.Running}}' bigpaw-support-smoke 2>/dev/null | grep -q true; then
              break
            fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            echo 'RUNTIME_SMOKE_FAIL'
            docker logs bigpaw-support-smoke || true
            exit 1
          fi
          cat /tmp/health.json
          docker logs bigpaw-support-smoke 2>&1 | tee /tmp/runtime.log
          grep -q 'SAFARI_GALLERY_HARDENING_OK' /tmp/runtime.log
          grep -q 'GLOBAL_MOBILE_MENU_OK' /tmp/runtime.log
          echo 'RUNTIME_SMOKE_OK|health=200|railway_start_chain=passed'
          docker rm -f bigpaw-support-smoke >/dev/null
