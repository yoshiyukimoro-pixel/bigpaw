name: BIG PAW real Square-originated Sandbox webhook in NEW isolated Railway DB

on:
  push:
    branches:
      - feature/dogfood-shop-staging-20261028
    paths:
      - '.github/workflows/shop-square-origin-new-staging-once.yml'

permissions:
  contents: read

# One approved real Square-originated fake paid test; disable the NEW subscription in always() cleanup.
concurrency:
  group: bigpaw-new-staging-square-origin-sandbox-one-time
  cancel-in-progress: false

jobs:
  offline-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: No-network tests of subscription switch and strict safeguards
        run: |
          PYTHONPATH=. python3 scripts/test-shop-square-origin-isolated-once.py
          PYTHONPATH=. python3 scripts/test-shop-new-isolated-real-paid.py
          python3 -m py_compile scripts/run-shop-new-sandbox-square-origin-e2e.py
          node --check scripts/smoke-shop-square-hosted-panel.cjs
  one-real-sandbox-delivery:
    needs: offline-preflight
    if: github.ref == 'refs/heads/feature/dogfood-shop-staging-20261028' && github.event_name == 'push' && contains(github.event.head_commit.message, '[square-origin-staging-one-shot-opt-in]')
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Prepare exactly one fake Sandbox link in NEW private persistent DB
        env:
          BIGPAW_ISOLATED_REAL_SANDBOX_PAYMENT_OPT_IN: '1'
          BIGPAW_SHOP_STAGING_RAILWAY_PROJECT_TOKEN: ${{ secrets.BIGPAW_SHOP_STAGING_RAILWAY_PROJECT_TOKEN }}
          BIGPAW_SQUARE_SANDBOX_ACCESS_TOKEN: ${{ secrets.BIGPAW_SQUARE_SANDBOX_ACCESS_TOKEN }}
          BIGPAW_SQUARE_SANDBOX_LOCATION_ID: ${{ secrets.BIGPAW_SQUARE_SANDBOX_LOCATION_ID }}
        run: PYTHONPATH=. python3 scripts/smoke-shop-new-isolated-paid-checkout.py prepare
      - name: TEMPORARILY enable ONLY the NEW isolated Square Sandbox notification
        env:
          BIGPAW_ISOLATED_REAL_SANDBOX_PAYMENT_OPT_IN: '1'
          BIGPAW_SQUARE_ORIGIN_NEW_STAGING_ONESHOT_OPT_IN: '1'
          BIGPAW_SHOP_STAGING_RAILWAY_PROJECT_TOKEN: ${{ secrets.BIGPAW_SHOP_STAGING_RAILWAY_PROJECT_TOKEN }}
          BIGPAW_SQUARE_SANDBOX_ACCESS_TOKEN: ${{ secrets.BIGPAW_SQUARE_SANDBOX_ACCESS_TOKEN }}
          BIGPAW_SQUARE_SANDBOX_LOCATION_ID: ${{ secrets.BIGPAW_SQUARE_SANDBOX_LOCATION_ID }}
        run: PYTHONPATH=. python3 scripts/run-shop-new-sandbox-square-origin-e2e.py on
      - name: Official Square Sandbox Testing Panel, fake test payment only
        run: |
          timeout 180s docker run --rm \
            -v "$PWD:/work" -v "$RUNNER_TEMP:/sandbox-tmp" \
            -e SHOP_PANEL_JSON=/sandbox-tmp/bigpaw-new-stage-checkout.json \
            -w /work mcr.microsoft.com/playwright:v1.55.0-noble \
            bash -lc 'npm install --no-save playwright@1.55.0 >/dev/null 2>&1 && node scripts/smoke-shop-square-hosted-panel.cjs'
      - name: Verify NEW durable paid order only from REAL Square-originated notification
        env:
          BIGPAW_ISOLATED_REAL_SANDBOX_PAYMENT_OPT_IN: '1'
          BIGPAW_SQUARE_ORIGIN_NEW_STAGING_ONESHOT_OPT_IN: '1'
          BIGPAW_SHOP_STAGING_RAILWAY_PROJECT_TOKEN: ${{ secrets.BIGPAW_SHOP_STAGING_RAILWAY_PROJECT_TOKEN }}
          BIGPAW_SQUARE_SANDBOX_ACCESS_TOKEN: ${{ secrets.BIGPAW_SQUARE_SANDBOX_ACCESS_TOKEN }}
          BIGPAW_SQUARE_SANDBOX_LOCATION_ID: ${{ secrets.BIGPAW_SQUARE_SANDBOX_LOCATION_ID }}
        run: PYTHONPATH=. python3 scripts/run-shop-new-sandbox-square-origin-e2e.py verify
      - name: ALWAYS disable NEW Square Sandbox subscriber and re-check old untouched
        if: always()
        env:
          BIGPAW_SQUARE_ORIGIN_NEW_STAGING_ONESHOT_OPT_IN: '1'
          BIGPAW_SQUARE_SANDBOX_ACCESS_TOKEN: ${{ secrets.BIGPAW_SQUARE_SANDBOX_ACCESS_TOKEN }}
        run: PYTHONPATH=. python3 scripts/run-shop-new-sandbox-square-origin-e2e.py off
      - name: ALWAYS delete ephemeral test payment URL and order IDs
        if: always()
        run: rm -f "$RUNNER_TEMP/bigpaw-new-stage-checkout.json"
