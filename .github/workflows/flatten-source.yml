name: Flatten BIG PAW source safely
on:
  push:
    branches:
      - build-flatten-work-20260924
    paths:
      - '.github/workflows/flatten-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flatten:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Confirm isolated branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "build-flatten-work-20260924"
          ! grep -R "/data" Dockerfile | grep -E "(rm|unlink|rmtree|DROP TABLE|DELETE FROM|TRUNCATE)" || exit 1
      - name: Convert Dockerfile to one-layer equivalent
        shell: python
        run: |
          from pathlib import Path
          import re
          src=Path("Dockerfile").read_text(encoding="utf-8")
          lines=src.splitlines()
          prefix=[]
          workdir="/"
          commands=[]
          copies=[]
          i=0
          while i < len(lines):
              raw=lines[i]
              s=raw.strip()
              if not s or s.startswith("#"):
                  i+=1; continue
              if s.startswith("FROM "):
                  prefix.append(raw); i+=1; continue
              if s.startswith("WORKDIR "):
                  workdir=s.split(None,1)[1].strip()
                  commands.append(f"cd {workdir!r}")
                  i+=1; continue
              if s.startswith("COPY "):
                  parts=s.split()
                  if len(parts)!=3 or parts[1].startswith("--"):
                      raise SystemExit(f"Unsupported COPY at line {i+1}: {raw}")
                  copies.append((parts[1],parts[2]))
                  i+=1; continue
              if s.startswith("RUN "):
                  block=[raw[raw.index("RUN ")+4:]]
                  while block[-1].rstrip().endswith("\\"):
                      i+=1
                      block.append(lines[i])
                  commands.append("\n".join(block))
                  i+=1; continue
              if s.startswith(("ARG ","ENV ","EXPOSE ","CMD ","ENTRYPOINT ","LABEL ","USER ")):
                  prefix.append(raw); i+=1; continue
              raise SystemExit(f"Unsupported Dockerfile instruction at line {i+1}: {raw}")
          pre=["FROM python:3.13-slim","WORKDIR /app"]
          for srcp,dst in copies:
              pre.append(f"COPY {srcp} {dst}")
          script="set -eu\n"+"\n".join(commands)
          out="\n".join(pre)+"\nRUN <<'BIGPAW_FLATTEN'\n"+script+"\nBIGPAW_FLATTEN\n"
          for raw in prefix:
              if raw.strip().startswith(("EXPOSE ","CMD ","ENTRYPOINT ","ENV ","ARG ","LABEL ","USER ")):
                  out+=raw+"\n"
          Path("Dockerfile.flatten").write_text(out,encoding="utf-8")
          print("FLATTEN_PLAN_OK", "copies",len(copies),"commands",len(commands),"run_layers",1)
      - name: Build one-layer equivalent
        run: docker build --no-cache -f Dockerfile.flatten -t bigpaw-flatten-reference .
      - name: Extract final application filesystem
        shell: bash
        run: |
          set -euo pipefail
          cid="$(docker create bigpaw-flatten-reference)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p flattened-app
          docker cp "$cid":/app/BIG_PAW_v1.0_FINAL3_domain_ready_package/. flattened-app/
          python3 -m py_compile flattened-app/backend/server.py
          find flattened-app -type f -print0 | sort -z | xargs -0 sha256sum > flattened-manifest.sha256
      - name: Upload reference snapshot
        uses: actions/upload-artifact@v4
        with:
          name: bigpaw-flatten-reference
          path: |
            flattened-app
            flattened-manifest.sha256
          if-no-files-found: error
