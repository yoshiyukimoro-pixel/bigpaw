name: Weekly Drive backup safety checks

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'app/backend/server.py'
      - 'scripts/weekly_drive_backup.py'
      - 'scripts/test_weekly_drive_backup.py'
      - 'scripts/weekly_drive_scheduler.py'
      - 'scripts/test_weekly_drive_scheduler.py'
      - 'scripts/test_weekly_drive_retention.py'
      - '.github/workflows/weekly-drive-backup-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check Python syntax and SQLite snapshot
        run: |
          python -m py_compile app/backend/server.py
          python -m py_compile scripts/weekly_drive_backup.py
          python scripts/test_weekly_drive_backup.py
          python -m py_compile scripts/weekly_drive_scheduler.py
          python scripts/test_weekly_drive_scheduler.py
          python scripts/test_weekly_drive_retention.py

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build production image without deploying
        run: docker build --tag bigpaw-weekly-backup-ci .
