name: Public puppy inquiry button safety
on:
  pull_request:
    paths:
      - "app/puppy-detail.html"
      - "app/inquiry.html"
      - "app/backend/puppy_inquiry_cta_test.py"
      - "scripts/test-puppy-inquiry-visible.cjs"
      - ".github/workflows/puppy-inquiry-cta-safety.yml"
  push:
    branches: [main]
    paths:
      - "app/puppy-detail.html"
      - "app/inquiry.html"
      - "app/backend/puppy_inquiry_cta_test.py"
      - ".github/workflows/puppy-inquiry-cta-safety.yml"
  workflow_dispatch:
jobs:
  inquiry-cta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify visible puppy CTA on desktop/mobile and preserved inquiry workflow
        run: python3 app/backend/puppy_inquiry_cta_test.py
      - name: Install Chromium for mobile and desktop layout checks
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify visible inquiry button and navigate to the correct puppy form
        run: node scripts/test-puppy-inquiry-visible.cjs
