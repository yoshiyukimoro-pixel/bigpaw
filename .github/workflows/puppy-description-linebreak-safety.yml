name: Puppy description linebreak safety

on:
  push:
    branches:
      - fix/puppy-description-linebreak-20260928
  workflow_dispatch:

jobs:
  safety-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify change scope and data path
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          css = Path('app/assets/style.css').read_text(encoding='utf-8')
          detail = Path('app/puppy-detail.html').read_text(encoding='utf-8')
          editor = Path('app/breeder-puppy-new.html').read_text(encoding='utf-8')
          server = Path('app/backend/server.py').read_text(encoding='utf-8')

          assert '#desc{white-space:pre-wrap;line-height:1.85;overflow-wrap:anywhere;word-break:normal}' in css
          assert '<link rel="stylesheet" href="assets/style.css">' in detail
          assert '<p id="desc"></p>' in detail
          assert "desc.textContent=p.desc||'詳しい紹介文を掲載します。'" in detail
          assert 'desc:desc.value' in editor
          assert "'desc':d['description']" in server
          print('STATIC_LINEBREAK_PATH_OK')
          PY

      - name: Verify only CSS is changed from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD | grep -v '^.github/workflows/puppy-description-linebreak-safety.yml$' || true)"
          test "$changed" = "app/assets/style.css"
          git diff --stat origin/main...HEAD
          echo 'CHANGE_SCOPE_OK'

      - name: Build production Docker image
        shell: bash
        run: |
          set -euo pipefail
          docker build --progress=plain -t bigpaw-linebreak-check .

      - name: Start container and verify health/data/CSS
        shell: bash
        run: |
          set -euo pipefail
          cid="$(docker run -d -p 18080:8080 -e BIGPAW_ENV=development bigpaw-linebreak-check)"
          trap 'docker logs "$cid" || true; docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT

          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18080/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/api/health

          docker exec "$cid" python3 - <<'PY'
          from pathlib import Path
          import sqlite3
          db = Path('/app/backend/bigpaw.sqlite3')
          con = sqlite3.connect(db)
          sample = '1段落目\n2行目\n\n2段落目'
          con.execute('UPDATE puppies SET description=? WHERE id=?', (sample, 'p1'))
          con.commit()
          con.close()
          PY

          python3 - <<'PY'
          import json, urllib.request
          base='http://127.0.0.1:18080'
          with urllib.request.urlopen(base+'/api/puppies/p1') as r:
              payload=json.load(r)
          expected='1段落目\n2行目\n\n2段落目'
          assert payload.get('desc') == expected, repr(payload.get('desc'))
          css=urllib.request.urlopen(base+'/assets/style.css').read().decode('utf-8')
          assert '#desc{white-space:pre-wrap;line-height:1.85;overflow-wrap:anywhere;word-break:normal}' in css
          html=urllib.request.urlopen(base+'/puppy-detail.html?id=p1').read().decode('utf-8')
          assert '<p id="desc"></p>' in html
          print('RUNTIME_LINEBREAK_DATA_OK')
          PY
