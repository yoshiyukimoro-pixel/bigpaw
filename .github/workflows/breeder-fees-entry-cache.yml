name: Breeder dashboard fee link fresh-page safety gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/admin.html'
      - 'app/breeder-billing.html'
      - 'app/breeder-sales-handover.html'
      - 'app/breeder-fee-agreement.html'
      - 'app/breeder-register.html'
      - 'app/mobile-global-nav.js'
      - 'app/breeder-mobile-nav.js'
      - 'app/breeder-fees.html'
      - 'scripts/test-breeder-fees-entry-cache.cjs'
      - '.github/workflows/breeder-fees-entry-cache.yml'
jobs:
  versioned-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check all breeder fee entry links, route detection and no buyer change
        run: node scripts/test-breeder-fees-entry-cache.cjs
      - name: Full production Docker build and regression checks on isolated test data
        run: docker build --no-cache -t bigpaw-breeder-fees-link-cache .
