name: Puppy video Cloudflare Stream safety gate

on:
  push:
    branches:
      - feature/puppy-video-cloudflare-20261026
      - main
  pull_request:
    paths:
      - 'app/backend/server.py'
      - 'app/backend/puppy_video_http_test.py'
      - 'app/backend/cloudflare_stream_probe.py'
      - 'app/backend/cloudflare_stream_probe_test.py'
      - 'app/backend/start_live.py'
      - 'app/assets/api.js'
      - 'app/assets/puppy-video.js'
      - 'app/assets/puppy-video-public.js'
      - 'app/breeder-puppy-new.html'
      - 'app/puppy-detail.html'
      - 'scripts/test-puppy-video-browser.cjs'
      - '.github/workflows/puppy-video-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  puppy-video-safety:
    name: Docker, existing regressions, Chrome and Safari
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Static syntax and safety assertions
        run: |
          set -euo pipefail
          python3 -m py_compile app/backend/server.py app/backend/puppy_video_http_test.py app/backend/cloudflare_stream_probe.py app/backend/cloudflare_stream_probe_test.py app/backend/start_live.py app/backend/stream_tus_smoke_probe.py app/backend/final_core_regression_test.py
          node --check app/assets/api.js
          node --check app/assets/puppy-video.js
          node --check app/assets/puppy-video-public.js
          node --check scripts/test-puppy-video-browser.cjs
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app/backend/server.py').read_text(encoding='utf-8')
          ui=Path('app/breeder-puppy-new.html').read_text(encoding='utf-8')
          js=Path('app/assets/puppy-video.js').read_text(encoding='utf-8')
          public=Path('app/assets/puppy-video-public.js').read_text(encoding='utf-8')
          assert 'PUPPY_VIDEO_MAX_SECONDS = 60' in s
          assert "'maxDurationSeconds':PUPPY_VIDEO_MAX_SECONDS" in s
          assert 'video_uid' in s and 'video_status' in s
          assert "create_stream_direct_upload" in s
          assert "delete_stream_video" in s
          assert "https://*.cloudflarestream.com" in s
          assert "https://*.videodelivery.net" in s
          assert '動画を追加（1本まで）' in ui
          assert '動画は60秒以内でアップロードしてください。60秒を超える動画は登録できません。' in ui
          assert 'MAX_SECONDS=60' in js
          assert 'videoEmbedUrl' in public
          # Video bytes must never be written to the existing Railway upload directory.
          video_route=s[s.index("m=re.fullmatch(r'/api/puppies/([^/]+)/video-upload'"):s.index("if path=='/api/puppies':",s.index("m=re.fullmatch(r'/api/puppies/([^/]+)/video-upload'"))]
          assert 'UPLOADS' not in video_route
          import ast,base64,zlib
          probe=Path('app/backend/stream_tus_smoke_probe.py').read_text(encoding='utf-8')
          module=ast.parse(probe)
          seed=next(x.value.value for x in module.body if isinstance(x,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='DATA' for t in x.targets))
          sample=zlib.decompress(base64.b64decode(seed))
          assert 1024<len(sample)<10000 and sample[4:8]==b'ftyp'
          assert 'finally:' in probe and 'DELETE' in probe
          print('PUPPY_VIDEO_STATIC_SAFETY_OK')
          PY

      - name: Build full production-equivalent Docker image
        run: docker build --no-cache -t bigpaw-puppy-video .

      - name: Run isolated Stream backend regression against built image
        run: |
          docker run --rm             -e BIGPAW_ENV=development             -e BIGPAW_DEV_LINKS=0             bigpaw-puppy-video python3 backend/puppy_video_http_test.py

      - name: Test sanitized Cloudflare 403 probe without external calls
        run: docker run --rm bigpaw-puppy-video python3 backend/cloudflare_stream_probe_test.py

      - name: Run existing planned-litter regression against built image
        run: |
          docker run --rm             -e BIGPAW_ENV=development             -e BIGPAW_DEV_LINKS=0             bigpaw-puppy-video python3 backend/planned_litters_http_test.py

      - name: Launch disposable built server
        run: |
          set -euo pipefail
          docker run -d --name bigpaw-video-browser -p 18106:8080             -e PORT=8080             -e BIGPAW_ENV=development             -e BIGPAW_DATA_DIR=/tmp/bigpaw-video-browser             -e BIGPAW_DEV_LINKS=1             -e BIGPAW_AUTOMATION_INTERVAL_SECONDS=86400             bigpaw-puppy-video python3 backend/server.py
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18106/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then
            docker logs bigpaw-video-browser --tail 200
            exit 1
          fi

      - name: Run current final-image core regression
        run: docker run --rm bigpaw-puppy-video python3 backend/final_core_regression_test.py

      - name: Run desktop Chrome and iPhone Safari WebKit in official browser image
        run: |
          set -euo pipefail
          echo "VIDEO_BROWSER_GATE_START"
          timeout 360s docker run --rm --network host \
            -v "$PWD:/work" -v /tmp:/tmp -w /work \
            mcr.microsoft.com/playwright:v1.55.0-noble \
            bash -lc 'set -e; echo VIDEO_BROWSER_NPM_START; timeout 90s npm install --no-save playwright@1.55.0 >/dev/null 2>&1; echo VIDEO_BROWSER_RUN_START; timeout 240s node scripts/test-puppy-video-browser.cjs http://127.0.0.1:18106; echo VIDEO_BROWSER_GATE_OK'

      - name: Final health check and cleanup
        if: always()
        run: |
          curl -fsS http://127.0.0.1:18106/api/health || true
          docker logs bigpaw-video-browser --tail 120 || true
          docker rm -f bigpaw-video-browser >/dev/null 2>&1 || true


  puppy-video-production-readonly:
    name: Production video read-only verification
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for production release and verify video configuration without writes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,time,urllib.request
          base='https://bigpaw.site'
          headers={'Cache-Control':'no-cache','User-Agent':'BIGPAW-puppy-video-readonly/1.0'}
          def read(path):
              req=urllib.request.Request(base+path,headers=headers)
              with urllib.request.urlopen(req,timeout=15) as r:
                  if r.status!=200:
                      raise RuntimeError(f'{path} HTTP {r.status}')
                  return r.read(2500000).decode('utf-8','replace')
          last=''
          for attempt in range(90):
              try:
                  health=json.loads(read('/api/health?release=puppy-video-20261026'))
                  editor=read('/breeder-puppy-new.html?release=puppy-video-20261026')
                  public=read('/puppy-detail.html?id=p1&release=puppy-video-20261026')
                  js=read('/assets/puppy-video.js?v=20261026-1&release=puppy-video-20261026')
                  public_js=read('/assets/puppy-video-public.js?v=20261026-1&release=puppy-video-20261026')
                  if not (health.get('ok') and health.get('environment')=='production'):
                      raise AssertionError('production health not ready: '+repr(health))
                  if '動画を追加（1本まで）' not in editor or '60秒以内' not in editor:
                      raise AssertionError('video editor release marker not live')
                  if 'MAX_SECONDS=60' not in js:
                      raise AssertionError('60-second browser guard not live')
                  if 'puppy-video-public.js' not in public or 'videoEmbedUrl' not in public_js:
                      raise AssertionError('public player release marker not live')
                  configured=bool(health.get('videoConfigured'))
                  print('PUPPY_VIDEO_PRODUCTION_CODE_LIVE|editor|60sec|public_player|health',flush=True)
                  print('PUPPY_VIDEO_STREAM_CONFIGURED|'+('yes' if configured else 'no'),flush=True)
                  if not configured:
                      raise AssertionError('Cloudflare Stream production credentials are not configured')
                  break
              except Exception as exc:
                  last=f'{type(exc).__name__}: {exc}'
                  if attempt==89:
                      raise
                  print('Waiting for production puppy-video rollout, check',attempt+1,last,flush=True)
                  time.sleep(4)
          print('PUPPY_VIDEO_PRODUCTION_READONLY_OK|code_live|stream_configured|no_writes',flush=True)
          PY
