name: BIG PAW Square Sandbox webhook subscriptions READ ONLY

on:
  push:
    branches:
      - feature/dogfood-shop-staging-20261028
    paths:
      - '.github/workflows/shop-square-subscriptions-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Test GET-only subscription audit with synthetic Square responses
        run: PYTHONPATH=. python3 scripts/test-shop-square-subscriptions-readonly.py
      - name: List existing Sandbox webhook subscriptions without modifications
        env:
          BIGPAW_SQUARE_SANDBOX_ACCESS_TOKEN: ${{ secrets.BIGPAW_SQUARE_SANDBOX_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 scripts/audit-shop-square-subscriptions-readonly.py | tee /tmp/bigpaw-square-sandbox-subscription-check.txt
          grep -Fqx 'SHOP_SQUARE_SANDBOX_SUBSCRIPTIONS=old_enabled_payment_updated__new_disabled_payment_updated__read_only' /tmp/bigpaw-square-sandbox-subscription-check.txt
          grep -Fqx 'SHOP_SQUARE_WEBHOOK_MUTATIONS=ZERO' /tmp/bigpaw-square-sandbox-subscription-check.txt
# One-shot delivery follow-up 2026-10-31: confirm existing enabled and new disabled without writes.
# Square-originated fake paid event complete: after-job audit old enabled and new disabled, GET-only.
