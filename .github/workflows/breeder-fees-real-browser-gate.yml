name: REAL breeder fee mobile menu and rendered campaign E2E
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/backend/breeder_mobile_menu_runtime_patch.py'
      - 'app/mobile-global-nav.js'
      - 'app/breeder-register.html'
      - 'app/auth-return-fix.js'
      - 'app/breeder-fees.html'
      - 'app/breeder-fee-agreement.html'
      - 'app/assets/breeder-fee-agreement-campaign.js'
      - 'app/terms.html'
      - 'scripts/test-breeder-fee-agreement-campaign.cjs'
      - 'app/admin.html'
      - 'app/assets/breeder-dashboard-campaign.js'
      - 'scripts/test-breeder-dashboard-banner.cjs'
      - 'scripts/test-breeder-signup-blue-mobile.cjs'
      - 'app/assets/breeder-fees-campaign.js'
      - 'app/breeder-billing.html'
      - 'app/breeder-invoice.html'
      - 'app/operator-invoices.html'
      - 'app/operator-invoice-preview.html'
      - 'app/backend/server.py'
      - 'scripts/test-oshiwan-invoice-visual.cjs'
      - 'scripts/test-breeder-fees-real-browser.cjs'
      - '.github/workflows/breeder-fees-real-browser-gate.yml'
  push:
    branches: [main]
    paths:
      - 'app/backend/breeder_mobile_menu_runtime_patch.py'
      - 'app/mobile-global-nav.js'
      - 'app/breeder-register.html'
      - 'app/auth-return-fix.js'
      - 'app/breeder-fees.html'
      - 'app/breeder-fee-agreement.html'
      - 'app/assets/breeder-fee-agreement-campaign.js'
      - 'app/terms.html'
      - 'scripts/test-breeder-fee-agreement-campaign.cjs'
      - 'app/admin.html'
      - 'app/assets/breeder-dashboard-campaign.js'
      - 'scripts/test-breeder-dashboard-banner.cjs'
      - 'scripts/test-breeder-signup-blue-mobile.cjs'
      - 'app/assets/breeder-fees-campaign.js'
      - 'app/breeder-billing.html'
      - 'app/breeder-invoice.html'
      - 'app/operator-invoices.html'
      - 'app/operator-invoice-preview.html'
      - 'app/backend/server.py'
      - 'scripts/test-oshiwan-invoice-visual.cjs'
      - 'scripts/test-breeder-fees-real-browser.cjs'
      - '.github/workflows/breeder-fees-real-browser-gate.yml'
jobs:
  real-mobile-click:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Full production image build and legacy feature regression checks
        run: docker build --no-cache -t bigpaw-real-fee-mobile-gate .
      - name: Launch disposable development server with test-only free quota
        run: |
          set -euo pipefail
          docker run -d --name bigpaw-real-fee-mobile-ci -p 18096:8080 \
            -e PORT=8080 -e BIGPAW_ENV=development -e BIGPAW_CAMPAIGN_100_ENABLED=1 \
            -e BIGPAW_DATA_DIR=/tmp/fee-pricing-mobile-e2e-only \
            -e BIGPAW_ADMIN_EMAIL=qa@example.invalid -e BIGPAW_ADMIN_PASSWORD='QAOnly1234Password!' \
            -e BIGPAW_PAYMENT_MODE=demo \
            bigpaw-real-fee-mobile-gate sh -c "python3 backend/auth_cookie_hardening_patch.py && python3 backend/safari_gallery_runtime_patch.py && python3 backend/support_contact_runtime_patch.py && python3 backend/offsite_backup_runtime_patch.py && python3 backend/login_prompt_runtime_patch.py && python3 backend/direct_payment_runtime_patch.py && python3 backend/breeder_mobile_menu_runtime_patch.py && exec python3 backend/start_live.py"
          ready=0
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18096/api/health >/tmp/bigpaw-fee-mobile-health.json 2>/dev/null; then ready=1;break;fi
            sleep 2
          done
          if [ "$ready" != 1 ];then docker logs bigpaw-real-fee-mobile-ci --tail 130;exit 1;fi
          python3 - <<'PY'
          import json,urllib.request
          h=json.load(open('/tmp/bigpaw-fee-mobile-health.json'))
          assert h['environment']=='development' and h['paymentMode']=='demo' and not h['mailConfigured'],h
          c=json.load(urllib.request.urlopen('http://127.0.0.1:18096/api/campaign/first100'))
          assert c['status']=='active' and c['limit']==100,c
          print('SAFE_DISPOSABLE_CAMPAIGN_TEST_ENV_OK')
          PY
      - name: Install Playwright with real WebKit engine plus existing Chrome
        run: |
          npm install --no-save playwright
          (command -v google-chrome || command -v google-chrome-stable || command -v chromium) && (google-chrome --version || google-chrome-stable --version || chromium --version)
          npx playwright install --with-deps webkit
      - name: Assert live campaign fees, breeder agreement and signup are consistent
        run: node scripts/test-breeder-fee-agreement-campaign.cjs
      - name: Tap sandbox mobile breeder menu in Chromium and WebKit
        env:
          BIGPAW_TEST_WEBKIT: '1'
        run: node scripts/test-breeder-fees-real-browser.cjs http://127.0.0.1:18096
      - name: Verify breeder dashboard banner in actual Chromium and WebKit against disposable test quota
        env:
          BIGPAW_TEST_WEBKIT: '1'
        run: node scripts/test-breeder-dashboard-banner.cjs http://127.0.0.1:18096
      - name: Verify first-100 Oshiwan invoices and seven-day deadline render correctly on mobile Chrome and Safari
        env:
          BIGPAW_TEST_WEBKIT: '1'
        run: node scripts/test-oshiwan-invoice-visual.cjs http://127.0.0.1:18096
      - name: Test public home to blue breeder registration on Chromium and real Safari WebKit
        env:
          BIGPAW_TEST_WEBKIT: '1'
        run: node scripts/test-breeder-signup-blue-mobile.cjs http://127.0.0.1:18096
      - name: Wait for new release HTML on production after main is merged
        if: github.event_name == 'push'
        run: |
          ready=0
          for i in $(seq 1 90); do
            if curl -fsSL --max-time 15 'https://bigpaw.site/admin.html?release=20261024-promo-first1' | grep -Fq 'breeder-parent-entry.js?v=20261024-campaign-first1' && curl -fsSL --max-time 15 'https://bigpaw.site/breeder-fees.html?release=20261024-terms1' | grep -Fq 'breeder-fee-agreement.html?v=20261024-terms1'; then ready=1; break; fi
            sleep 4
          done
          if [ "$ready" != 1 ]; then echo 'PRODUCTION_FRESH_MENU_VERSION_MISSING'; exit 1; fi
      - name: Verify public production breeder mobile menu with read-only requests in both engines
        env:
          BIGPAW_TEST_WEBKIT: '1'
          BIGPAW_LIVE_READONLY: '1'
          BIGPAW_EXPECT_LIVE_FRESH: ${{ github.event_name == 'push' && '1' || '0' }}
        run: node scripts/test-breeder-fees-real-browser.cjs https://bigpaw.site
      - name: Verify current production dashboard campaign banner read-only in Chromium and WebKit
        if: github.event_name == 'push'
        env:
          BIGPAW_TEST_WEBKIT: '1'
          BIGPAW_DASHBOARD_LIVE_READONLY: '1'
        run: node scripts/test-breeder-dashboard-banner.cjs https://bigpaw.site
      - name: Verify production public-to-breeder signup menu blue in both browsers (read-only)
        if: github.event_name == 'push'
        env:
          BIGPAW_TEST_WEBKIT: '1'
          BIGPAW_DASHBOARD_LIVE_READONLY: '1'
        run: node scripts/test-breeder-signup-blue-mobile.cjs https://bigpaw.site
      - name: Log test-only server for failure analysis
        if: failure()
        run: docker logs bigpaw-real-fee-mobile-ci --tail 160 || true
      - name: Remove disposable server
        if: always()
        run: docker rm -f bigpaw-real-fee-mobile-ci >/dev/null 2>&1 || true
