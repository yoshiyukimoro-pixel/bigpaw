name: BIG PAW opt-in Square Sandbox -> Railway staging secret sync

on:
  push:
    branches:
      - feature/dogfood-shop-staging-20261028
  workflow_dispatch:
    inputs:
      approve_staging_secret_sync:
        description: "Only the new isolated Railway staging Sandbox webhook, no production changes"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  isolated-staging-secret-sync:
    if: github.ref == 'refs/heads/feature/dogfood-shop-staging-20261028' && ((github.event_name == 'push' && contains(github.event.head_commit.message, '[shop-staging-secret-sync-opt-in]')) || (github.event_name == 'workflow_dispatch' && inputs.approve_staging_secret_sync == true))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact project scope and disabled subscription with mock providers
        run: PYTHONPATH=. python3 scripts/test-shop-staging-sandbox-secret-sync.py
      - name: Transfer only 3 Sandbox secrets to NEW Railway staging webhook with no deployment
        env:
          BIGPAW_SHOP_STAGING_SECRET_SYNC_OPT_IN: '1'
          BIGPAW_SHOP_STAGING_RAILWAY_PROJECT_TOKEN: ${{ secrets.BIGPAW_SHOP_STAGING_RAILWAY_PROJECT_TOKEN }}
          BIGPAW_SQUARE_SANDBOX_ACCESS_TOKEN: ${{ secrets.BIGPAW_SQUARE_SANDBOX_ACCESS_TOKEN }}
          BIGPAW_SQUARE_SANDBOX_LOCATION_ID: ${{ secrets.BIGPAW_SQUARE_SANDBOX_LOCATION_ID }}
        run: PYTHONPATH=. python3 scripts/sync-shop-staging-sandbox-secrets.py
