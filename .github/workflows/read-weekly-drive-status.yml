name: Verify weekly Drive status probe removed

on:
  push:
    branches:
      - diag/read-weekly-drive-status

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify temporary status endpoint is gone
        run: |
          set -euo pipefail
          code="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 20 https://bigpaw.site/weekly-drive-status.json)"
          echo "HTTP_STATUS=$code"
          test "$code" = "404"
