name: Read weekly Drive status

on:
  push:
    branches:
      - diag/read-weekly-drive-status

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Read production backup status
        run: |
          set -euo pipefail
          curl -fsS --retry 2 --connect-timeout 10 --max-time 20 https://bigpaw.site/weekly-drive-status.json
