name: 推しワン breed search top-five gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/assets/oshiwan-search-priority.js'
      - 'app/search-list-rebuild.html'
      - 'app/index.html'
      - 'scripts/test-oshiwan-search-priority.cjs'
      - 'scripts/test-oshiwan-search-live-browser.cjs'
      - '.github/workflows/oshiwan-search-results.yml'
jobs:
  search-placement:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Validate 10-puppy search ordering, filters, labels and no duplicates
        run: node scripts/test-oshiwan-search-priority.cjs
      - name: Build actual application with full existing regression gates
        run: docker build --no-cache -t bigpaw-oshiwan-search-ci .
      - name: Start temporary production-equivalent server with disposable SQLite
        shell: bash
        run: |
          set -euo pipefail
          START="python3 backend/auth_cookie_hardening_patch.py && python3 backend/safari_gallery_runtime_patch.py && python3 backend/support_contact_runtime_patch.py && python3 backend/offsite_backup_runtime_patch.py && python3 backend/login_prompt_runtime_patch.py && python3 backend/direct_payment_runtime_patch.py && python3 backend/breeder_mobile_menu_runtime_patch.py && exec python3 backend/start_live.py"
          docker run -d --name bigpaw-oshiwan-search-ci -p 18089:8080 \
            -e PORT=8080 -e BIGPAW_ENV=production \
            -e BIGPAW_DATA_DIR=/tmp/oshiwan-search-isolated \
            -e BIGPAW_ADMIN_EMAIL=smoke@example.invalid \
            -e BIGPAW_ADMIN_PASSWORD='CIOnly123Password!' \
            -e BIGPAW_PAYMENT_MODE=demo \
            bigpaw-oshiwan-search-ci sh -c "$START"
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18089/api/health >/tmp/oshiwan-health.json 2>/dev/null; then ready=1;break;fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then docker logs bigpaw-oshiwan-search-ci --tail 200; exit 1;fi
          docker exec -i bigpaw-oshiwan-search-ci python3 - <<'PY'
          import sqlite3,time
          c=sqlite3.connect('/tmp/oshiwan-search-isolated/bigpaw.sqlite3')
          for i in range(10):
              uid=f'oshi-search-user-{i}'
              bid=f'oshi-search-breeder-{i}'
              pid=f'oshi-search-{i}'
              c.execute("INSERT INTO users(id,role,email,salt,password_hash,created_at) VALUES(?,'breeder',?,'s','h',?)",(uid,f'oshi-search{i}@example.invalid',int(time.time())))
              c.execute("INSERT INTO breeders(id,user_id,kennel_name,prefecture,review_status) VALUES(?,?,?,'埼玉県','approved')",(bid,uid,f'推しワン検証犬舎{i}'))
              c.execute("""INSERT INTO puppies(id,breeder_id,name,breed,breed_key,gender,gender_key,color,price,status,area,area_key,created_at,review_status)
                  VALUES(?,?,?,'スタンダードプードル','standard-poodle',?,?,'ブラック',300000,'募集中','埼玉県','saitama',?,'approved')""",
                  (pid,bid,f'検索試験犬{i}','男の子' if i%2==0 else '女の子','male' if i%2==0 else 'female',int(time.time())+i))
              if i>=5:
                  c.execute("INSERT INTO oshiwan_entries(puppy_id,breeder_id,enabled_at) VALUES(?,?,?)",(pid,bid,int(time.time())+i))
          c.commit();c.close()
          print('ISOLATED_10_STANDARD_POODLES_SEEDED|5_promoted|5_regular|no_live_database')
          PY
          curl -fsS http://127.0.0.1:18089/search.html > /tmp/oshiwan-real-search.html
          grep -q 'oshiwan-search-priority.js' /tmp/oshiwan-real-search.html
          curl -fsS http://127.0.0.1:18089/assets/oshiwan-search-priority.js > /tmp/oshiwan-search-js.txt
          python3 - <<'PY'
          import json,urllib.request
          base='http://127.0.0.1:18089'
          arr=json.load(urllib.request.urlopen(base+'/api/puppies'))
          featured=json.load(urllib.request.urlopen(base+'/api/oshiwan'))
          assert len([p for p in arr if p['breedKey']=='standard-poodle'])==10,arr
          assert len(featured['groups'])==1
          assert len(featured['groups'][0]['puppies'])==5
          assert featured['advertisement'] is True
          print('OSHIWAN_SEARCH_ISOLATED_HTTP_GATE_OK')
          PY
      - name: Install test-only headless Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify iPhone-sized actual search DOM and filter updates
        run: node scripts/test-oshiwan-search-live-browser.cjs http://127.0.0.1:18089
      - name: Log failure without accessing production data
        if: failure()
        run: docker logs bigpaw-oshiwan-search-ci --tail 180 || true
      - name: Remove isolated server
        if: always()
        run: docker rm -f bigpaw-oshiwan-search-ci >/dev/null 2>&1 || true
