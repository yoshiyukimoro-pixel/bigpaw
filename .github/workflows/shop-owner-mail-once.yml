name: BIG PAW food shop owner email once-only Sandbox test

on:
  push:
    branches:
      - feature/dogfood-shop-staging-20261028

permissions:
  contents: read

concurrency:
  group: bigpaw-food-info-owner-mail-once
  cancel-in-progress: false

jobs:
  single-test-mail:
    # Never sends on normal pushes or from main.
    # Only one explicitly tagged commit may trigger this one-time test.
    if: github.ref == 'refs/heads/feature/dogfood-shop-staging-20261028' && github.event_name == 'push' && contains(github.event.head_commit.message, '[shop-operator-mail-smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify fixed destination and no-real-order safety gates (offline)
        run: |
          PYTHONPATH=. python3 scripts/test-shop-sandbox-operator-email.py
          PYTHONPATH=. python3 scripts/test-shop-operator-resend-once.py
          PYTHONPATH=. python3 scripts/test-shop-sandbox-notifications.py
      - name: Send ONE clearly labeled Sandbox test email only to info@bigpaw.site
        env:
          RESEND_API_KEY: \${{ secrets.RESEND_API_KEY }}
          BIGPAW_FOOD_MAIL_ONE_TIME: '1'
        run: PYTHONPATH=. python3 scripts/smoke-shop-operator-resend-once.py --confirm-once
