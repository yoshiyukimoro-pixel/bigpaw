name: BIG PAW dog food catalog staging safety

on:
  push:
    branches:
      - feature/dogfood-shop-staging-20261028
    paths:
      - 'app/shop.html'
      - 'app/shop-cart-preview.js'
      - 'app/shop-order-review.js'
      - 'app/shop-order-review.css'
      - 'app/shop-detail-images.js'
      - 'app/shop-detail-gallery.js'
      - 'app/shop-detail-gallery.css'
      - 'app/assets/shop-details/**'
      - 'shop_payments/**'
      - 'scripts/test-shop-square.py'
      - 'scripts/test-shop-square-sandbox.py'
      - 'scripts/test-shop-retail-pricebook.py'
      - 'scripts/test-shop-local-preview.py'
      - 'scripts/test-shop-square-reconcile.py'
      - 'scripts/test-shop-sandbox-fulfillment.py'
      - 'scripts/shop-sandbox-operator.py'
      - 'scripts/test-shop-sandbox-operator.py'
      - 'shop_payments/sandbox_procurement.py'
      - 'scripts/test-shop-sandbox-procurement.py'
      - 'shop_payments/sandbox_notifications.py'
      - 'scripts/test-shop-sandbox-notifications.py'
      - 'scripts/test-shop-delivery-terms.py'
      - 'scripts/render-shop-sandbox-orders.py'
      - 'scripts/test-shop-sandbox-operator-report.py'
      - 'scripts/import-shop-images.py'
      - 'scripts/test-shop-image-import.py'
      - 'scripts/smoke-shop-square-sandbox.py'
      - 'scripts/test-shop-square-smoke.py'
      - 'scripts/test-shop-square-card-smoke.py'
      - 'scripts/smoke-shop-square-standalone-payment.py'
      - 'scripts/test-shop-square-standalone-smoke.py'
      - 'scripts/smoke-shop-square-hosted-panel.py'
      - 'scripts/smoke-shop-square-hosted-panel.cjs'
      - 'scripts/test-shop-square-hosted-panel.py'
      - 'scripts/smoke-shop-square-card-payment.py'
      - 'scripts/test-shop-staging.py'
      - 'scripts/test-shop-staging.cjs'
      - 'scripts/test-shop-detail-images.cjs'
      - 'scripts/test-shop-detail-gallery.cjs'
      - 'scripts/test-shop-order-review.cjs'
      - 'scripts/test-shop-review-square-browser.cjs'
      - 'scripts/import-shop-detail-assets.py'
      - 'scripts/test-shop-detail-importer.py'
      - 'scripts/install-shop-98-assets.py'
      - 'scripts/test-shop-98-installer.py'
      - 'scripts/test-shop-square-browser.cjs'
      - '.github/workflows/shop-staging-check.yml'
      - '.github/workflows/square-sandbox-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Assert catalog size and prevent checkout
        run: python3 scripts/test-shop-staging.py
      - name: Square Sandbox integration safety unit tests (offline only)
        run: |
          PYTHONPATH=. python3 scripts/test-shop-square.py
          PYTHONPATH=. python3 scripts/test-shop-square-sandbox.py
          PYTHONPATH=. python3 scripts/test-shop-retail-pricebook.py
          PYTHONPATH=. python3 scripts/test-shop-local-preview.py
          PYTHONPATH=. python3 scripts/test-shop-square-reconcile.py
          PYTHONPATH=. python3 scripts/test-shop-sandbox-fulfillment.py
          PYTHONPATH=. python3 scripts/test-shop-sandbox-operator.py
          PYTHONPATH=. python3 scripts/test-shop-sandbox-procurement.py
          PYTHONPATH=. python3 scripts/test-shop-sandbox-notifications.py
          PYTHONPATH=. python3 scripts/test-shop-delivery-terms.py
          PYTHONPATH=. python3 scripts/test-shop-sandbox-operator-report.py
          PYTHONPATH=. python3 scripts/test-shop-image-import.py
          python3 -m py_compile scripts/import-shop-detail-assets.py
          PYTHONPATH=. python3 scripts/test-shop-detail-importer.py
          PYTHONPATH=. python3 scripts/test-shop-98-installer.py
          node scripts/test-shop-detail-images.cjs
          PYTHONPATH=. python3 scripts/test-shop-square-smoke.py
          PYTHONPATH=. python3 scripts/test-shop-square-card-smoke.py
          PYTHONPATH=. python3 scripts/test-shop-square-standalone-smoke.py
          PYTHONPATH=. python3 scripts/test-shop-square-hosted-panel.py
          python3 -m py_compile scripts/smoke-shop-square-hosted-panel.py
          node --check scripts/smoke-shop-square-hosted-panel.cjs
      - name: Test Chromium and iPhone Safari/WebKit with no production requests
        run: |
          timeout 600s docker run --rm -v "$PWD:/work" -w /work mcr.microsoft.com/playwright:v1.55.0-noble \
            bash -lc 'npm install --no-save playwright@1.55.0 >/dev/null 2>&1 && node scripts/test-shop-staging.cjs && node scripts/test-shop-square-browser.cjs && node scripts/test-shop-detail-gallery.cjs && node scripts/test-shop-order-review.cjs && node scripts/test-shop-review-square-browser.cjs'
