      - '.github/workflows/shop-staging-check.yml'
      - '.github/workflows/square-sandbox-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Assert catalog size and prevent checkout
        run: python3 scripts/test-shop-staging.py
      - name: Square Sandbox integration safety unit tests (offline only)
        run: |
          PYTHONPATH=. python3 scripts/test-shop-square.py
          PYTHONPATH=. python3 scripts/test-shop-square-sandbox.py
          PYTHONPATH=. python3 scripts/test-shop-retail-pricebook.py
          PYTHONPATH=. python3 scripts/test-shop-local-preview.py
          PYTHONPATH=. python3 scripts/test-shop-square-reconcile.py
          PYTHONPATH=. python3 scripts/test-shop-sandbox-fulfillment.py
          PYTHONPATH=. python3 scripts/test-shop-sandbox-operator.py
          PYTHONPATH=. python3 scripts/test-shop-sandbox-procurement.py
          PYTHONPATH=. python3 scripts/test-shop-sandbox-notifications.py
          PYTHONPATH=. python3 scripts/test-shop-sandbox-operator-email.py
          PYTHONPATH=. python3 scripts/test-shop-sandbox-auto-notify.py
          PYTHONPATH=. python3 scripts/test-shop-https-webhook.py
          PYTHONPATH=. python3 scripts/test-shop-staging-checkout-preview.py
          PYTHONPATH=. python3 scripts/test-shop-customer-mail-preflight.py
          PYTHONPATH=. python3 scripts/test-shop-customer-email-transport.py
          PYTHONPATH=. python3 scripts/test-shop-square-live-readonly.py
          PYTHONPATH=. python3 scripts/test-shop-live-order-ledger.py
          PYTHONPATH=. python3 scripts/test-shop-live-payment-intake.py
          PYTHONPATH=. python3 scripts/test-shop-live-order-overview.py
          PYTHONPATH=. python3 scripts/test-shop-live-checkout-intent.py
          PYTHONPATH=. python3 scripts/test-shop-square-live-checkout-adapter.py
          PYTHONPATH=. python3 scripts/test-shop-square-live-preflight.py
          PYTHONPATH=. python3 scripts/test-shop-live-checkout-flow.py
          PYTHONPATH=. python3 scripts/test-shop-live-checkout-controller.py
          PYTHONPATH=. python3 scripts/test-shop-live-http-bridge.py
          python3 -m py_compile app/backend/shop_live_checkout_bridge.py app/backend/server.py
          PYTHONPATH=. python3 scripts/test-shop-live-customer-notice-preview.py
          PYTHONPATH=. python3 scripts/test-shop-live-notice-approval.py
          PYTHONPATH=. python3 scripts/test-shop-staging-seed-order.py
          PYTHONPATH=. python3 scripts/test-shop-staging-seed-boot.py
          PYTHONPATH=. python3 scripts/test-shop-staging-paid-mail-once.py
          PYTHONPATH=. python3 scripts/test-shop-operator-resend-once.py
          PYTHONPATH=. python3 scripts/test-shop-operator-resend-audit.py
          PYTHONPATH=. python3 scripts/test-shop-info-mail-simple.py
          PYTHONPATH=. python3 scripts/test-shop-delivery-terms.py
          PYTHONPATH=. python3 scripts/test-shop-retail-launch-guard.py
          PYTHONPATH=. python3 scripts/test-shop-returns-policy.py
          PYTHONPATH=. python3 scripts/test-shop-sandbox-operator-report.py
          PYTHONPATH=. python3 scripts/test-shop-image-import.py
          python3 -m py_compile scripts/import-shop-detail-assets.py
          PYTHONPATH=. python3 scripts/test-shop-detail-importer.py
          PYTHONPATH=. python3 scripts/test-shop-98-installer.py
          python3 -m py_compile shop_payments/staging_https_webhook.py
          node scripts/test-shop-detail-images.cjs
          PYTHONPATH=. python3 scripts/test-shop-square-smoke.py
          PYTHONPATH=. python3 scripts/test-shop-square-card-smoke.py
          PYTHONPATH=. python3 scripts/test-shop-square-standalone-smoke.py
          PYTHONPATH=. python3 scripts/test-shop-square-hosted-panel.py
          python3 -m py_compile scripts/smoke-shop-square-hosted-panel.py
          node --check scripts/smoke-shop-square-hosted-panel.cjs
      - name: Build independent Sandbox webhook image (never deploy)
        run: |
          docker build -f Dockerfile.shop-staging -t bigpaw-shop-sandbox-webhook:ci .
      - name: Build BIG PAW app image with dormant checkout route (never deploy)
        run: |
          timeout 600s docker build -f Dockerfile -t bigpaw-shop-dormant-route:ci .
          docker run --rm --entrypoint python3 bigpaw-shop-dormant-route:ci -c "import sys; sys.path[:0]=['/app','/app/backend']; import shop_live_checkout_bridge,shop_payments.retail_launch_guard as g; assert not g.load_and_check()[0]; print('DORMANT_SHOP_ROUTE_IMAGE_OK|launch=disabled')"
      - name: Test Chromium and iPhone Safari/WebKit with no production requests
        run: |
          timeout 600s docker run --rm -v "$PWD:/work" -w /work mcr.microsoft.com/playwright:v1.55.0-noble \
            bash -lc 'npm install --no-save playwright@1.55.0 >/dev/null 2>&1 && node scripts/test-shop-staging.cjs && node scripts/test-shop-square-browser.cjs && node scripts/test-shop-detail-gallery.cjs && node scripts/test-shop-order-review.cjs && node scripts/test-shop-review-square-browser.cjs && node scripts/test-shop-live-order-preview-browser.cjs'
