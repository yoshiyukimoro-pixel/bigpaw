name: BIG PAW isolated Sandbox preview credentials OFF setup
on:
  push:
    branches:
      - feature/dogfood-shop-staging-20261028
permissions:
  contents: read
jobs:
  one-time-isolated-only:
    if: github.ref == 'refs/heads/feature/dogfood-shop-staging-20261028' && contains(github.event.head_commit.message, '[shop-staging-preview-credentials-opt-in]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Offline scope/one-shot tests and payment-disabled preview contract
        run: |
          PYTHONPATH=. python3 scripts/test-shop-isolated-preview-credential-setup.py
          PYTHONPATH=. python3 scripts/test-shop-new-staging-preview-stop.py
      - name: Create only private preview username/password, keep flag OFF and skip deploy
        env:
          BIGPAW_SHOP_PREVIEW_CREDENTIAL_SETUP_OPT_IN: '1'
          BIGPAW_SHOP_STAGING_RAILWAY_PROJECT_TOKEN: ${{ secrets.BIGPAW_SHOP_STAGING_RAILWAY_PROJECT_TOKEN }}
        run: PYTHONPATH=. python3 scripts/setup-shop-isolated-preview-credentials-once.py
