name: BIG PAW isolated paid Square recovery READ ONLY
on:
  push:
    branches:
      - feature/dogfood-shop-staging-20261028
    paths:
      - '.github/workflows/shop-new-staging-paid-durability-readonly.yml'
permissions:
  contents: read
jobs:
  uniquely-identify-square-payment:
    if: github.ref == 'refs/heads/feature/dogfood-shop-staging-20261028'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Offline unique-payment proof first
        run: PYTHONPATH=. python3 scripts/test-shop-new-isolated-paid-durability.py
      - name: Read-only Square Sandbox unique paid order recovery (no IDs in output)
        env:
          BIGPAW_STAGING_PAID_RECOVERY_READONLY_OPT_IN: '1'
          BIGPAW_SQUARE_SANDBOX_ACCESS_TOKEN: ${{ secrets.BIGPAW_SQUARE_SANDBOX_ACCESS_TOKEN }}
          BIGPAW_SQUARE_SANDBOX_LOCATION_ID: ${{ secrets.BIGPAW_SQUARE_SANDBOX_LOCATION_ID }}
          BIGPAW_SHOP_STAGING_RAILWAY_PROJECT_TOKEN: ${{ secrets.BIGPAW_SHOP_STAGING_RAILWAY_PROJECT_TOKEN }}
        run: PYTHONPATH=. python3 scripts/audit-shop-new-isolated-paid-durability.py square
