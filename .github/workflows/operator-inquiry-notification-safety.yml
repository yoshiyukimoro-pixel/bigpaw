name: Operator puppy inquiry notification safety

on:
  push:
    branches: [feature/operator-inquiry-alert-20261028]
  pull_request:

jobs:
  inquiry-notification-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile application and isolated test
        run: python3 -m py_compile app/backend/server.py app/backend/operator_inquiry_notification_test.py
      - name: Verify full inquiry flow, breeder notification, operator notification and failures
        run: python3 app/backend/operator_inquiry_notification_test.py
      - name: Verify patch leaves source files unchanged
        run: git diff --exit-code -- app/backend/server.py
