name: BIG PAW already-paid Sandbox shipping completeness READ ONLY
on:
  push:
    branches:
      - feature/dogfood-shop-staging-20261028
    paths:
      - '.github/workflows/shop-sandbox-real-shipping-readonly.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Offline shipping status, never expose PII or make provider writes
        run: |
          PYTHONPATH=. python3 scripts/test-shop-sandbox-real-shipping-readonly.py
          python3 -m py_compile scripts/check-shop-sandbox-real-shipping-readonly.py
  readonly-shipping:
    needs: offline
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/dogfood-shop-staging-20261028' && contains(github.event.head_commit.message, '[shop-readonly-actual-shipping-opt-in]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect ONLY previous fake-paid Square Sandbox order shipping completeness
        env:
          BIGPAW_SHOP_SHIPPING_STATUS_READONLY_OPT_IN: '1'
          BIGPAW_POST_STOP_DURABILITY_PROOF_OPT_IN: '1'
          BIGPAW_SHOP_STAGING_RAILWAY_PROJECT_TOKEN: ${{ secrets.BIGPAW_SHOP_STAGING_RAILWAY_PROJECT_TOKEN }}
          BIGPAW_SQUARE_SANDBOX_ACCESS_TOKEN: ${{ secrets.BIGPAW_SQUARE_SANDBOX_ACCESS_TOKEN }}
          BIGPAW_SQUARE_SANDBOX_LOCATION_ID: ${{ secrets.BIGPAW_SQUARE_SANDBOX_LOCATION_ID }}
        run: PYTHONPATH=. python3 scripts/check-shop-sandbox-real-shipping-readonly.py
